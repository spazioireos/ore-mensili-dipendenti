<style>

  body { margin:0; font-family:'IBM Plex Sans',sans-serif; background:#eef2f5; color:#1f2937; }
  .app-header { background:#0f2740; color:#fff; padding:10px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; position:sticky; top:0; z-index:50; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .app-header h1 { font-size:17px; margin:0; font-weight:800; letter-spacing:.3px; }
  .app-header .sub { font-size:11px; opacity:.7; }
  .spacer { flex:1; }
  .btn { border:none; border-radius:8px; padding:8px 13px; font-family:inherit; font-weight:700; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-save { background:#16a34a; color:#fff; }
  .btn-save.dirty { background:#dc2626; color:#fff; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(220,38,38,.5);} 50%{ box-shadow:0 0 0 6px rgba(220,38,38,0);} }
  .btn-ghost { background:rgba(255,255,255,.14); color:#fff; }
  .btn-ghost:hover { background:rgba(255,255,255,.24); }
  .btn-blue { background:#2563eb; color:#fff; }
  .btn-red { background:#dc2626; color:#fff; }
  .btn-gray { background:#e5e7eb; color:#374151; }
  .yearbar { display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.12); border-radius:8px; padding:3px 6px; }
  .yearbar button { background:none; border:none; color:#fff; font-size:16px; cursor:pointer; padding:2px 8px; border-radius:6px; }
  .yearbar button:hover { background:rgba(255,255,255,.2); }
  .yearbar .yr { font-weight:800; font-size:15px; min-width:52px; text-align:center; }
  .zoombar { display:flex; align-items:center; gap:10px; padding:6px 16px; background:#dbe4ec; border-bottom:1px solid #c3d0da; flex-wrap:wrap; }
  .zoombar .zlbl { font-size:12px; font-weight:700; color:#334155; }
  .zoombar input[type=range] { width:160px; accent-color:#2563eb; cursor:pointer; }
  .zoombar .zval { font-size:12px; font-weight:800; color:#0f2740; min-width:44px; text-align:center; background:#fff; border-radius:6px; padding:2px 6px; }
  .zoombar .zstep { border:none; background:#cbd5e1; color:#0f2740; width:26px; height:26px; border-radius:6px; font-size:15px; font-weight:800; cursor:pointer; }
  .zoombar .zstep:hover { background:#b6c2cf; }
  .zoombar .btn-fit { border:none; background:#2563eb; color:#fff; border-radius:7px; padding:6px 12px; font-family:inherit; font-weight:700; font-size:12px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .zoombar .btn-fit:hover { background:#1d4ed8; }
  .zoombar .btn-100 { border:none; background:#e5e7eb; color:#374151; border-radius:7px; padding:6px 10px; font-family:inherit; font-weight:700; font-size:12px; cursor:pointer; }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; padding:10px 16px 0; align-items:center; }
  .tab { padding:7px 13px; border-radius:9px 9px 0 0; background:#d5dee6; color:#374151; font-weight:700; font-size:13px; cursor:pointer; }
  .tab.active { background:#fff; color:#0f2740; box-shadow:0 -2px 4px rgba(0,0,0,.05); }
  .tab.filled::after { content:'•'; color:#16a34a; margin-left:5px; }
  .tab.rep { background:#0f2740; color:#fff; }
  .tab.rep.active { background:#fff; color:#0f2740; }
  .content { padding:16px; }
  .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .lock-badge { background:#7f1d1d; color:#fff; font-size:12px; font-weight:700; padding:3px 10px; border-radius:6px; }
  .lock-info { background:#fef2f2; border:1px solid #fca5a5; color:#7f1d1d; font-size:12px; padding:6px 12px; border-radius:8px; margin-bottom:12px; }
  .emp-card { background:#fff; border-radius:12px; margin-bottom:18px; box-shadow:0 3px 12px rgba(0,0,0,.14); overflow:hidden; border:2px solid #94a3b8; }
  .monthstrip { flex-basis:100%; background:#12324f; margin:8px -18px -10px; padding:7px 18px; font-size:17px; font-weight:800; letter-spacing:.6px; color:#fff; border-top:2px solid rgba(255,255,255,.15); }
  .emp-head { padding:9px 14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .emp-head .nome { font-size:19px; font-weight:800; letter-spacing:.4px; }
  .emp-head .pill { background:rgba(255,255,255,.6); border-radius:20px; padding:3px 11px; font-size:12px; font-weight:700; }
  .emp-head .pill.cess { background:#7f1d1d; color:#fff; }
  .emp-head .edit-mini { background:rgba(0,0,0,.16); color:#fff; border:none; border-radius:6px; width:26px; height:26px; cursor:pointer; font-size:13px; }
  .emp-head .edit-mini.qf { width:auto; padding:0 10px; height:26px; background:#0f2740; font-weight:700; font-size:12px; }
  .emp-head .edit-mini.svuota { width:auto; padding:0 10px; height:26px; background:#b45309; font-weight:700; font-size:12px; }
  .congua-btn.gray { background:#94a3b8; }
  .grid-wrap { overflow-x:auto; padding:10px 12px 4px; }
  table.cal { border-collapse:collapse; font-size:12px; }
  table.cal td { border:1px solid #e2e8f0; text-align:center; }
  td.wd { font-size:11px; color:#64748b; padding:2px 0; width:66px; }
  td.wd.we { color:#c026d3; font-weight:700; }
  td.wd.hol { color:#fff; font-weight:800; background:#B22222; }
  td.dn { font-size:13px; color:#0f2740; font-weight:700; padding:2px 0; background:#f8fafc; }
  td.dn.we { background:#fdf4ff; color:#c026d3; }
  td.dn.hol { background:#B22222; color:#fff; }
  td.tot-h { font-size:11px; font-weight:700; color:#0f2740; background:#e2e8f0; padding:2px 6px; }
  .cell-in { width:66px; height:34px; border:2px solid #f59e0b; background:#fffde7; text-align:center; font-family:inherit; padding:0; border-radius:4px; -webkit-appearance:none; appearance:none; }
  .cell-in::-webkit-calendar-picker-indicator { display:none; opacity:0; }
  .cell-in.is-num { font-weight:700; font-size:20px; }
  .cell-in.is-code { font-weight:600; font-size:11px; letter-spacing:-.3px; }
  .cell-in.blocked { border:1px dashed #cbd5e1; cursor:not-allowed; }
  .cell-in.trattino::placeholder { color:#b91c1c; opacity:1; font-weight:800; font-size:20px; }
  .cell-in.trattino { color:#b91c1c; }
  .cell-wrap { position:relative; display:inline-block; line-height:0; }
  .perm-flag { position:absolute; top:1px; right:1px; width:11px; height:11px; border-radius:50%; border:2px solid #fff; background:#7c3aed; cursor:pointer; opacity:0.16; padding:0; box-shadow:0 0 2px rgba(0,0,0,.3); }
  .perm-flag.on { opacity:1; }
  .cell-wrap:hover .perm-flag { opacity:0.6; }
  .cell-wrap:hover .perm-flag.on { opacity:1; }
  .cell-in:focus { outline:2px solid #2563eb; outline-offset:-1px; }
  td.tot-v { font-weight:700; font-size:19px; color:#0f2740; background:#eef2ff; padding:0 8px; min-width:64px; }
  .foot-line { display:flex; align-items:center; gap:10px; padding:8px 14px 2px; flex-wrap:wrap; }
  .foot-line .foot-tot { font-size:12px; color:#0f2740; font-weight:700; }
  .foot-line label { font-size:12px; color:#64748b; font-weight:700; }
  .dich-in { width:80px; border:2px solid #f59e0b; background:#fffde7; border-radius:6px; padding:4px 6px; font-family:inherit; font-size:14px; font-weight:800; text-align:center; }
  .provv-lbl { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; color:#92400e; background:#fffbeb; border:1px solid #fcd34d; border-radius:6px; padding:3px 8px; cursor:pointer; }
  .provv-base { font-size:12px; font-weight:700; border:1px solid #fcd34d; border-radius:6px; padding:3px 6px; background:#fff; }
  .conguaglio-warn { display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:800; color:#7c2d12; background:#ffedd5; border:2px solid #fb923c; border-radius:8px; padding:4px 10px; }
  .conguaglio-box { flex-basis:100%; margin-top:2px; font-size:13px; line-height:1.5; color:#7c2d12; background:#fff7ed; border:2px solid #fb923c; border-radius:8px; padding:6px 12px; }
  .cong { flex-basis:100%; margin-top:4px; border-radius:10px; padding:8px 12px; border:2px solid; }
  .cong.warn { background:#fff7ed; border-color:#fb923c; color:#7c2d12; }
  .cong.ok   { background:#ecfdf5; border-color:#34d399; color:#065f46; }
  .cong.over { background:#eff6ff; border-color:#60a5fa; color:#1e3a8a; }
  .cong-head { font-weight:800; font-size:13px; margin-bottom:6px; }
  .cong-row { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:6px; }
  .cong-chip { background:#fff; border:1px solid rgba(0,0,0,.15); border-radius:999px; padding:2px 10px; font-size:12px; font-weight:600; }
  .cong-chip b { font-weight:800; font-size:13px; }
  .cong-chip.strong { border-width:2px; border-color:currentColor; }
  .cong-chip.big { font-size:13px; padding:3px 12px; }
  .cong-chip.big b { font-size:16px; }
  .cong-op { font-weight:800; font-size:15px; opacity:.7; }
  .cong-bar { height:9px; background:rgba(0,0,0,.08); border-radius:999px; overflow:hidden; margin:2px 0 6px; }
  .cong-bar-fill { height:100%; background:currentColor; border-radius:999px; transition:width .2s; }
  .cong-res { font-size:12.5px; line-height:1.45; }
  .cong-status { display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:800; text-transform:uppercase; letter-spacing:.3px; padding:5px 14px; border-radius:8px; color:#fff; box-shadow:0 1px 4px rgba(0,0,0,.2); }
  .cong-status b { font-size:17px; font-weight:900; }
  .cong.warn .cong-status { background:#c2410c; }
  .cong.over .cong-status { background:#1d4ed8; }
  .cong.ok   .cong-status { background:#059669; }
  .azzera-btn { border:none; background:#334155; color:#fff; border-radius:7px; padding:4px 10px; font-weight:700; font-size:12px; cursor:pointer; }
  .azzera-btn.annulla { background:#94a3b8; }
  .congua-btn { border:none; background:#16a34a; color:#fff; border-radius:6px; padding:3px 8px; font-weight:700; font-size:12px; cursor:pointer; }
  .congua-btn:disabled { background:#cbd5e1; cursor:default; }
  .badge { border-radius:20px; padding:3px 12px; font-size:12px; font-weight:800; }
  .badge.ok { background:#dcfce7; color:#166534; }
  .badge.ko { background:#fef3c7; color:#b45309; }
  .sost-box { margin:4px 14px 10px; background:#fafafa; border:1px dashed #cbd5e1; border-radius:8px; padding:8px 10px; }
  .sost-head { font-size:11px; font-weight:800; color:#64748b; margin-bottom:6px; }
  .sost-row { display:flex; align-items:center; gap:8px; margin-bottom:5px; flex-wrap:wrap; }

  .sost-row .lbl { font-size:11px; color:#64748b; font-weight:700; }
  .btn-mini { border:none; border-radius:6px; padding:4px 10px; font-family:inherit; font-weight:700; font-size:12px; cursor:pointer; background:#e5e7eb; color:#374151; }
  .btn-mini.del { background:#fee2e2; color:#991b1b; padding:4px 8px; }
  .nota-line { padding:6px 14px 12px; display:flex; align-items:center; gap:8px; }
  .nota-line label { font-size:11px; color:#64748b; font-weight:700; white-space:nowrap; }
  .nota-in { flex:1; border:2px solid #f59e0b; background:#fffde7; border-radius:6px; padding:5px 8px; font-family:inherit; font-size:12px; }
  .note-box { margin:10px 14px 14px; padding:10px 12px; background:#fffbeb; border:2px solid #f59e0b; border-radius:10px; }
  .note-head { font-size:13px; font-weight:800; color:#92400e; margin-bottom:8px; letter-spacing:.3px; }
  .voce-row { display:flex; gap:8px; align-items:center; margin-bottom:6px; flex-wrap:wrap; }
  .voce-cat { border:2px solid #f59e0b; background:#fff; border-radius:6px; padding:5px 7px; font-family:inherit; font-size:12px; font-weight:700; min-width:280px; }
  .voce-txt { flex:1; min-width:160px; border:2px solid #f59e0b; background:#fffde7; border-radius:6px; padding:5px 8px; font-family:inherit; font-size:12px; }
  .voce-txt:disabled { background:#f1f5f9; border-color:#cbd5e1; color:#94a3b8; }
  .voce-del { border:none; background:#fee2e2; color:#b91c1c; border-radius:6px; width:22px; height:22px; cursor:pointer; font-weight:700; }
  .legend, .rep-box { background:#fff; border-radius:12px; padding:12px 16px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .legend h3, .rep-box h3 { margin:0 0 8px; font-size:14px; color:#0f2740; }
  .legend-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:5px; }
  .legend-item { display:flex; align-items:center; gap:7px; font-size:11px; }
  .legend-code { min-width:56px; text-align:center; border-radius:4px; padding:2px 4px; font-weight:800; font-size:11px; }
  table.rep { border-collapse:collapse; width:100%; font-size:14px; }
  table.rep th, table.rep td { border:1px solid #e2e8f0; padding:7px 10px; text-align:center; }
  table.rep th { background:#0f2740; color:#fff; font-size:13px; }
  table.rep td.name { text-align:left; font-weight:700; white-space:nowrap; }
  table.rep tr:nth-child(even) td { background:#f8fafc; }
  table.rep td.tot { font-weight:800; background:#eef2ff; }
  .rep-scroll { overflow-x:auto; }
  .flag-red { color:#dc2626; font-weight:800; }
  .flag-amber { color:#b45309; font-weight:800; }
  .overlay { position:fixed; inset:0; background:rgba(15,39,64,.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; }
  .modal { background:#fff; border-radius:14px; padding:22px; width:100%; max-width:460px; box-shadow:0 10px 40px rgba(0,0,0,.3); max-height:92vh; overflow:auto; }
  .modal h2 { margin:0 0 14px; font-size:17px; color:#0f2740; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:12px; font-weight:700; color:#374151; margin-bottom:4px; }
  .field input, .field select { width:100%; border:2px solid #f59e0b; background:#fffde7; border-radius:8px; padding:8px 10px; font-family:inherit; font-size:14px; }
  .frow { display:flex; gap:10px; } .frow .field { flex:1; }
  .color-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .swatch { width:28px; height:28px; border-radius:50%; cursor:pointer; border:3px solid transparent; }
  .swatch.sel { border-color:#0f2740; }
  .modal-actions { display:flex; gap:8px; justify-content:space-between; margin-top:18px; align-items:center; }
  .login-box { max-width:400px; margin:8vh auto; background:#fff; border-radius:16px; padding:30px; box-shadow:0 8px 30px rgba(0,0,0,.15); text-align:center; }
  .login-box .logo { font-size:22px; font-weight:800; color:#0f2740; }
  .login-box .tag { font-size:12px; color:#64748b; margin-bottom:20px; }
  .banner { background:#fef3c7; color:#92400e; font-size:12px; padding:6px 16px; text-align:center; font-weight:700; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#0f2740; color:#fff; padding:11px 20px; border-radius:10px; font-size:13px; font-weight:700; z-index:200; box-shadow:0 6px 20px rgba(0,0,0,.3); max-width:90%; text-align:center; }
  .toast.warn { background:#b45309; }
  .hidden-file { display:none; }
</style>

// converte una nota libera in {voce:{cat,testo}, resto} — non distruttivo, usato una-tantum
function notaToVoce(nota){
  const s = String(nota || "").trim();
  if (s === "") return { voce:null, resto:"" };
  const low = s.toLowerCase();
  if (low.indexOf("rimborso km") !== -1){
    const mm = s.match(/€\s*[0-9.,]+/);
    return { voce:{ cat:"INSERIRE RIMBORSO KM", testo: mm ? mm[0] : s }, resto:"" };
  }
  if (low.indexOf("malattia") !== -1 && (low.indexOf("primi tre") !== -1 || low.indexOf("3gg") !== -1 || low.indexOf("3 gg") !== -1 || low.indexOf("non liquidare") !== -1)){
    const mm = s.match(/[0-9]{1,2}\/[0-9]{1,2}(\s*-\s*[0-9]{1,2}\/[0-9]{1,2})?/);
    return { voce:{ cat:"GIORNI DI MALATTIA (PRIMI TRE DA NON PAGARE)", testo: mm ? mm[0] : s.replace(/verificare malattia/i,"").trim() }, resto:"" };
  }
  if (low.indexOf("malattia") !== -1 && (low.indexOf("carenza") !== -1 || low.indexOf("non pagare") !== -1)){
    const mm = s.match(/[0-9]{1,2}\/[0-9]{1,2}[^-]*/);
    return { voce:{ cat:"GIORNI DI MALATTIA DA NON PAGARE", testo: mm ? mm[0].trim() : s.replace(/verificare malattia/i,"").trim() }, resto:"" };
  }
  return { voce:null, resto:s };
}

function migrate(obj){
  if (!obj) return obj;
  if (!obj.anni) obj.anni = [];
  const oldRe = /^([A-Z]{3})(\d{2})$/;
  const map = {}; MONTH_ABBR.forEach(function(a,i){ map[a] = i+1; });
  const nuovoDati = {}; const anniSet = {};
  Object.keys(obj.dati || {}).forEach(function(k){
    const mm = k.match(oldRe);
    if (mm){ const mese=map[mm[1]], anno=2000+parseInt(mm[2],10); nuovoDati[monthKey(anno,mese)]=obj.dati[k]; anniSet[anno]=true; }
    else { nuovoDati[k]=obj.dati[k]; const p=k.split("-"); if (p.length===2) anniSet[parseInt(p[0],10)]=true; }
  });
  obj.dati = nuovoDati;
  Object.keys(anniSet).forEach(function(y){ if (obj.anni.indexOf(parseInt(y,10))===-1) obj.anni.push(parseInt(y,10)); });
  if (obj.anni.length === 0) obj.anni = [2026];
  obj.anni.sort(function(a,b){ return a-b; });
  (obj.dipendenti || []).forEach(function(dp, idx){
    if (!dp.colore) dp.colore = PALETTE[idx % PALETTE.length];
    if (dp.livello === undefined) dp.livello = "";
    if (dp.dataAssunzione === undefined) dp.dataAssunzione = "";
    if (dp.dataCessazione === undefined) dp.dataCessazione = "";
    if (dp.tipoContratto === undefined){
      const c = String(dp.contratto || "");
      const mm = c.match(/(\d{1,2}\/\d{1,2}\/\d{2,4})/);
      if (/DETERM|FINO AL/i.test(c) || mm){ dp.tipoContratto = "determinato"; dp.scadenza = mm ? mm[1] : (dp.scadenza||""); }
      else dp.tipoContratto = "indeterminato";
    }
    if (dp.scadenza === undefined) dp.scadenza = "";
    dp.dataAssunzione = expandDate(dp.dataAssunzione);
    dp.scadenza = expandDate(dp.scadenza);
    if (dp.dataCessazione) dp.dataCessazione = expandDate(dp.dataCessazione);
    if (dp.cessManuale === undefined) dp.cessManuale = (dp.dataCessazione && String(dp.dataCessazione).trim()!=="") ? true : false;
    if (dp.ana){ dp.ana.dataNascita=expandDate(dp.ana.dataNascita); dp.ana.dataContratto=expandDate(dp.ana.dataContratto); if(dp.ana.dataProrogaAtto) dp.ana.dataProrogaAtto=expandDate(dp.ana.dataProrogaAtto); }
    if (Array.isArray(dp.proroghe)) dp.proroghe = dp.proroghe.map(expandDate);
    if (Array.isArray(dp.trasformazioni)) dp.trasformazioni = dp.trasformazioni.map(function(t){ if(typeof t==="string") return { data:expandDate(t) }; const o=Object.assign({}, t); o.data=expandDate(o.data); return o; });
  });
  if (!obj.noteRecuperate2026){
    const byName = {}; (obj.dipendenti || []).forEach(function(d){ byName[String(d.nome).trim().toUpperCase()] = d.id; });
    Object.keys(NOTE_RECOVERY).forEach(function(mk){
      const rows = obj.dati[mk]; if (!rows) return;
      Object.keys(NOTE_RECOVERY[mk]).forEach(function(nm){
        const id = byName[nm.trim().toUpperCase()]; if (!id) return;
        const rec = rows[id];
        if (rec && (!rec.nota || String(rec.nota).trim() === "")) rec.nota = NOTE_RECOVERY[mk][nm];
      });
    });
    obj.noteRecuperate2026 = true;
  }
  // inizializzo le voci strutturate e converto una-tantum le note libere esistenti
  Object.keys(obj.dati || {}).forEach(function(mk){
    const rows = obj.dati[mk]; if (!rows) return;
    Object.keys(rows).forEach(function(id){
      const rec = rows[id]; if (!rec) return;
      if (!Array.isArray(rec.voci)) rec.voci = [];
    });
  });
  if (!obj.vociConvertite2026){
    Object.keys(obj.dati || {}).forEach(function(mk){
      const rows = obj.dati[mk]; if (!rows) return;
      Object.keys(rows).forEach(function(id){
        const rec = rows[id]; if (!rec) return;
        if (rec.nota && rec.nota.trim() !== "" && rec.voci.length === 0){
          const r = notaToVoce(rec.nota);
          if (r.voce){ rec.voci.push(r.voce); rec.nota = r.resto; }
        }
      });
    });
    obj.vociConvertite2026 = true;
  }
  if (!obj.locked || typeof obj.locked !== "object") obj.locked = {};
  (obj.dipendenti || []).forEach(function(d){ if (!Array.isArray(d.proroghe)) d.proroghe = []; if (!d.ana || typeof d.ana !== "object") d.ana = {};
    if (d.ana.struttura && !d.ana.specificaStruttura){ d.ana.specificaStruttura = d.ana.struttura; delete d.ana.struttura; }
    if (d.ana.locStruttura && !d.ana.ubicazione){ d.ana.ubicazione = d.ana.locStruttura; delete d.ana.locStruttura; }
  });
  obj.version = 4;
  return obj;
}

function totOfRec(rec, y, m){
  let t = 0; const nd = daysInMonth(y, m);
  for (let d = 1; d <= nd; d++) t += parseHour(rec.giorni[d]);
  return Math.round(t * 100) / 100;
}
function saldoPrec(state, anno, mese, dipId){
  const months = [];
  Object.keys(state.dati || {}).forEach(function(k){
    const mm = k.match(/^(\d{4})-(\d{1,2})$/); if (!mm) return;
    const y = parseInt(mm[1], 10), m = parseInt(mm[2], 10);
    if (y > anno || (y === anno && m >= mese)) return; // solo mesi precedenti
    const rec = state.dati[k][dipId]; if (!rec) return;
    months.push({ y:y, m:m, rec:rec, key:y*100+m });
  });
  months.sort(function(a,b){ return a.key - b.key; });
  let startIdx = 0;
  for (let i = 0; i < months.length; i++){ if (months[i].rec.saldoAzzerato) startIdx = i + 1; } // riparte dopo l'ultimo azzeramento
  let s = 0;
  for (let i = startIdx; i < months.length; i++){
    const d = String(months[i].rec.dich == null ? "" : months[i].rec.dich).trim(); if (d === "") continue;
    const D = parseFloat(d.replace(",", ".")); if (isNaN(D)) continue;
    s += (D - totOfRec(months[i].rec, months[i].y, months[i].m));
  }
  return Math.round(s * 100) / 100;
}
function dipSorted(state){
  const arr = state.dipendenti.slice();
  arr.sort(function(a,b){ return a.nome.localeCompare(b.nome); });
  return arr;
}

    put(0, 0, "Report Ore mensile — " + MONTH_LABEL[m-1] + " " + anno, styTitle);
    merges.push({ s:{r:0,c:0}, e:{r:0,c:dips.length} });
    // intestazioni
    put(1, 0, "Giorno", styGiornoHead);
    dips.forEach(function(dp, i){
      const info = hoursDisp(oreSettAt(dp,anno,m)) + " h/sett · " + contrLabelAt(dp,anno,m) + (livelloAt(dp,anno,m) ? " · Liv. " + livelloAt(dp,anno,m) : "");
      put(1, i+1, dp.nome + "\n" + info, styEmpHead);
    });
    // giorni
    const tot = dips.map(function(){ return 0; });
    for (let d = 1; d <= nd; d++){
      const rr = 1 + d;
      const rosso = isRosso(festivitaSet(anno), anno, m, d);
      put(rr, 0, d + " " + WD[weekdayOf(anno, m, d)], rosso ? styDayR : styDay);
      dips.forEach(function(dp, i){
        const rec = getRecFrom(state, anno, m, dp.id);
        const val = (rec.giorni && rec.giorni[d] !== undefined) ? rec.giorni[d] : "";
        const num = parseHour(val); tot[i] += num;
        const cell = (val === "" ? (rosso ? "–" : null) : (num !== 0 && !CODE_SET[String(val).trim()] ? num : val));
        put(rr, i+1, cell, hourStyle(val));
        const perm = (rec.permessi && rec.permessi[d]) ? rec.permessi[d] : null;
        if (perm){ commentMap[rr+"_"+(i+1)] = "Permesso orario: " + fmt2(perm.ore) + " h (" + perm.tipo + ")"; if (rows[rr][i+1] === null || rows[rr][i+1] === undefined) rows[rr][i+1] = ""; }
      });
    }
    // TOT
    const rTot = 2 + nd;
    put(rTot, 0, "TOT", styTotLbl);
    dips.forEach(function(dp, i){ put(rTot, i+1, Math.round(tot[i]*100)/100, styTot); });
    // note e permessi del mese, sotto
    let rr = rTot + 2;
    dips.forEach(function(dp){
      const rec = getRecFrom(state, anno, m, dp.id);
      const vl = vociLines(rec);
      vl.forEach(function(line){
        put(rr, 0, "Nota — " + dp.nome + ": " + line, styNote);
        merges.push({ s:{r:rr,c:0}, e:{r:rr,c:dips.length} }); rr++;
      });
    });
    dips.forEach(function(dp){
      const rec = getRecFrom(state, anno, m, dp.id);
      if (rec.permessi){
        Object.keys(rec.permessi).forEach(function(d){
          const pr = rec.permessi[d];
          put(rr, 0, "Permesso orario — " + dp.nome + " g." + d + ": " + fmt2(pr.ore) + " h (" + pr.tipo + ") — non incluso nel TOT", styPerm);
          merges.push({ s:{r:rr,c:0}, e:{r:rr,c:dips.length} }); rr++;
        });
      }
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    Object.keys(styleMap).forEach(function(key){
      const parts = key.split("_");
      const ref = XLSX.utils.encode_cell({ r:parseInt(parts[0],10), c:parseInt(parts[1],10) });
      if (ws[ref]) ws[ref].s = styleMap[key];
    });
    Object.keys(commentMap).forEach(function(key){
      const parts = key.split("_");
      const ref = XLSX.utils.encode_cell({ r:parseInt(parts[0],10), c:parseInt(parts[1],10) });
      if (!ws[ref]) ws[ref] = { t:"s", v:"" };
      ws[ref].c = [{ a:"Christian Canonica", t:commentMap[key] }];
      ws[ref].c.hidden = true;
    });
    ws["!merges"] = merges;
    const cols = [{wch:11}]; for (let i=0;i<dips.length;i++) cols.push({wch:14}); ws["!cols"] = cols;
    const wrows = [{hpt:20},{hpt:46}]; ws["!rows"] = wrows;
    XLSX.utils.book_append_sheet(wb, ws, MONTH_ABBR[m-1] + String(anno).slice(2));
  });
  XLSX.writeFile(wb, fileName("xlsx"));
}

/* ===================== EXPORT PDF A4 verticale (matrice) ===================== */
function pdfHM(v){
  const n = parseFloat(String(v == null ? "" : v).replace(",", "."));
  if (isNaN(n)) return String(v == null ? "" : v);
  const neg = n < 0; const a = Math.abs(n);
  let h = Math.floor(a); let mm = Math.round((a - h) * 60);
  if (mm === 60){ h += 1; mm = 0; }
  return (neg ? "-" : "") + h + " h e " + (mm < 10 ? "0" : "") + mm + " min";
}
function esportaPDF(state, pairs){
  const JsPDF = window.jspdf.jsPDF;
  const doc = new JsPDF({ orientation:"landscape", unit:"mm", format:"a4" });
  const dips = dipSorted(state);
  const MAXCOL = 14; // massimo dipendenti per pagina A4 orizzontale
  let first = true;
  pairs.forEach(function(pr){
    const anno = pr.y, m = pr.m;
    const fset = festivitaSet(anno);
    const mk = monthKey(anno, m);
    const dati = state.dati[mk] || {};
    const haData = Object.keys(dati).some(function(k){ const rr=dati[k]; return rr.giorni && Object.keys(rr.giorni).length>0; });
    if (!haData) return;
    const nd = daysInMonth(anno, m);
    // spezzo i dipendenti in blocchi da MAXCOL
    const chunks = []; for (let i=0; i<dips.length; i+=MAXCOL) chunks.push(dips.slice(i, i+MAXCOL));
    if (chunks.length === 0) chunks.push([]);
    const permMese = []; const noteMese = [];
    dips.forEach(function(dp){ const rec = getRecFrom(state, anno, m, dp.id); const vl = vociLines(rec); if (vl.length > 0) noteMese.push({ nome: dp.nome, righe: vl }); });
    // larghezza colonna UNICA per tutte le pagine (basata sul blocco più grande = min(dip, MAXCOL)+1 colonne)
    const colW = Math.round((269 / (2 + Math.min(dips.length, MAXCOL))) * 100) / 100;

    chunks.forEach(function(chunk, ci){
      if (!first) doc.addPage();
      first = false;
      doc.setFontSize(12); doc.setTextColor(15,39,64); doc.setFont(undefined,"bold");
      let titolo = "Spazio Ireos — Report Ore   ·   " + MONTH_LABEL[m-1] + " " + anno;
      if (chunks.length > 1) titolo += "   (dipendenti " + (ci*MAXCOL+1) + "–" + (ci*MAXCOL+chunk.length) + " di " + dips.length + " · pag. " + (ci+1) + "/" + chunks.length + ")";
      doc.text(titolo, 14, 12);
      doc.setFont(undefined,"normal");
      const head = [["Giorno"].concat(chunk.map(function(dp){ return dp.nome; })).concat(["Giorno"])];
      const body = [];
      const tot = chunk.map(function(){ return 0; });
      for (let d=1; d<=nd; d++){
        const rosso = isRosso(fset, anno, m, d);
        const dayLabel = d + " " + WD[weekdayOf(anno, m, d)];
        const row = [dayLabel];
        chunk.forEach(function(dp, i){
          const rec = getRecFrom(state, anno, m, dp.id);
          const v = rec.giorni[d];
          const perm = (rec.permessi && rec.permessi[d]) ? rec.permessi[d] : null;
          tot[i] += parseHour(v === undefined ? "" : v);
          let txt;
          if (v === undefined || v === "") txt = rosso ? "–" : "";
          else if (CODE_SET[String(v).trim()]) txt = String(v).trim();
          else txt = pdfHM(v);
          if (perm){ txt = (txt === "*" || txt === "" ? "*" : txt + "*"); permMese.push(dp.nome + " g." + d + " " + fmt2(perm.ore) + " h (" + perm.tipo + ")"); }
          row.push(txt);
        });
        row.push(dayLabel);
        body.push(row);
      }
      const totRow = ["TOT"].concat(tot.map(function(t){ return pdfHM(Math.round(t*100)/100); })).concat(["TOT"]);
      body.push(totRow);
      const ncols = 2 + chunk.length;
      const lastIdx = chunk.length + 1;
      doc.autoTable({
        head: head, body: body, startY: 16, theme:"grid", margin:{ left:14, right:14 }, tableWidth: ncols*colW,
        styles:{ fontSize:6, cellPadding:0.8, halign:"center", valign:"middle", lineColor:[210,210,210], lineWidth:0.1, overflow:"linebreak", cellWidth:colW, fontStyle:"bold" },
        headStyles:{ fillColor:[15,39,64], textColor:[255,255,255], fontSize:5.6, valign:"middle", fontStyle:"bold", cellWidth:colW },
        columnStyles:(function(){ const cs={ 0:{ halign:"left", fontStyle:"bold", cellWidth:colW } }; cs[lastIdx]={ halign:"left", fontStyle:"bold", cellWidth:colW }; return cs; })(),
        didParseCell: function(data){
          const ci = data.column.index;
          const isDayCol = (ci === 0 || ci === lastIdx);
          if (isDayCol){ data.cell.styles.lineColor = [15,39,64]; data.cell.styles.lineWidth = 0.5; }
          if (data.section !== "body") return;
          const ri = data.row.index;
          const raw = String(data.cell.raw || "").trim();
          const isNum = /^\d+ h e \d{2} min\*?$/.test(raw); // ore in formato "H h e MM min"
          const isWhole = /^\d+ h e 00 min\*?$/.test(raw); // ore intere -> "00 min" in grigio
          if (!isDayCol && isWhole){ data.cell.__hm00 = true; data.cell.text = [""]; }
          if (ri === nd){ data.cell.styles.fontStyle = "bold"; data.cell.styles.fillColor = [238,242,255]; if (!isDayCol) data.cell.styles.fontSize = 7; return; }
          const day = ri + 1;
          if (isDayCol){
            if (isRosso(fset, anno, m, day)){ data.cell.styles.fillColor = [178,34,34]; data.cell.styles.textColor = [255,255,255]; }
          } else {
            if (isNum) data.cell.styles.fontSize = 7; // ore in formato esteso: un filo più grandi ma su una riga
            const txt = raw.replace(/\*$/, "");
            if (CODE_SET[txt]){
              const hx = CODE_SET[txt].bg.replace("#","");
              data.cell.styles.fillColor = [parseInt(hx.slice(0,2),16), parseInt(hx.slice(2,4),16), parseInt(hx.slice(4,6),16)];
              data.cell.styles.textColor = lumaText(CODE_SET[txt].bg) === "#ffffff" ? [255,255,255] : [17,24,39];
            }
          }
        },
        didDrawCell: function(data){
          if (data.section === "body" && data.row.index < nd && weekdayOf(anno, m, data.row.index + 1) === 0){
            doc.setDrawColor(15, 39, 64); doc.setLineWidth(0.5);
            doc.line(data.cell.x, data.cell.y + data.cell.height, data.cell.x + data.cell.width, data.cell.y + data.cell.height);
          }
          if (!data.cell.__hm00) return;
          let raw = String(data.cell.raw || "").trim();
          let star = ""; if (raw.slice(-1) === "*"){ star = "*"; raw = raw.slice(0, -1); }
          const p2 = "00 min" + star;
          const p1 = raw.slice(0, raw.length - "00 min".length);
          const fs = data.cell.styles.fontSize || 9;
          doc.setFontSize(fs); doc.setFont(undefined, "bold");
          const w1 = doc.getTextWidth(p1); const w2 = doc.getTextWidth(p2);
          const cx = data.cell.x + data.cell.width / 2;
          const cy = data.cell.y + data.cell.height / 2;
          const sx = cx - (w1 + w2) / 2;
          const tc = data.cell.styles.textColor;
          if (Array.isArray(tc)) doc.setTextColor(tc[0], tc[1], tc[2]); else doc.setTextColor(17, 24, 39);
          doc.text(p1, sx, cy, { baseline:"middle" });
          doc.setTextColor(180, 180, 180);
          doc.text(p2, sx + w1, cy, { baseline:"middle" });
        }
      });

      if (ci === chunks.length - 1){
        let yy = doc.lastAutoTable.finalY + 6;
        const ensureY = function(h){ if (yy + h > 287){ doc.addPage(); yy = 18; } };
        // NOTE DEL MESE — ben visibili, subito sotto la tabella
        if (noteMese.length > 0){
          ensureY(10);
          doc.setFillColor(255,249,224); doc.setDrawColor(245,158,11); doc.setLineWidth(0.4);
          const boxH = 6.5 + noteMese.reduce(function(a,n){ return a + 4.6 + n.righe.reduce(function(b,rg){ return b + Math.max(1, doc.splitTextToSize(rg, 165).length) * 4.2; }, 0); }, 0) + 3;
          if (yy + boxH > 287){ doc.addPage(); yy = 18; }
          doc.rect(13, yy - 4, 184, boxH, "FD");
          doc.setFontSize(10.5); doc.setTextColor(146,64,14); doc.setFont(undefined,"bold");
          doc.text("NOTE DEL MESE", 15, yy); yy += 6;
          noteMese.forEach(function(n){
            doc.setFontSize(8.4); doc.setFont(undefined,"bold"); doc.setTextColor(15,39,64);
            ensureY(4.6); doc.text("•  " + n.nome, 15, yy); yy += 4.4;
            doc.setFont(undefined,"normal"); doc.setTextColor(40,40,40); doc.setFontSize(8);
            n.righe.forEach(function(rg){
              const ls = doc.splitTextToSize(rg, 165);
              ls.forEach(function(line){ ensureY(4.2); doc.text(line, 20, yy); yy += 4.2; });
            });
            yy += 1;
          });
          yy += 2;
        }
        if (permMese.length > 0){
          yy += 1; ensureY(4);
          doc.setFontSize(7); doc.setTextColor(15,39,64); doc.setFont(undefined,"bold");
          doc.text("Permessi orari (segnalati con *, non inclusi nel TOT):", 14, yy); yy += 3.6; doc.setFont(undefined,"normal");
          doc.setFontSize(6.5); doc.setTextColor(70,70,70);
          permMese.forEach(function(pp){ const ls = doc.splitTextToSize("•  " + pp, 269); ensureY(ls.length * 3.2); doc.text(ls, 14, yy); yy += ls.length * 3.2; });
        }
      }
    });
  });
  if (first){ doc.setFontSize(12); doc.text("Nessun dato nel periodo selezionato", 14, 24); }
  doc.save(fileName("pdf"));
}

/* ===================== IMPORT EXCEL ===================== */
function importaExcel(file, state, onDone){
  const reader = new FileReader();
  reader.onload = function(ev){
    try {
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, { type:"array", cellDates:true });
      const next = JSON.parse(JSON.stringify(state));
      const byName = {}; next.dipendenti.forEach(function(d){ byName[d.nome.trim().toUpperCase()] = d.id; });
      const sheetRe = /^([A-Z]{3})(\d{2})$/;
      const mAbbr = {}; MONTH_ABBR.forEach(function(a,i){ mAbbr[a] = i+1; });
      wb.SheetNames.forEach(function(sn){
        const mm = sn.trim().toUpperCase().match(sheetRe);
        if (!mm || mAbbr[mm[1]] === undefined) return;
        const mese = mAbbr[mm[1]], anno = 2000 + parseInt(mm[2],10);
        if (next.anni.indexOf(anno) === -1) next.anni.push(anno);
        const ws = wb.Sheets[sn];
        const aoa = XLSX.utils.sheet_to_json(ws, { header:1, raw:true });
        for (let i = 0; i < aoa.length; i++){
          const row = aoa[i] || []; const nome = row[0];
          if (typeof nome === "string" && String(row[10]).trim() === "ORE SETT"){
            const key = nome.trim().toUpperCase(); let id = byName[key];
            if (!id){ id = uid(); next.dipendenti.push({ id:id, nome:key, livello:"", oreSett:Number(row[11])||0, tipoContratto:"indeterminato", scadenza:"", dataAssunzione:"", dataCessazione:"", colore: PALETTE[next.dipendenti.length % PALETTE.length] }); byName[key] = id; }
            const hoursRow = aoa[i+4] || []; const nd = daysInMonth(anno, mese); const giorni = {};
            for (let d = 1; d <= nd; d++){
              const cell = hoursRow[d-1];
              if (cell === undefined || cell === null || cell === "") continue;
              giorni[d] = (typeof cell === "number") ? cell : String(cell).trim();
            }
            const notaRow = aoa[i+5] || []; let nota = ""; const nv = notaRow[0];
            if (typeof nv === "string" && nv.trim() !== "" && nv.indexOf("min") === -1) nota = nv.trim();
            const mk = monthKey(anno, mese); if (!next.dati[mk]) next.dati[mk] = {}; next.dati[mk][id] = { giorni:giorni, nota:nota };
          }
        }
      });
      next.anni.sort(function(a,b){ return a-b; }); next.updatedAt = new Date().toISOString();
      onDone(next, null);
    } catch (e) { console.error("importaExcel", e); onDone(null, "File non leggibile o formato non riconosciuto."); }
  };
  reader.onerror = function(){ onDone(null, "Errore di lettura del file."); };
  reader.readAsArrayBuffer(file);
}

/* ===================== COMPONENTI ===================== */
function Toast(props){
  useEffect(function(){ const t = setTimeout(props.onDone, props.warn ? 3600 : 2600); return function(){ clearTimeout(t); }; }, []);
  return <div className={"toast" + (props.warn ? " warn" : "")}>{props.msg}</div>;
}

function CellInput(props){
  const [foc, setFoc] = useState(false);
  const val = (props.value === undefined || props.value === null) ? "" : props.value;
  const s = String(val).trim();
  const isCode = CODE_SET[s] !== undefined;
  let display;
  if (foc) display = String(val);
  else if (s === "") display = "";
  else if (isCode) display = s;
  else if (isNumeric(s)) display = fmt2(s);
  else display = String(val);
  const showTrattino = (s === "" && props.rosso && !props.disabled);
  return (
    <input className={"cell-in " + (isCode ? "is-code" : "is-num") + (props.disabled ? " blocked" : "") + (showTrattino ? " trattino" : "")}
      style={props.style} list={foc ? "codici-list" : undefined} title={props.title} disabled={props.disabled}
      value={display} placeholder={showTrattino ? "–" : ""}
      onFocus={function(){ setFoc(true); }}
      onBlur={function(e){ setFoc(false); if (props.onBlur) props.onBlur(e.target.value); }}
      onChange={function(e){ props.onChange(e.target.value); }} />
  );
}

function SostRow(props){
  const row = props.row;
  const known = props.dipList.indexOf(row.p) !== -1;
  const altro = (row.altro === true) || (!known && String(row.p || "") !== "");
  const selVal = altro ? "__ALTRO__" : (known ? row.p : "");
  const days = []; for (let d = 1; d <= props.nd; d++) days.push(d);
  return (
    <div className="sost-row">
      <span className="lbl">Giorno</span>
      <select value={row.g || 1} onChange={function(e){ props.onChange({ g:parseInt(e.target.value,10), p:row.p, altro:altro }); }}>
        {days.map(function(d){ return <option key={d} value={d}>{d}</option>; })}
      </select>
      <span className="lbl">sostituisce</span>
      <select value={selVal} onChange={function(e){
        const v = e.target.value;
        if (v === "__ALTRO__") props.onChange({ g:row.g||1, p:"", altro:true });
        else props.onChange({ g:row.g||1, p:v, altro:false });

        <option value="">— seleziona —</option>

function EmployeeCard(props){

    const s = String(val === undefined ? "" : val).trim();
    if (CODE_SET[s]) return { background:CODE_SET[s].bg, color:lumaText(CODE_SET[s].bg) };

    if (festivo && s === "") return { background:"#fdecec", borderColor:"#e9a8a8" };

  };

        <span className="pill">{contrLabelAt(dp,y,m)}</span>
        {(function(){ const ce=cessEffStr(dp); if(!ce) return null; const now=new Date(); const tInt=now.getFullYear()*10000+(now.getMonth()+1)*100+now.getDate(); const ceInt=ymdIt(ce); return (ceInt && ceInt < tInt) ? <span className="pill cess">CESSATO {ce}</span> : <span className="pill" style={{ background:"#e0e7ff", color:"#3730a3" }}>fino al {ce}</span>; })()}
        <div className="spacer"></div>

        {!mLocked ? <button className="edit-mini svuota" title="Svuota tutto il mese per questo dipendente (con conferma)" onClick={function(){ props.onSvuotaMese(dp.id); }}>🗑 Svuota mese</button> : null}
        <button className="edit-mini" title="Modifica anagrafica" onClick={function(){ props.onEditDip(dp); }}>✎</button>
        <button className="edit-mini" title="Elimina definitivamente" onClick={function(){ props.onDelDip(dp); }}>🗑</button>
      </div>
      <div className="grid-wrap">
        <table className="cal"><tbody>
          <tr>
            {days.map(function(d){
              const rosso = isRosso(fset, y, m, d);
              return <td key={"w"+d} className={"wd" + (rosso ? " hol" : "")}>{WD[weekdayOf(y, m, d)]}</td>;
            })}
            <td className="tot-h"></td>
          </tr>
          <tr>
            {days.map(function(d){
              const rosso = isRosso(fset, y, m, d);

              const val = rec.giorni[d] === undefined ? "" : rec.giorni[d];
              const rosso = isRosso(fset, y, m, d);
              const blocked = isBlockedDay(dp, y, m, d) || mLocked;
              const perm = (rec.permessi && rec.permessi[d]) ? rec.permessi[d] : null;
              return (
                <td key={"c"+d} style={{ padding:"1px" }}>
                  <div className="cell-wrap">
                    <CellInput value={val} disabled={blocked} rosso={rosso} style={cellStyle(val, rosso, blocked)}
                      title={cellTitle(val, blocked, rosso, perm)}
                      onChange={function(nv){ props.onCell(dp.id, d, nv); }}
                      onBlur={function(nv){ if (rosso && isNumeric(nv)) props.onFestConfirm(dp.id, d, nv); }} />
                    {(!blocked) ? <button className={"perm-flag" + (perm ? " on" : "")}
                      title={perm ? ("Permesso orario " + fmt2(perm.ore) + " h (" + perm.tipo + ") — clic per modificare") : "Aggiungi permesso orario"}
                      onClick={function(){ props.onOpenPerm(dp.id, d); }}></button> : null}
                  </div>
                </td>
              );
            })}
            <td className="tot-v">{fmt2(tot)}</td>
          </tr>
        </tbody></table>
      </div>
      <div className="foot-line">
        <span className="foot-tot">TOT calcolato: <b>{fmt2(tot)}</b></span>
        <label>Ore dichiarate (uso interno):</label>
        <input className="dich-in" value={rec.dich || ""} placeholder="—" disabled={mLocked}
          onChange={function(e){ props.onDich(dp.id, e.target.value); }} />
        {(function(){
          const s = String(rec.dich === undefined ? "" : rec.dich).trim();
          if (s === "") return null;
          const dn = parseFloat(s.replace(",", "."));
          if (isNaN(dn)) return <span className="badge ko">valore non valido</span>;
          const diff = Math.round((tot - dn) * 100) / 100;
          if (Math.abs(diff) <= 0.01) return <span className="badge ok">✓ torna</span>;
          return <span className="badge ko">Δ {(diff>0?"+":"")}{fmt2(diff)} {diff<0?"(mancano ore)":"(ore in più)"}</span>;
        })()}
        {(function(){
          const S = Math.round((props.saldoPrec || 0) * 100) / 100;
          const draw = String(rec.dich == null ? "" : rec.dich).trim();
          const P = tot;
          const azzerato = !!rec.saldoAzzerato;
          const hasD = draw !== "" && !isNaN(parseFloat(draw.replace(",", ".")));
          const D = hasD ? parseFloat(draw.replace(",", ".")) : 0;
          const daPag = hasD ? Math.round((S + D) * 100) / 100 : S;
          const manca = Math.round((daPag - P) * 100) / 100;
          const azzeraBtn = (!mLocked) ? <button className="azzera-btn" title="Considera saldato il credito/debito fino a questo mese: dal mese dopo il saldo riparte da zero" onClick={function(){ props.onAzzeraSaldo(dp.id); }}>⊘ Azzera saldo</button> : null;
          if (azzerato){
            return <div className="cong ok">
              <div className="cong-head">✓ Conguaglio ore — SALDO AZZERATO MANUALMENTE</div>
              <div className="cong-row">
                <span className="cong-status">Saldo azzerato ✓</span>
                <span className="cong-chip">Chiuso questo mese: <b>{fmt2(Math.abs(manca))} ore</b> {manca > 0.005 ? "(erano a credito operatore)" : (manca < -0.005 ? "(erano a debito operatore)" : "")}</span>
                {!mLocked ? <button className="azzera-btn annulla" title="Annulla l'azzeramento" onClick={function(){ props.onAnnullaAzzera(dp.id); }}>↩︎ Annulla azzeramento</button> : null}
              </div>
              <div className="cong-res">Dal mese successivo il saldo riparte da <b>zero</b>. I mesi precedenti restano invariati.</div>
            </div>;
          }
          if (!hasD){
            if (Math.abs(S) <= 0.005) return null;
            const cls = S > 0.005 ? "warn" : "over";
            return <div className={"cong " + cls}>
              <div className="cong-head">⚠️ Conguaglio ore — inserisci le “ore dichiarate” del mese</div>
              <div className="cong-row">
                <span className="cong-chip">Saldo precedente <b>{fmt2(S)}</b></span>
                <span className="cong-chip">Pagate finora <b>{fmt2(P)}</b></span>
                <span className="cong-status">{manca >= 0 ? "A credito operatore — aggiungi" : "A debito operatore — togli"} <b>{fmt2(Math.abs(manca))} ore</b></span>
                {azzeraBtn}
              </div>
            </div>;
          }
          if (Math.abs(S) <= 0.005 && Math.abs(manca) <= 0.005) return null;
          const pct = daPag > 0 ? Math.max(0, Math.min(100, Math.round(P / daPag * 100))) : (P > 0 ? 100 : 0);
          const cls = manca > 0.005 ? "warn" : (manca < -0.005 ? "over" : "ok");
          return <div className={"cong " + cls}>
            <div className="cong-head">{manca > 0.005 ? "⚠️" : (manca < -0.005 ? "⚠️" : "✓")} Conguaglio ore</div>
            <div className="cong-row">
              <span className="cong-chip">Saldo prec. <b>{fmt2(S)}</b></span>
              <span className="cong-op">+</span>
              <span className="cong-chip">Dichiarate <b>{fmt2(D)}</b></span>
              <span className="cong-op">=</span>
              <span className="cong-chip strong">Da pagare <b>{fmt2(daPag)}</b></span>
              <span className="cong-chip">Pagate <b>{fmt2(P)}</b></span>
              <span className="cong-status">{manca > 0.005 ? "A credito operatore — aggiungi" : (manca < -0.005 ? "A debito operatore — togli" : "Saldo azzerato")}{Math.abs(manca) > 0.005 ? <b> {fmt2(Math.abs(manca))} ore</b> : <b> ✓</b>}</span>
              {azzeraBtn}
            </div>
            <div className="cong-bar"><div className="cong-bar-fill" style={{ width: pct + "%" }}></div></div>
            <div className="cong-res">
              {manca > 0.005
                ? <span>Pagate <b>{fmt2(P)}</b> su <b>{fmt2(daPag)}</b> → <b>aggiungi {fmt2(manca)} ore (a credito operatore)</b>. Il riporto al mese dopo sarà quel che resta a fine mese.</span>
                : (manca < -0.005
                  ? <span>Pagate <b>{fmt2(P)}</b> su <b>{fmt2(daPag)}</b> → <b>togli {fmt2(Math.abs(manca))} ore (a debito operatore)</b>: si riportano al mese dopo.</span>
                  : <span><b>✓ Saldo azzerato</b> — pagate <b>{fmt2(P)}</b> su <b>{fmt2(daPag)}</b>. Nessun riporto.</span>)}
            </div>
          </div>;
        })()}
      </div>
      <div className="sost-box">
        <div className="sost-head">🔁 Sostituzioni (uso interno — non compaiono nei report)</div>
        {(rec.sost || []).map(function(row, idx){
          return <SostRow key={idx} row={row} nd={nd} dipList={props.dipList}
            onChange={function(nr){ props.onSostChange(dp.id, idx, nr); }}
            onDel={function(){ props.onSostDel(dp.id, idx); }} />;
        })}
        {!mLocked ? <button className="btn-mini" onClick={function(){ props.onSostAdd(dp.id); }}>+ Aggiungi sostituzione</button> : null}
      </div>
      <div className="note-box">
        <div className="note-head">🗒️ Note del mese</div>
        {(function(){
          const vociDisp = (rec.voci || []).slice();
          while (vociDisp.length < 2) vociDisp.push({ cat:"", testo:"" });
          return vociDisp.map(function(v, i){
            const catDef = CAT_SET[v.cat];
            const noText = !!(catDef && catDef.text === false);
            return (
              <div className="voce-row" key={i}>
                <select className="voce-cat" value={v.cat || ""} disabled={mLocked}
                  onChange={function(e){ const nc = e.target.value; props.onVoceSet(dp.id, i, { cat:nc, testo: (CAT_SET[nc] && CAT_SET[nc].text === false) ? "" : (v.testo || "") }); }}>
                  <option value="">— seleziona categoria —</option>
                  {CAT_NOTE.map(function(c){ return <option key={c.c} value={c.c}>{c.c}</option>; })}
                </select>
                <input className="voce-txt" value={v.testo || ""} disabled={mLocked || v.cat === "" || noText}
                  placeholder={v.cat === "" ? "" : (noText ? "(nessun dettaglio richiesto)" : "dettaglio…")}
                  onChange={function(e){ props.onVoceSet(dp.id, i, { testo:e.target.value }); }} />
                {(i >= 2 && !mLocked) ? <button className="voce-del" title="Rimuovi voce" onClick={function(){ props.onVoceDel(dp.id, i); }}>✕</button> : <span style={{ width:"22px", display:"inline-block" }}></span>}
              </div>
            );
          });
        })()}
        {!mLocked ? <button className="btn-mini" onClick={function(){ props.onVoceAdd(dp.id); }}>+ Aggiungi voce</button> : null}
        <div className="nota-line" style={{ marginTop:"9px" }}>
          <label>Altre note (testo libero):</label>
          <input className="nota-in" value={rec.nota || ""} placeholder="(nessuna nota)" disabled={mLocked}
            onChange={function(e){ props.onNota(dp.id, e.target.value); }} />
        </div>
      </div>
    </div>
  );
}

function DipModal(props){
  const editing = props.dip;
  const [nome, setNome] = useState(editing ? editing.nome : "");
  const [livello, setLivello] = useState(editing ? (editing.livello||"") : "");
  const [ore, setOre] = useState(editing ? editing.oreSett : "");
  const [tipo, setTipo] = useState(editing ? (editing.tipoContratto||"indeterminato") : "indeterminato");
  const [scad, setScad] = useState(editing ? (editing.scadenza||"") : "");
  const [proroghe, setProroghe] = useState(editing && Array.isArray(editing.proroghe) ? editing.proroghe.slice() : []);
  const [nuovaPro, setNuovaPro] = useState("");
  const addPro = function(){ const v = nuovaPro.trim(); if (v === "") return; setProroghe(proroghe.concat([v])); setNuovaPro(""); };
  const delPro = function(i){ setProroghe(proroghe.filter(function(_, k){ return k !== i; })); };
  const [trasf, setTrasf] = useState(editing && Array.isArray(editing.trasformazioni) ? editing.trasformazioni.map(function(t){ return typeof t==="string" ? { data:t } : Object.assign({}, t); }) : []);
  const _now47 = new Date();
  const [ntMese, setNtMese] = useState(String(_now47.getMonth()+1));
  const [ntAnno, setNtAnno] = useState(String(_now47.getFullYear()));
  const [ntLiv, setNtLiv] = useState("");
  const [ntOre, setNtOre] = useState("");
  const [ntIndet, setNtIndet] = useState(false);
  const addTrasf = function(){
    const mm=parseInt(ntMese,10), yy=parseInt(ntAnno,10);
    if(!mm||mm<1||mm>12||!yy||yy<2000||yy>2100){ return; }
    const rec={ data:"01/"+(mm<10?"0":"")+mm+"/"+yy };
    if(ntLiv.trim()!=="") rec.livello=ntLiv.trim().toUpperCase();
    const oreV=String(ntOre).replace(",",".").trim();
    if(oreV!=="" && !isNaN(Number(oreV))) rec.oreSett=Number(oreV);
    if(ntIndet) rec.toIndet=true;
    if(!rec.livello && rec.oreSett==null && !rec.toIndet){ return; }
    setTrasf(trasf.concat([rec]).sort(function(a,b){ return ymdIt(a.data)-ymdIt(b.data); }));
    setNtLiv(""); setNtOre(""); setNtIndet(false);
  };
  const delTrasf = function(i){ setTrasf(trasf.filter(function(_, k){ return k !== i; })); };
  const trasfSummary = function(t){ const parts=[]; if(t.toIndet) parts.push("→ a tempo indeterminato"); if(t.livello) parts.push("livello "+t.livello); if(t.oreSett!=null && String(t.oreSett)!=="") parts.push((Number.isInteger(Number(t.oreSett))?String(Number(t.oreSett)):fmt2(Number(t.oreSett)))+" h/sett"); return (parts.join(", ")||"nessuna modifica")+" — dal "+t.data; };
  const [assunz, setAssunz] = useState(editing ? (editing.dataAssunzione||"") : "");
  const [cess, setCess] = useState(editing ? (editing.dataCessazione||"") : "");
  const [colore, setColore] = useState(editing ? (editing.colore||PALETTE[0]) : PALETTE[0]);
  const save = function(){
    const n = nome.trim().toUpperCase();
    if (n === "") return;
    const pro = tipo === "determinato" ? proroghe.filter(function(x){ return x && x.trim() !== ""; }) : [];
    props.onSave({ id: editing ? editing.id : uid(), nome:n, livello:livello.trim(), oreSett:Number(ore)||0,
      tipoContratto:tipo, scadenza: tipo==="determinato" ? scad.trim() : "", proroghe:pro, trasformazioni: trasf.filter(function(x){ return x && x.data; }), ana: editing ? (editing.ana || {}) : {}, dataAssunzione:assunz.trim(), dataCessazione:cess.trim(), cessManuale: cess.trim()!=="", colore:colore });
  };
  return (
    <div className="overlay" onClick={props.onClose}>
      <div className="modal" onClick={function(e){ e.stopPropagation(); }}>
        <h2>{editing ? "Modifica dipendente" : "Nuovo dipendente"}</h2>
        <div className="field"><label>Nominativo (STAMPATELLO: COGNOME NOME)</label>
          <input value={nome} onChange={function(e){ setNome(e.target.value.toUpperCase()); }} placeholder="COGNOME NOME" /></div>
        <div className="frow">
          <div className="field"><label>Livello</label>
            <input value={livello} onChange={function(e){ setLivello(e.target.value); }} placeholder="es. 3" /></div>
          <div className="field"><label>Ore settimanali</label>
            <input type="number" step="0.5" value={ore} onChange={function(e){ setOre(e.target.value); }} /></div>
        </div>
        <div className="frow">
          <div className="field"><label>Tipo contratto</label>
            <select value={tipo} onChange={function(e){ setTipo(e.target.value); }}>
              <option value="indeterminato">Indeterminato</option>
              <option value="determinato">Determinato</option>
            </select></div>
          {tipo === "determinato" ?
            <div className="field"><label>Scadenza originale (gg/mm/aa)</label>
              <input value={scad} onChange={function(e){ setScad(e.target.value); }} placeholder="31/12/26" /></div> : null}
        </div>
        {tipo === "determinato" ?
          <div className="field" style={{ background:"#f8fafc", border:"1px solid #e2e8f0", borderRadius:"8px", padding:"10px" }}>
            <label style={{ fontWeight:800 }}>Proroghe (storico) — la scadenza originale resta invariata</label>
            {proroghe.length === 0 ? <div style={{ fontSize:"12px", color:"#64748b", margin:"4px 0" }}>Nessuna proroga.</div> :
              <div style={{ margin:"6px 0" }}>
                {proroghe.map(function(pp, i){ return (
                  <div key={i} style={{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"4px", fontSize:"13px" }}>
                    <span style={{ fontWeight:700 }}>{i+1}ª proroga → {pp}</span>
                    <button className="voce-del" title="Rimuovi proroga" onClick={function(){ delPro(i); }}>✕</button>
                  </div>
                ); })}
                <div style={{ fontSize:"12px", color:"#0f2740", marginTop:"4px" }}>Scadenza effettiva: <b>{proroghe[proroghe.length-1]}</b></div>
              </div>}
            <div style={{ display:"flex", gap:"8px", alignItems:"center", marginTop:"4px" }}>
              <input value={nuovaPro} onChange={function(e){ setNuovaPro(e.target.value); }} placeholder="gg/mm/aa"
                onKeyDown={function(e){ if (e.key === "Enter"){ e.preventDefault(); addPro(); } }}
                style={{ padding:"6px 8px", border:"2px solid #f59e0b", background:"#fffde7", borderRadius:"6px", width:"140px" }} />
              <button className="btn btn-blue" onClick={addPro}>+ Aggiungi proroga</button>
            </div>
          </div> : null}
        <div className="field" style={{ background:"#faf5ff", border:"1px solid #e9d5ff", borderRadius:"8px", padding:"10px" }}>
          <label style={{ fontWeight:800 }}>Trasformazioni (storico) — decorrenza sempre dal 1° del mese</label>
          <div style={{ fontSize:"11px", color:"#64748b", margin:"2px 0 6px" }}>Registra ogni trasformazione: innalzamento livello, variazione monte ore, passaggio a tempo indeterminato. Dal mese di decorrenza il report (ore teoriche) e i badge si adeguano da soli; i mesi precedenti restano col valore vecchio.</div>
          {trasf.length === 0 ? <div style={{ fontSize:"12px", color:"#64748b", margin:"4px 0" }}>Nessuna trasformazione registrata.</div> :
            <div style={{ margin:"6px 0" }}>
              {trasf.map(function(tt, i){ return (
                <div key={i} style={{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"4px", fontSize:"13px" }}>
                  <span style={{ fontWeight:700 }}>{trasfSummary(tt)}</span>
                  <button className="voce-del" title="Rimuovi trasformazione" onClick={function(){ delTrasf(i); }}>✕</button>
                </div>
              ); })}
            </div>}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(150px, 1fr))", gap:"6px", alignItems:"end", marginTop:"6px" }}>
            <div><div style={{ fontSize:"11px", fontWeight:700, marginBottom:"2px" }}>Decorrenza — mese</div>
              <select value={ntMese} onChange={function(e){ setNtMese(e.target.value); }} style={{ width:"100%", padding:"6px" }}>{MONTH_LABEL.map(function(l,i){ return <option key={i} value={String(i+1)}>{l}</option>; })}</select></div>
            <div><div style={{ fontSize:"11px", fontWeight:700, marginBottom:"2px" }}>Anno</div>
              <input value={ntAnno} onChange={function(e){ setNtAnno(e.target.value.replace(/[^0-9]/g,"").slice(0,4)); }} inputMode="numeric" style={{ width:"100%", padding:"6px", border:"2px solid #f59e0b", background:"#fffde7", borderRadius:"6px" }} /></div>
            <div><div style={{ fontSize:"11px", fontWeight:700, marginBottom:"2px" }}>Nuovo livello</div>
              <input value={ntLiv} onChange={function(e){ setNtLiv(e.target.value.toUpperCase()); }} placeholder="es. D2" style={{ width:"100%", padding:"6px", border:"2px solid #f59e0b", background:"#fffde7", borderRadius:"6px" }} /></div>
            <div><div style={{ fontSize:"11px", fontWeight:700, marginBottom:"2px" }}>Nuovo monte ore/sett</div>
              <input value={ntOre} onChange={function(e){ setNtOre(e.target.value); }} placeholder="es. 24" inputMode="decimal" style={{ width:"100%", padding:"6px", border:"2px solid #f59e0b", background:"#fffde7", borderRadius:"6px" }} /></div>
            <label style={{ display:"flex", alignItems:"center", gap:"6px", fontSize:"13px" }}><input type="checkbox" checked={ntIndet} onChange={function(e){ setNtIndet(e.target.checked); }} /> → a tempo indeterminato</label>
            <button className="btn btn-blue" onClick={addTrasf}>+ Aggiungi trasformazione</button>
          </div>
          <div style={{ fontSize:"11px", color:"#64748b", marginTop:"4px" }}>Compila almeno uno tra livello, monte ore o la spunta "a tempo indeterminato".</div>
        </div>
        <div className="frow">
          <div className="field"><label>Data assunzione (blocca giorni prima)</label>
            <input value={assunz} onChange={function(e){ setAssunz(e.target.value); }} placeholder="gg/mm/aa" /></div>
          <div className="field"><label>Data cessazione (blocca giorni dopo)</label>
            <input value={cess} onChange={function(e){ setCess(e.target.value); }} placeholder="gg/mm/aa" /></div>
        </div>
        <div className="field"><label>Colore scheda</label>
          <div className="color-row">
            {PALETTE.map(function(cx){ return <div key={cx} className={"swatch" + (cx===colore ? " sel" : "")} style={{ background:cx }} onClick={function(){ setColore(cx); }}></div>; })}
            <input type="color" value={colore} onChange={function(e){ setColore(e.target.value); }} style={{ width:"40px", height:"34px", padding:"0", border:"none", background:"none", cursor:"pointer" }} />
          </div>
        </div>
        <div className="modal-actions">
          <span style={{ fontSize:"11px", color:"#64748b" }}>{editing ? "Per cessare: imposta la data di cessazione." : ""}</span>
          <span>
            <button className="btn btn-gray" onClick={props.onClose}>Annulla</button>
            <button className="btn btn-blue" style={{ marginLeft:"8px" }} onClick={save}>Salva</button>
          </span>
        </div>
      </div>
    </div>
  );
}

    if (!sesso){ setMsg("⚠️ Per calcolare il CF scegli prima il Sesso (M/F)."); return; }
    if (!a.dataNascita || !isRealDate(a.dataNascita)){ setMsg("⚠️ Inserisci una Data di nascita valida (gg/mm/aaaa) prima di calcolare il CF."); return; }
    if (!a.cognome || !a.nome){ setMsg("⚠️ Servono Cognome e Nome per calcolare il CF."); return; }
    let bel = belfioreOf(a.luogoNascita) || (a.belfiore || "");
    const patch = {};
    if (!bel || bel.length!==4){
      const inp = window.prompt("Codice catastale (Belfiore) del comune di nascita \"" + (a.luogoNascita||"") + "\" — 4 caratteri (es. F205):", a.belfiore||"");

      else { setMsg("⚠️ CF non calcolato: manca il codice catastale del comune di nascita."); return; }
    }
    const cf = cfCompute(a.cognome, a.nome, a.dataNascita, sesso, bel);
    if (!cf){ setMsg("⚠️ CF non calcolato: controlla i dati inseriti."); return; }

                })}

          ); })}

      </div>
    </div>
  );
}

function QueryPanel(props){

  const nIndA = listA.length - nDetA;
  function expA(){ const aoa=[["IN FORZA AL "+dForza],[],["COGNOME NOME","TIPO","LIVELLO","DATA ASSUNZIONE","FINE CALCOLATA"]]; listA.forEach(function(dp){ aoa.push([nomeOf(dp), tipoLabel(tipoAt(dp,yA,mA)), livelloAt(dp,yA,mA)||"", intToIt(assunzInt(dp)), effEndInt(dp)?intToIt(effEndInt(dp)):"—"]); }); aoa.push([]); aoa.push(["TOTALE", listA.length, "di cui Determinati", nDetA, "Indeterminati", nIndA]); if(missA.length){ aoa.push([]); aoa.push(["DATA ASSUNZIONE MANCANTE (non conteggiati)"]); missA.forEach(function(dp){ aoa.push([nomeOf(dp)]); }); } qExport("Query - In forza al "+dForza.replace(/\//g,"-")+".xlsx", aoa); }

  const unitB = bWhat==="ORE" ? "ore" : "giorni";

  const totB = rowsB.reduce(function(a,r){ return a+r.val; },0);
  const fmtVal = function(v){ return bWhat==="ORE" ? fmt2(v) : String(v); };
  function expB(){ const whatL=(codeOpts.find(function(o){return o.v===bWhat;})||{}).l||bWhat; const aoa=[["TOTALE "+whatL+" DAL "+bFrom+" AL "+bTo+" (in "+unitB+")"],[],["COGNOME NOME","TOTALE ("+unitB+")"]]; rowsB.forEach(function(r){ aoa.push([r.nome, r.val]); }); aoa.push([]); aoa.push(["TOTALE COMPLESSIVO", totB]); qExport("Query - Totale "+whatL+" "+bFrom.replace(/\//g,"-")+"_"+bTo.replace(/\//g,"-")+".xlsx", aoa); }

  const Y=parseInt(cAnno,10); const y0=Y*10000+101, y1=Y*10000+1231;
  const enteredC = dips.filter(function(dp){ const a=assunzInt(dp); return a>=y0 && a<=y1; });

/* ===================== RIEPILOGHI ===================== */
function Riepiloghi(props){
  const state = props.state;
  const anniDisp = (function(){ const o={}; (state.anni||[]).forEach(function(y){ o[y]=true; }); o[props.anno]=true; o[props.anno+1]=true; return Object.keys(o).map(function(y){ return parseInt(y,10); }).sort(function(a,b){ return a-b; }); })();
  const [faY, setFaY] = useState(props.anno); const [faM, setFaM] = useState(1);
  const [taY, setTaY] = useState(props.anno); const [taM, setTaM] = useState(12);
  const dips = dipSorted(state);
  const scopePairs = monthsBetween(parseInt(faY,10), parseInt(faM,10), parseInt(taY,10), parseInt(taM,10));
  const periodoLabel = scopePairs.length ? (mLabelY(scopePairs[0].y, scopePairs[0].m) + " → " + mLabelY(scopePairs[scopePairs.length-1].y, scopePairs[scopePairs.length-1].m)) : "";

  const tabPeriodo = dips.map(function(dp){
    const perMese = scopePairs.map(function(pr){ return totOfRec(getRecFrom(state, pr.y, pr.m, dp.id), pr.y, pr.m); });
    const tot = perMese.reduce(function(a,b){ return a+b; }, 0);
    return { dp:dp, perMese:perMese, tot:Math.round(tot*100)/100 };
  });
  const tabTeor = dips.map(function(dp){
    let lav=0, teor=0;
    scopePairs.forEach(function(pr){ lav += totOfRec(getRecFrom(state, pr.y, pr.m, dp.id), pr.y, pr.m); teor += oreSettAt(dp, pr.y, pr.m) * daysInMonth(pr.y, pr.m) / 7; });
    lav=Math.round(lav*100)/100; teor=Math.round(teor*100)/100;
    return { dp:dp, lav:lav, teor:teor, scost:Math.round((lav-teor)*100)/100 };
  });
  const codiciUsati = {};
  dips.forEach(function(dp){ scopePairs.forEach(function(pr){ const rec=getRecFrom(state,pr.y,pr.m,dp.id);
    Object.keys(rec.giorni).forEach(function(d){ const v=String(rec.giorni[d]).trim(); if (CODE_SET[v] && v!=="--" && v!=="AN") codiciUsati[v]=true; }); }); });
  const codeCols = CODICI.filter(function(c){ return codiciUsati[c.c]; }).map(function(c){ return c.c; });
  const tabAssenze = dips.map(function(dp){
    const counts = {}; codeCols.forEach(function(c){ counts[c]=0; });
    scopePairs.forEach(function(pr){ const rec=getRecFrom(state,pr.y,pr.m,dp.id);
      Object.keys(rec.giorni).forEach(function(d){ const v=String(rec.giorni[d]).trim(); if (counts[v]!==undefined) counts[v]+=1; }); });
    return { dp:dp, counts:counts };
  });
  const tabPay = dips.map(function(dp){
    let ret=0, non=0;
    scopePairs.forEach(function(pr){ const rec=getRecFrom(state,pr.y,pr.m,dp.id);
      Object.keys(rec.giorni).forEach(function(d){ const v=String(rec.giorni[d]).trim(); if (CODE_SET[v] && v!=="--" && v!=="AN"){ if (CODE_SET[v].pay) ret+=1; else non+=1; } }); });
    return { dp:dp, ret:ret, non:non };
  });
  const oggi = new Date(); const tabScad = [];
  dips.forEach(function(dp){
    if (dp.tipoContratto !== "determinato") return;
    const eff = scadEff(dp);
    const dt = parseDMY(eff); if (!dt) return;
    const gg = Math.round((dt - oggi)/86400000);
    const pl = prorogheList(dp);
    tabScad.push({ dp:dp, orig:dp.scadenza || "", prorog: pl.length ? pl[pl.length-1] : "", eff:eff, gg:gg });
  });
  tabScad.sort(function(a,b){ return a.gg-b.gg; });
  const tabNote = [];
  dips.forEach(function(dp){ scopePairs.forEach(function(pr){ const rec=getRecFrom(state,pr.y,pr.m,dp.id);
    vociLines(rec).forEach(function(line){ tabNote.push({ mese:mLabelY(pr.y,pr.m), dp:dp.nome, nota:line }); }); }); });
  const tabPerm = [];
  dips.forEach(function(dp){ scopePairs.forEach(function(pr){ const rec=getRecFrom(state,pr.y,pr.m,dp.id);
    if (rec.permessi){ Object.keys(rec.permessi).forEach(function(d){ const prm=rec.permessi[d];
      tabPerm.push({ dp:dp.nome, mese:mLabelY(pr.y,pr.m), giorno:parseInt(d,10), ore:prm.ore, tipo:prm.tipo }); }); } }); });
  tabPerm.sort(function(a,b){ if (a.dp!==b.dp) return a.dp.localeCompare(b.dp); return a.giorno-b.giorno; });

  // statistiche voci-categoria per ogni dipendente per ogni mese
  const tabVoci = [];
  const totVoci = {}; CAT_NOTE.forEach(function(c){ totVoci[c.c]=0; });
  dips.forEach(function(dp){ scopePairs.forEach(function(pr){ const rec=getRecFrom(state,pr.y,pr.m,dp.id);
    const counts={}; CAT_NOTE.forEach(function(c){ counts[c.c]=0; }); let tot=0;
    ((rec && rec.voci)||[]).forEach(function(v){ if (v.cat && counts[v.cat]!==undefined){ counts[v.cat]+=1; totVoci[v.cat]+=1; tot++; } });
    if (tot>0) tabVoci.push({ dp:dp.nome, mese:mLabelY(pr.y,pr.m), counts:counts, tot:tot });
  }); });

  const esportaRiepiloghi = function(){
    const wb = XLSX.utils.book_new();
    wb.Props = { Title:"Riepiloghi", Author:"Christian Canonica", Company:"Spazio Ireos Società Cooperativa Sociale", CreatedDate:new Date() };
    const hdr = { font:{ name:"Arial", bold:true, color:{rgb:"FFFFFFFF"} }, fill:{ patternType:"solid", fgColor:{rgb:"FF0F2740"} }, alignment:{horizontal:"center"} };
    const mkSheet = function(name, aoa){
      const ws = XLSX.utils.aoa_to_sheet(aoa);

      XLSX.utils.book_append_sheet(wb, ws, name);
    };
    const aAnnuo=[["DIPENDENTE"].concat(scopePairs.map(function(pr){ return mAbbrY(pr.y,pr.m); })).concat(["TOT"])];
    tabPeriodo.forEach(function(r){ aAnnuo.push([r.dp.nome].concat(r.perMese.map(function(v){ return Math.round(v*100)/100; })).concat([r.tot])); }); mkSheet("Per mese", aAnnuo);
    const aTeor=[["DIPENDENTE","ORE LAVORATE","ORE TEORICHE","SCOSTAMENTO"]];

    const aAss=[["DIPENDENTE"].concat(codeCols)];
    tabAssenze.forEach(function(r){ aAss.push([r.dp.nome].concat(codeCols.map(function(c){ return r.counts[c]; }))); }); mkSheet("Assenze per codice", aAss);
    const aPay=[["DIPENDENTE","GG RETRIBUITI","GG NON RETRIBUITI"]];
    tabPay.forEach(function(r){ aPay.push([r.dp.nome, r.ret, r.non]); }); mkSheet("Retribuite vs non", aPay);
    const aScad=[["DIPENDENTE","SCADENZA ORIGINALE","PROROGATO AL","SCADENZA EFFETTIVA","GG RESIDUI"]];
    tabScad.forEach(function(r){ aScad.push([r.dp.nome, r.orig, r.prorog, r.eff, r.gg]); }); mkSheet("Contratti in scadenza", aScad);
    const aNote=[["MESE","DIPENDENTE","NOTA"]];
    tabNote.forEach(function(r){ aNote.push([r.mese, r.dp, r.nota]); }); mkSheet("Note", aNote);
    const aPerm=[["DIPENDENTE","MESE","GIORNO","ORE","TIPO"]];
    tabPerm.forEach(function(r){ aPerm.push([r.dp, r.mese, r.giorno, r.ore, r.tipo]); }); mkSheet("Permessi orari", aPerm);
    const aVoci=[["DIPENDENTE","MESE"].concat(CAT_NOTE.map(function(c){ return c.c; })).concat(["TOT VOCI"])];
    tabVoci.forEach(function(r){ aVoci.push([r.dp, r.mese].concat(CAT_NOTE.map(function(c){ return r.counts[c.c]; })).concat([r.tot])); });
    aVoci.push(["TOTALE",""].concat(CAT_NOTE.map(function(c){ return totVoci[c.c]; })).concat([CAT_NOTE.reduce(function(a,c){ return a+totVoci[c.c]; },0)])); mkSheet("Voci note", aVoci);
    XLSX.writeFile(wb, fileName("xlsx"));
  };

  const mOpts = MONTH_LABEL.map(function(l,i){ return <option key={i} value={i+1}>{l}</option>; });
  const yOpts = anniDisp.map(function(y){ return <option key={y} value={y}>{y}</option>; });
  return (
    <div>
      <div className="toolbar">
        <strong style={{ fontSize:"15px", color:"#0f2740" }}>Riepiloghi</strong>
        <label style={{ fontSize:"12px", fontWeight:"700", marginLeft:"10px" }}>Periodo: da</label>
        <select value={faM} onChange={function(e){ setFaM(e.target.value); }} style={{ padding:"6px", borderRadius:"6px", border:"2px solid #f59e0b", background:"#fffde7" }}>{mOpts}</select>
        <select value={faY} onChange={function(e){ setFaY(e.target.value); }} style={{ padding:"6px", borderRadius:"6px", border:"2px solid #f59e0b", background:"#fffde7" }}>{yOpts}</select>
        <label style={{ fontSize:"12px", fontWeight:"700" }}>a</label>
        <select value={taM} onChange={function(e){ setTaM(e.target.value); }} style={{ padding:"6px", borderRadius:"6px", border:"2px solid #f59e0b", background:"#fffde7" }}>{mOpts}</select>
        <select value={taY} onChange={function(e){ setTaY(e.target.value); }} style={{ padding:"6px", borderRadius:"6px", border:"2px solid #f59e0b", background:"#fffde7" }}>{yOpts}</select>
        <div className="spacer"></div>
        <button className="btn btn-blue" onClick={esportaRiepiloghi}>📊 Esporta riepiloghi (Excel)</button>
      </div>
      <div style={{ fontSize:"12px", color:"#64748b", marginBottom:"10px" }}>Fascia selezionata: <b>{periodoLabel}</b> ({scopePairs.length} mesi). L'intervallo può attraversare più anni.</div>

      <div className="rep-box">
        <h3>Riepilogo per mese — ore lavorate ({periodoLabel})</h3>
        <div className="rep-scroll"><table className="rep"><thead><tr>
          <th style={{textAlign:"left"}}>Dipendente</th>{scopePairs.map(function(pr,i){ return <th key={i}>{mAbbrY(pr.y,pr.m)}</th>; })}<th>TOT</th>
        </tr></thead><tbody>
          {tabPeriodo.map(function(r){ return <tr key={r.dp.id}><td className="name">{r.dp.nome}</td>
            {r.perMese.map(function(v,i){ return <td key={i}>{v===0?"":fmt2(v)}</td>; })}<td className="tot">{fmt2(r.tot)}</td></tr>; })}
        </tbody></table></div>
      </div>

      <div className="rep-box">
        <h3>Ore lavorate vs teoriche — {periodoLabel} <span style={{fontWeight:400,fontSize:"11px",color:"#64748b"}}>(teoriche = ORE SETT × giorni/7, approssimate)</span></h3>
        <div className="rep-scroll"><table className="rep"><thead><tr>
          <th style={{textAlign:"left"}}>Dipendente</th><th>Ore lavorate</th><th>Ore teoriche</th><th>Scostamento</th>
        </tr></thead><tbody>
          {tabTeor.map(function(r){ return <tr key={r.dp.id}><td className="name">{r.dp.nome}</td><td>{fmt2(r.lav)}</td><td>{fmt2(r.teor)}</td>

        <div className="rep-scroll"><table className="rep"><thead><tr>
          <th style={{textAlign:"left"}}>Dipendente</th>{codeCols.map(function(c){ return <th key={c} title={CODE_SET[c].l}>{c}</th>; })}
        </tr></thead><tbody>
          {tabAssenze.map(function(r){ return <tr key={r.dp.id}><td className="name">{r.dp.nome}</td>
            {codeCols.map(function(c){ return <td key={c}>{r.counts[c]===0?"":r.counts[c]}</td>; })}</tr>; })}
        </tbody></table></div>}
      </div>

      <div className="rep-box">
        <h3>Assenze retribuite vs non retribuite (giorni)</h3>
        <div className="rep-scroll"><table className="rep"><thead><tr>
          <th style={{textAlign:"left"}}>Dipendente</th><th>GG retribuiti</th><th>GG non retribuiti</th>
        </tr></thead><tbody>
          {tabPay.map(function(r){ return <tr key={r.dp.id}><td className="name">{r.dp.nome}</td><td>{r.ret===0?"":r.ret}</td>
            <td className={r.non>0?"flag-amber":""}>{r.non===0?"":r.non}</td></tr>; })}

/* ===================== LOGIN ===================== */
function Login(props){
  const [pinSet] = useState(localStorage.getItem(LS_PIN) !== null);
  const [pin, setPin] = useState(""); const [pin2, setPin2] = useState("");
  const [email, setEmail] = useState(""); const [pwd, setPwd] = useState("");
  const [err, setErr] = useState("");
  const doFb = function(){ setErr(""); firebase.auth().signInWithEmailAndPassword(email, pwd).catch(function(e){ setErr("Accesso non riuscito. Verifica le credenziali."); console.error(e); }); };
  const doPin = function(){
    setErr("");
    if (!pinSet){
      if (pin.length < 4){ setErr("Il PIN deve avere almeno 4 cifre."); return; }
      if (pin !== pin2){ setErr("I due PIN non coincidono."); return; }
      localStorage.setItem(LS_PIN, hashPin(pin)); props.onPinOk();
    } else { if (hashPin(pin) === localStorage.getItem(LS_PIN)) props.onPinOk(); else setErr("PIN errato."); }
  };
  return (
    <div className="login-box">
      <div className="logo">Spazio Ireos</div>
      <div className="tag">Report Ore mensile — accesso riservato</div>
      {FB_READY ?
        <div>
          <div className="field"><label style={{textAlign:"left"}}>Email</label>
            <input value={email} onChange={function(e){ setEmail(e.target.value); }} /></div>
          <div className="field"><label style={{textAlign:"left"}}>Password</label>
            <input type="password" value={pwd} onChange={function(e){ setPwd(e.target.value); }} onKeyDown={function(e){ if (e.key==="Enter") doFb(); }} /></div>
          {err ? <div style={{ color:"#dc2626", fontSize:"12px", marginBottom:"10px" }}>{err}</div> : null}
          <button className="btn btn-blue" style={{ width:"100%", justifyContent:"center" }} onClick={doFb}>Entra</button>
        </div>
        :
        <div>
          {!pinSet ? <div style={{ fontSize:"12px", color:"#64748b", marginBottom:"10px" }}>Primo accesso: crea un PIN (min 4 cifre).</div> : null}
          <div className="field"><label style={{textAlign:"left"}}>{pinSet ? "PIN" : "Nuovo PIN"}</label>
            <input type="password" inputMode="numeric" value={pin} onChange={function(e){ setPin(e.target.value.replace(/\D/g,"")); }} onKeyDown={function(e){ if (e.key==="Enter" && pinSet) doPin(); }} /></div>
          {!pinSet ? <div className="field"><label style={{textAlign:"left"}}>Conferma PIN</label>
            <input type="password" inputMode="numeric" value={pin2} onChange={function(e){ setPin2(e.target.value.replace(/\D/g,"")); }} /></div> : null}
          {err ? <div style={{ color:"#dc2626", fontSize:"12px", marginBottom:"10px" }}>{err}</div> : null}
          <button className="btn btn-blue" style={{ width:"100%", justifyContent:"center" }} onClick={doPin}>{pinSet ? "Entra" : "Crea PIN ed entra"}</button>
        </div>}
    </div>
  );
}

  const setZoomP = function(z){ let v = Math.round(z); if (v < 40) v = 40; if (v > 110) v = 110; setZoom(v); try { localStorage.setItem(LS_ZOOM, String(v)); } catch (e) { console.error(e); } };
  const fitWidth = function(){
    let natural = 0;
    const t = document.querySelector(".grid-wrap table");
    if (t){ natural = t.getBoundingClientRect().width / (zoom / 100); }
    else { const c = document.querySelector(".content"); if (c) natural = c.scrollWidth; }
    if (!natural) return;
    const avail = window.innerWidth - 48;
    setZoomP(Math.floor(avail / natural * 100));
  };
  const [toast, setToast] = useState(null);
