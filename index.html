   entra in vigore una proroga (addizionale che sale). Richiesta di Christian del 04/11/2026:
   «non puoi tu automaticamente dividere i periodi con trasformazioni in più blocchi?». */
/* ver128: quanti SCATTI sono maturati all'inizio del mese (y,m).
   Si contano i mesi utili dall'assunzione fino al mese PRECEDENTE: un mese tutto «AN» non e'
   utile e fa slittare la maturazione (regola di Christian). Massimo 5.
   ⚠️ Prima del primo mese che l'app conosce non si puo' sapere se ci furono mesi tutti AN:
   quei mesi si contano tutti come utili, e `stimati` lo segnala. */
/* ver132 (08/11/2026). Due aggiunte, chieste da Christian per un caso vero: una persona a
   cui all'assunzione sono stati RICONOSCIUTI 4 scatti, con il quinto che matura a febbraio 2027.
   a) `ass0` = scatti riconosciuti il giorno dell'assunzione (casella nuova): diventa il punto di
      partenza, e da li' l'app continua ad aggiungerne uno ogni 24 mesi utili;
   b) chi e' assunto DOPO il giorno 1 comincia a contare dal mese SUCCESSIVO: cosi' i 24 mesi si
      chiudono all'anniversario e lo scatto parte dal mese dopo. Senza questo, per lei (assunta
      il 07/01/2025) il quinto scatto sarebbe partito da gennaio 2027 invece che da febbraio. */
function scattiAl(state, dp, y, m, prec, ass0){
  const ass = ymdIt(dp && dp.dataAssunzione);
  const pd = primoMeseDati(state);
  const pdN = pd ? (pd.y*100 + pd.m) : null;
  const fino = y*100 + m;                       // esclusivo: si conta fino al mese prima
  const aY = ass ? Math.floor(ass/10000) : 0, aM = ass ? Math.floor((ass%10000)/100) : 0;
  const daAss = ass ? (aY*100 + aM) : null;
  /* ci sono mesi PRIMA dei dati? (o manca la data di assunzione) */
  const primaDeiDati = (!ass) || (pdN != null && daAss < pdN);
  /* ver128: se l'utente ha scritto quanti scatti erano gia' maturati alla data in cui i dati
     cominciano, si parte da quel numero e si contano solo i mesi che l'app vede davvero.
     ⚠️ Non si sa a che punto fosse il biennio in corso a quella data: il prossimo scatto puo'
     arrivare fino a 23 mesi piu' tardi del vero. E' scritto a video. */
  const usaCasella = primaDeiDati && (prec != null) && (prec !== "") && !isNaN(Number(prec));
  const assG = ass ? (ass % 100) : 0;                 /* ver132: giorno di assunzione */
  const riconosciuti = (ass0 != null && ass0 !== "" && !isNaN(Number(ass0)))
    ? Math.max(0, Math.floor(Number(ass0))) : 0;      /* ver132: scatti regalati all'assunzione */
  let cy, cm, base = 0;
  if (usaCasella){ base = Math.max(0, Math.floor(Number(prec))); cy = pd.y; cm = pd.m; }
  else if (ass){ base = riconosciuti; cy = aY; cm = aM;
    /* ver132 b): assunto dopo il giorno 1 -> il primo mese utile e' quello dopo */
    if (assG > 1){ cm++; if (cm > 12){ cm = 1; cy++; } } }
  else if (pd){ cy = pd.y; cm = pd.m; }
  else return { n:0, utili:0, stimati:0, base:0, riconosciuti:riconosciuti, senzaAssunzione:!ass, primaDeiDati:primaDeiDati, daCasella:false };
  if ((cy*100 + cm) >= fino)
    return { n: Math.min(SCATTI_MAX, base), utili:0, stimati:0, base:base, riconosciuti:riconosciuti, senzaAssunzione:!ass, primaDeiDati:primaDeiDati, daCasella:usaCasella };
  let utili = 0, stimati = 0, guard = 0;
  while ((cy*100 + cm) < fino && guard < 1200){
    const n = cy*100 + cm;
    if (pdN != null && n < pdN){ utili++; stimati++; }      /* prima dei dati: si conta tutto */
    else if (!meseTuttoAN(state, dp, cy, cm)) utili++;
    cm++; if (cm > 12){ cm = 1; cy++; }
    guard++;
  }
  return { n: Math.min(SCATTI_MAX, base + Math.floor(utili / SCATTI_MESI)),
           utili:utili, stimati:stimati, base:base, riconosciuti:riconosciuti,
           senzaAssunzione:!ass, primaDeiDati:primaDeiDati, daCasella:usaCasella };
}
/* ═══ ver139 — LA DECORRENZA DEGLI SCATTI, SCRITTA IN ANAGRAFICA ═══════════════════════════
   Punto 13C della direttiva di Christian: «La decorrenza dello scatto deve essere riportata
   automaticamente nella scheda anagrafica e recepita nel foglio di calcolo del costo orario».
   Nel Costo orario è già recepita dalla ver128 (il periodo si taglia al mese dello scatto);
   qui si fa VEDERE, in Anagrafica, di sola lettura.
   ⚠️ Non cambia nessun calcolo: ricostruisce le date **con la stessa regola** di `scattiAl`,
   cioè quella che Christian ha confermato il 09/11/2026 scegliendo la **1a** (il «giorno 25»
   era un refuso): si contano i **mesi utili** dall'assunzione — dal mese SUCCESSIVO se è stato
   assunto dopo il giorno 1 — un **mese tutto «AN» non è utile**, e lo scatto decorre dal mese
   dopo che i 24 mesi utili si sono chiusi. Massimo 5.
   Torna `{ righe:[{n, y, m}], prossimo, nOggi, senzaAssunzione }`. */
function scattiStoria(state, dp, prec, ass0){
  const assY = ymdIt(dp && dp.dataAssunzione);
  const pd = primoMeseDati(state);
  const pdN = pd ? (pd.y*100 + pd.m) : null;
  const riconosciuti = (ass0 != null && ass0 !== "" && !isNaN(Number(ass0))) ? Math.max(0, Math.floor(Number(ass0))) : 0;
  const primaDeiDati = (!assY) || (pdN != null && (Math.floor(assY/10000)*100 + Math.floor((assY%10000)/100)) < pdN);
  const usaCasella = primaDeiDati && (prec != null) && (prec !== "") && !isNaN(Number(prec));
  let cy, cm, base = 0;
  if (usaCasella){ base = Math.max(0, Math.floor(Number(prec))); cy = pd.y; cm = pd.m; }
  else if (assY){ base = riconosciuti; cy = Math.floor(assY/10000); cm = Math.floor((assY%10000)/100);
    if ((assY % 100) > 1){ cm++; if (cm > 12){ cm = 1; cy++; } } }
  else if (pd){ cy = pd.y; cm = pd.m; }
  else return { righe:[], prossimo:null, nOggi:0, senzaAssunzione:true };
  const righe = []; let utili = 0, n = base, guard = 0;
  /* si guarda avanti fino a 40 anni: basta per arrivare al quinto scatto in qualunque caso */
  while (n < SCATTI_MAX && guard < 480){
    if (pdN != null && (cy*100 + cm) < pdN) utili++;
    else if (!meseTuttoAN(state, dp, cy, cm)) utili++;
    cm++; if (cm > 12){ cm = 1; cy++; }
    guard++;
    if (utili > 0 && utili % SCATTI_MESI === 0){ n++; righe.push({ n:n, y:cy, m:cm }); }
  }
  const oggi = new Date(); const oggiN = oggi.getFullYear()*100 + (oggi.getMonth()+1);
  let nOggi = base; let prossimo = null;
  righe.forEach(function(r){ if (r.y*100 + r.m <= oggiN) nOggi = r.n; else if (!prossimo) prossimo = r; });
  return { righe:righe, prossimo:prossimo, nOggi:nOggi, base:base, senzaAssunzione:!assY };
}
function firmaMese(state, dp, y, m, fisso){
  const v = valoriAt(dp, y, m);
  const np = prorogheAttiveA(dp, y*10000 + m*100 + daysInMonth(y, m));
  /* ver128: anche la TABELLA CCNL in vigore e il numero di SCATTI maturati fanno parte della
     firma, cosi' il periodo si taglia da solo al rinnovo e a ogni scatto. */
  /* `fisso` dice quali dimensioni l'utente ha scritto a mano: quelle NON fanno piu' tagliare
     il periodo, perche' il suo valore vale uguale dappertutto. */
  const f = fisso || {};
  return [String(v.livello==null?"":v.livello).toUpperCase().trim(), String(v.oreSett), String(v.tipo), String(np),
          f.tab ? "-" : tabellaAl(y, m, state),                 /* ver138 */
          f.scatti ? "-" : String(scattiAl(state, dp, y, m, (f.prec != null ? f.prec : null), (f.ass != null ? f.ass : null)).n),
          /* ver131: anche il SUPERMINIMO fa parte della firma, cosi' il periodo si taglia da
             solo alla data in cui cambia. Scritto a mano vale uguale dappertutto: non taglia. */
          f.superm ? "-" : String(v.superm),
          /* ver141: anche l'E.A.R. fa parte della firma, cosi' il periodo si taglia da solo al
             01/09/2025 (cambio di tranche) e quando il livello non e' piu' D1. */
          String(earMese(dp, y, m, v.livello)),
          /* ver146: anche le voci con un PERIODO (premi, premio al mese, rimborso km) fanno
             parte della firma, cosi' il periodo si taglia da solo al mese in cui partono o
             finiscono. Se in Anagrafica non sono scritte, `voceAnaAt` torna null e la firma
             non cambia mai: il comportamento resta identico a prima. */
          String(voceAnaAt(dp,"premiTP",y,m))+"/"+String(voceAnaAt(dp,"premiMese",y,m))+"/"+String(voceAnaAt(dp,"kmMese",y,m))].join("|");
}
function blocchiPeriodo(state, dp, pairs, fisso){
  const out = [];
  (pairs||[]).forEach(function(pr){
    const f = firmaMese(state, dp, pr.y, pr.m, fisso);
    const u = out.length ? out[out.length-1] : null;
    if (u && u.firma === f) u.pairs.push(pr); else out.push({ firma:f, pairs:[pr] });
  });
  return out;
}
function livelloPeriodo(dp, pairs){
  let v = (dp.livello==null ? "" : String(dp.livello));
  (pairs||[]).forEach(function(pr){
    const primo = pr.y*10000 + pr.m*100 + 1;
    if (inForceAt(dp, primo) || inForceAt(dp, pr.y*10000+pr.m*100+daysInMonth(pr.y,pr.m))) v = livelloAt(dp, pr.y, pr.m);
  });
  return v;
}
/* ver131: il superminimo dell'ULTIMO mese in cui il contratto e' in piedi dentro il periodo,
   esattamente come fa `livelloPeriodo` per il livello. Serve come valore AUTOMATICO quando il
   periodo non si taglia in pezzi; quando si taglia, ogni pezzo usa il suo. */
function superminimoPeriodo(dp, pairs){
  let v = 0;
  (pairs||[]).forEach(function(pr){
    const primo = pr.y*10000 + pr.m*100 + 1;
    if (inForceAt(dp, primo) || inForceAt(dp, pr.y*10000+pr.m*100+daysInMonth(pr.y,pr.m))) v = superminimoAt(dp, pr.y, pr.m);
  });
  return v;
}
function oreSettPeriodo(dp, pairs){
  let v = Number(dp.oreSett)||0;
  pairs.forEach(function(pr){
    const primo = pr.y*10000 + pr.m*100 + 1;
    if (inForceAt(dp, primo) || inForceAt(dp, pr.y*10000+pr.m*100+daysInMonth(pr.y,pr.m))) v = oreSettAt(dp, pr.y, pr.m);
  });
  return v;
}

/* Il calcolo. Ogni riga porta la cella del foglio Excel da cui viene. */
function calcCosto(o){
  const c = o.com;
  const K=o.minimo, L=o.scatti, M=o.premiTP, N=o.superminimo;
  const O2=o.oreSett, Q2=o.ggSett, H2=o.mesi, I2=o.mesiMater;
  /* ver104: H2 = mesi PROPORZIONATI ai giorni veri (retribuzione e tutto il resto);
     H3 = mesi che MATURANO I RATEI, cioè quelli con almeno 15 giorni (ferie, 13ª e 14ª). */
  const H3 = (o.mesiRatei!=null) ? o.mesiRatei : Math.round(H2);
  /* ver106: H4 = mesi in cui esce un cedolino (almeno un giorno di contratto). */
  const H4 = (o.mesiCedolini!=null) ? o.mesiCedolini : Math.ceil(H2);
  /* ver141: l'E.A.R. e' una componente mensile a tempo pieno come il superminimo: entra nel
     totale, quindi in importo orario, mensile fisso, 13ª, 14ª, festività, imponibili e TFR. */
  const EA=o.ear||0;
  const tot=K+L+M+N+EA;
  const J2 = tot/165;                                   // importo orario globale
  const P2 = O2*165/38;                                 // ore mese teoriche
  const H5 = tot/38*O2;                                 // mensile fisso
  const J5 = H5*(H2-I2);                                // retribuzione mensilizzata
  const J6 = H5*(H3/12);                                // tredicesima
  const J8 = H5*((H3/12)/100*c.quattordic);             // quattordicesima
  const fGod = (o.festGodute!=null) ? o.festGodute : c.festGodute;   // ver79: contate dal calendario del periodo
  const fNon = (o.festNonGod!=null) ? o.festNonGod : c.festNonGod;
  const J12 = (H5/26)*fNon*c.festNonGodCoef;            // festivita' non godute
  /* ver125: FERIE NON GODUTE LIQUIDATE alla cessazione. Voce GEMELLA di J12: stesso conto
     (mensile fisso in 26esimi x giornate) e stesso trattamento (dentro l'imponibile I, quindi
     contributi si; FUORI dalla base TFR, vedi H19). Le giornate arrivano da `datiCosto`
     (debito del periodo + residuo degli anni precedenti scritto a mano) e valgono SOLO se
     nel periodo c'e' una cessazione: altrimenti `o.ferieLiqGG` e' 0 e questa voce e' 0,
     cioe' il calcolo e' identico a prima. */
  const ggLiq = Number(o.ferieLiqGG) || 0;
  const J13 = (H5/26)*ggLiq;                            // ferie non godute liquidate
  const E13 = (H2-I2)*c.malattiaMese;                   // giorni di malattia presunti
  const J14 = H5*I2*c.integrMater/100;                  // integrazione maternita'
  const L15 = J5+J6+J8+J12+J13+J14;                     // imponibile I
  const O5calc = (H2-I2)*4.3452;                        // settimane del periodo, come le calcola il foglio
  const O5 = (o.settPeriodoOv>0) ? o.settPeriodoOv : O5calc;
  /* ver136: Q2 (giorni settimanali) e tfrDiv (divisore TFR) sono due caselle scrivibili, e
     scriverci ZERO portava a una divisione per zero: il risultato diventava Infinity/NaN, poi
     R2 lo riduceva a 0 e fmt2 lo mostrava come «0,00», cioe' un costo rotto presentato come un
     numero vero. Ora si usa il valore di riserva e la bandierina `divNonValidi` lo dice a video.
     ⚠️ Con valori normali il conto e' identico a prima. */
  const Q2s = (isFinite(Q2) && Q2 > 0) ? Q2 : COSTO_COMUNE_DEF.ggSett;
  const tfrDivS = (isFinite(Number(c.tfrDiv)) && Number(c.tfrDiv) > 0) ? Number(c.tfrDiv) : COSTO_COMUNE_DEF.tfrDiv;
  const O6calc = O5-((c.ferie+c.altriPermessi)*H3/12 + fGod + E13)/Q2s;
  const O6 = (o.settLavOv>0) ? o.settLavOv : O6calc;    // settimane davvero lavorabili (si possono scrivere)
  const O8 = O6*O2;                                     // ore ordinarie lavorate
  const O11 = o.sottoSoglia||0;
  const G38 = (o.oreManuali>0)? o.oreManuali : 0;
  /* ver117: con le ore «dai Riepiloghi» le ore in piu' arrivano GIA' sommate mese per mese
     (`o.suppMensileOre`), senza compensazione. Qui si riportano "al mese" perche' tutto il
     resto del foglio (H18, J18, H19) lavora su un valore mensile da moltiplicare per H2. */
  const E18 = (o.suppMensileOre!=null)
    ? ((H2>0)? o.suppMensileOre/H2 : 0)
    : ((G38>0)? ((H2>0)? Math.max(0,(G38-O8+O11*H2))/H2 : 0) : P2*(c.suppPct/100));   /* ver103: con 0 mesi non si divide */
  const H18 = E18*(J2 + ((O2>=38)? (K/165*15/100) : (J2*27/100)));
  const J18 = H18*H2;                                   // ore aggiuntive
  const J17 = (o.premiMese||0)*(H2-(o.premiMesiTolti||0));
  const L18 = L15+J17+J18;                              // imponibile II
  /* ver79: le festivita' NON GODUTE (J12) non entrano nell'imponibile TFR.
     ver126 (06/11/2026): le FERIE NON GODUTE LIQUIDATE (J13) invece **SI'**. In ver125 erano
     fuori, per coerenza con la gemella; Christian ha mandato tre cedolini veri e il confronto
     fra due mesi di fila della STESSA persona lo dimostra:
       maggio 2025  competenze 960,93 €  -> quota TFR del mese 64,15 €
       giugno 2025  competenze 1.310,86 € (di cui 315,00 € di ferie e permessi non goduti)
                    -> quota TFR del mese 85,36 €
     La quota e' salita di 21,21 €. Se le 315,00 fossero FUORI dalla base sarebbe salita di
     ~2,4 €; se sono DENTRO, di ~24,2 €. Quindi sono DENTRO.
     ⚠️ J12 resta fuori: e' una cosa diversa (le domeniche e il 4 novembre), e nei cedolini
     non compare come voce a se'. */
  const H19 = (L15-J12) + ((O2>=38)? J18 : ((c.tfrSupp==="SI")? E18*J2*H2 : 0)) + H5*I2*(100-c.integrMater)/100;
  /* ver79: dal TFR si toglie lo 0,50%, che e' una quota dei contributi dovuti all'INPS
     e si calcola sulla stessa base dei contributi (imponibile II). */
  const J20 = L18*0.005;                                // 0,50% a carico dei contributi
  const J19 = H19/tfrDivS - J20;                        // TFR al netto dello 0,50% (ver136: divisore protetto)
  /* ver114 (06/11/2026, Christian: «il più veritiero?» → scelta la strada 2).
     La legge (art. 2120 c.c.) rivaluta il **FONDO TFR già accantonato al 31 dicembre dell'anno
     prima**, non la quota che matura adesso: tasso = 1,50% fisso + 75% dell'aumento ISTAT.
     Se nella scheda della persona c'è scritto il fondo (`o.tfrFondo > 0`) si fa il conto vero,
     in proporzione ai mesi del periodo. Se la casella è vuota resta **esattamente** la stima di
     prima (quota del periodo × «Anni per rivalutazione TFR» × tasso): nessuno perde niente.
     ⚠️ `H6` = mesi in cui il RAPPORTO è in piedi, **non** i mesi pagati: il fondo si rivaluta
     anche nei mesi tutti «AN» (part-time verticale ciclico), perché il debito resta. */
  const H6 = (o.mesiRapporto!=null) ? o.mesiRapporto : H2;
  const tassoRiv = 1.5/100 + c.istat/100*75/100;
  const J21 = (o.tfrFondo>0)
    ? o.tfrFondo*tassoRiv*(H6/12)
    : (J19*c.anniTfr*1.5/100 + J19*c.anniTfr*c.istat/100*75/100);
  const J23 = H19*(c.prevCompl/100*c.prevComplPag)/100;
  const J25 = L18*(c.inps/100*c.inpsPag)/100;
  const J26 = L18*o.addizTD/100;                        // addizionale tempo determinato
  const J27 = L18*(c.fis/100*c.fisPag)/100;
  const b28 = L18/100*(c.inail/100*c.inailPag); const J28 = b28 + b28*0.01;
  const J29 = L18*(c.irap/100*c.irapPag)/100;
  /* ver79: assistenza sanitaria proporzionata ai mesi (132/anno = 11 al mese), solo indeterminati. */
  /* ver105 (05/11/2026, Christian: «assistenza sanitaria come ferie, permessi e ratei vari»):
     NON proporzionata ai giorni veri, ma sui mesi che maturano i ratei (almeno 15 giorni),
     esattamente come ferie, permessi, tredicesima e quattordicesima. */
  const J30 = o.indeterminato ? (c.sanitaria/12)*H3 : 0;
  /* ver106 (Christian): il cedolino esce comunque, 3 giorni o 30 che siano. Quindi le paghe
     si contano sui mesi con ALMENO UN GIORNO di contratto, non in proporzione. */
  const J31 = c.paghe*H4;
  /* ver79: formazione "secca" 250 per ogni anno iniziato (scelta B di Christian). */
  /* La formazione "va fatta comunque" (Christian, 02/11 e 05/11/2026): 250 per ogni anno
     iniziato, e **almeno uno** anche se il contratto dura pochi giorni. Invariata. */
  const J32 = c.formazione*Math.max(1, Math.ceil(H2/12));
  /* ver80: il rimborso puo' essere "al mese" (× i mesi) oppure "secco" (una volta sola).
     ⚠️ Non entra in nessun imponibile: e' esente da imposte e contributi (confermato da
     Christian il 04/11/2026). Finisce solo nel totale J35. */
  const kmVal = (o.kmMese!=null?o.kmMese:c.kmMese);
  const J34 = (o.kmTipo==="secco") ? kmVal : kmVal*(H2-(o.kmMesiTolti||0));
  const J35 = J5+J6+J8+J12+J13+J14+J17+J18+J19+J21+J23+J25+J26+J27+J28+J29+J30+J31+J32+J34;
  const F38 = O8 + P2*(c.suppPct/100)*H2 - O11*H2;      // ore teoriche rendicontabili
  const H38 = (G38>0)? G38 : F38;                       // ore usate nel calcolo
  return { J2:J2,P2:P2,H5:H5,J5:J5,J6:J6,J8:J8,J12:J12,J13:J13,ggLiq:ggLiq,E13:E13,J14:J14,L15:L15,
           O5:O5,O6:O6,O8:O8,O5calc:O5calc,O6calc:O6calc,E18:E18,J17:J17,J18:J18,L18:L18,H19:H19,J19:J19,J21:J21,
           J20:J20,J23:J23,J25:J25,J26:J26,J27:J27,J28:J28,J29:J29,J30:J30,J31:J31,J32:J32,J34:J34,
           fGod:fGod, fNon:fNon,
           /* ver136: quali divisori erano scritti a zero (o illeggibili) e sono stati sostituiti
              dal valore di riserva. Serve solo all'avviso a video. */
           divNonValidi: [].concat(
             (isFinite(Q2) && Q2 > 0) ? [] : ["Giorni settimanali"],
             (isFinite(Number(c.tfrDiv)) && Number(c.tfrDiv) > 0) ? [] : ["Divisore TFR"]),
           J35:J35,F38:F38,H38:H38, orario:(H38>0? J35/H38 : 0) };
}

// mette insieme i dati della scheda, i valori comuni e gli scostamenti della persona
function datiCosto(state, dp, pairs){
  const c = costoComune(state);
  const p = costoPar(dp);
  /* ver117: serve PRIMA di calcCosto, perche' decide anche se le ore in piu' si contano
     mese per mese. Stessa espressione di sempre, solo spostata piu' in su. */
  /* ver137 (09/11/2026, strada «a» scelta da Christian). Cinque caselle del Costo orario
     — livello, minimo tabellare, ore settimanali, addizionale TD, tabella CCNL — sono diventate
     GRIGIE e di sola lettura: il dato arriva dall'ANAGRAFICA (livello, ore, proroghe,

  const addizAuto = addizTDAuto(dp, pairs);

             sta tutta nell'ULTIMO pezzo, che e' quello che contiene la cessazione. Cosi' porta
             con se' i contributi del suo pezzo e la somma dei pezzi torna al periodo intero
             senza casi speciali (diversamente dalla formazione, che va rimessa a parte). */
          ferieLiqGG: (bi === bl.length-1) ? (o.ferieLiqGG||0) : 0,
          oreManuali: 0
        });
        return { b:b, ob:ob, liv:livB, indet:indetB, tab:tabB, nSc:scB.n, res0: calcCosto(ob) };
      });
      /* le ore di ogni blocco, secondo la fonte scelta */
      const sommaO8 = prep.reduce(function(a,x){ return a + (x.res0.O8||0); }, 0);
      prep.forEach(function(x){
        if (o.fonte === "riepiloghi") x.ob.oreManuali = oreRendPeriodo(state, dp, x.b.pairs);
        else if (o.fonte === "mano")  x.ob.oreManuali = (sommaO8>0) ? R2(o.oreAMano * (x.res0.O8/sommaO8), 3) : 0;
        else x.ob.oreManuali = 0;                 /* teoriche: le calcola il blocco */
        x.res = calcCosto(x.ob);
      });
      /* somma dei blocchi. La FORMAZIONE e' una spesa dell'anno, non del blocco:
         si toglie da ogni blocco e si rimette una volta sola sul periodo intero. */
      const campi = ["J5","J6","J8","J12","J13","J14","J17","J18","J19","J20","J21","J23","J25","J26","J27","J28","J29","J30","J31","J34",
                     "L15","L18","H19","O5","O6","O8","O5calc","O6calc","fGod","fNon","H38"];
      const res = {};
      campi.forEach(function(k){ res[k] = prep.reduce(function(a,x){ return a + (Number(x.res[k])||0); }, 0); });
      res.J32 = o.res.J32;                                  /* formazione: una volta sola */
      /* ver136 — DIFETTO PREESISTENTE: il rimborso km «secco» si moltiplicava per il numero di
         pezzi. `J34` sta nell'elenco dei campi sommati, e con la tendina su «secco» ogni blocco
         tornava l'importo INTERO: misurato, 50,00 € su periodo unico diventavano 100,00 € con
         due pezzi. È lo stesso caso della formazione, che era già gestito qui sopra: una spesa
         «una volta sola» non si somma fra i blocchi. ⚠️ Col rimborso «al mese» non cambia
         niente: lì ogni blocco deve davvero portare i suoi mesi. */
      if (o.kmTipo === "secco") res.J34 = o.res.J34;         /* rimborso secco: una volta sola */
      /* ver136: la bandierina dei divisori non valídi non è un importo da sommare: va portata
         avanti, altrimenti con il periodo tagliato in pezzi l'avviso non compare mai (trovato
         in esecuzione: la prima stesura lo perdeva proprio nei casi più frequenti). */
      res.divNonValidi = o.res.divNonValidi || [];
      const mesiTot = prep.reduce(function(a,x){ return a + x.ob.mesi; }, 0);
      ["E18","H5","J2","P2"].forEach(function(k){            /* valori "al mese": media pesata sui mesi */
        res[k] = mesiTot>0 ? prep.reduce(function(a,x){ return a + (Number(x.res[k])||0)*x.ob.mesi; }, 0)/mesiTot : 0;
      });
      res.J35 = campi.reduce(function(a,k){ return a + (["L15","L18","H19","O5","O6","O8","O5calc","O6calc","fGod","fNon","H38","J20"].indexOf(k)>=0 ? 0 : (Number(res[k])||0)); }, 0) + res.J32;
      res.F38 = res.H38;
      res.orario = res.H38>0 ? res.J35/res.H38 : 0;
      o.res = res;
      o.blocchi = prep.map(function(x){
        const p0=x.b.pairs[0], p1=x.b.pairs[x.b.pairs.length-1];
        return { da: mLabelY(p0.y,p0.m), a: mLabelY(p1.y,p1.m), mesi: x.ob.mesi, liv: x.liv || "—",
                 tab: x.tab, nSc: x.nSc, scatti: x.ob.scatti,
                 ear: x.ob.ear||0,                    /* ver141 */
                 oreSett: x.ob.oreSett, addiz: x.ob.addizTD, indet: x.indet,
                 agg: R2((Number(x.res.E18)||0) * x.ob.mesi, 2),
                 ore: R2(x.res.H38,2), costo: R2(x.res.J35 - x.res.J32, 2) };
      });
      o.formazTot = res.J32;
    }
  }
  return o;
}

/* La linguetta COSTO ORARIO. */
function CostoOrario(props){
  const state = props.state;

  const anniDisp = (function(){ const o={}; (state.anni||[]).forEach(function(y){ o[y]=true; }); o[props.anno]=true; return Object.keys(o).map(function(y){ return parseInt(y,10); }).sort(function(a,b){ return a-b; }); })();
  const [faY, setFaY] = useState(props.anno); const [faM, setFaM] = useState(1);

  const pairs = monthsBetween(parseInt(faY,10), parseInt(faM,10), parseInt(taY,10), parseInt(taM,10));

  const dp = dips.find(function(x){ return x.id===selId; }) || dips[0];

  const giallo = { border:"2px solid #f59e0b", background:"#fffde7", borderRadius:"6px", padding:"7px 9px", fontFamily:"inherit", fontSize:"15px", width:"100%" };

     incorniciate ocra. Le celle che sono frutto di formule siano azzurrine o grigioline (se
     frutto di copiature ed intoccabili)»). I tre colori erano già in uso, ma OTTO tendine
     erano rimaste col grigio brutto del sistema operativo, e mancava l'azzurrino.
     🟡 `giallo` = lo scrivi tu · ⬜ `grigio` = copiato da altrove, intoccabile ·
     🟦 `azzurro` = frutto di una formula · `neutro` = non è un dato, è una scelta di
     navigazione (il periodo che stai guardando) — scelta **1b** di Christian. */
  const gialloSel = { border:"2px solid #f59e0b", background:"#fffde7", borderRadius:"6px", padding:"7px 9px", fontFamily:"inherit", fontSize:"15px", width:"100%" };
  const azzurro = { background:"#eef5fc", border:"2px solid #b9d5f1", borderRadius:"6px" };
  const neutro = { border:"2px solid #cbd5e1", background:"#fff", borderRadius:"6px", padding:"7px 9px", fontFamily:"inherit", fontSize:"15px", color:"#334155" };

  const box = function(bg,bd){ return { background:bg, border:"1px solid "+bd, borderRadius:"10px", padding:"7px 10px", marginBottom:"6px" }; };

  const sc = (state && state.costoComune) || {};
  // ver75: la % di supplementari agisce SOLO sulle ore "Teoriche"; con le ore vere (Riepiloghi/a mano) non entra nei conti
  const suppAttiva = dips.some(function(x){ return costoPar(x).fonteOre === "teoriche"; });
  /* ver115 (06/11/2026, Christian: «forse ANNI PER RIVALUTAZIONE TFR … va disabilitata?»).
     Dalla ver114 quella casella serve SOLO a chi non ha scritto il «TFR accantonato al 31/12»:
     per gli altri la rivalutazione si calcola sul fondo vero e il numero degli anni non entra
     in nessun conto. Qui si conta quanti sono, con lo stesso meccanismo di `suppAttiva`.
     ⚠️ La casella NON viene bloccata: resta scrivibile e giallina, come la % di supplementari.
     Spegnerla davvero metterebbe a ZERO, in silenzio, la rivalutazione di chi il fondo non ce
     l'ha. Cambia solo quello che dice. */
  const senzaFondo = dips.filter(function(x){ return !(cNum(costoPar(x).tfrFondo, 0) > 0); }).length;
  const anniTfrAttivo = senzaFondo > 0;
  const anniTfrNota = anniTfrAttivo
    ? ("serve solo a chi non ha il fondo TFR scritto: " + senzaFondo + (senzaFondo===1 ? " persona" : " persone") + " su " + dips.length)
    : "non in uso: tutti hanno il fondo TFR scritto nella scheda";
  const setComune = function(campo, val){ if (props.onCostoComune) props.onCostoComune(campo, val); };
  /* ver138 — legge l'incollaggio «LIVELLO IMPORTO», una riga per livello. Accetta sia
     «D1 1.637,57» sia «D1  1637.57» sia «D1 = 1.637,57»; salta le righe vuote e quelle che non
     cominciano con un livello noto. Torna {valori, ignorate}. */
  const ccLeggi = function(txt){
    const valori = {}; const ignorate = [];
    String(txt || "").split(/[\n\r]+/).forEach(function(riga){
      const t = String(riga).trim(); if (t === "") return;
      const m = t.match(/^([A-Fa-f][0-9])\s*[=:\t ]\s*(.+)$/);
      if (!m){ ignorate.push(t.slice(0,40)); return; }
      const liv = m[1].toUpperCase();
      if (LIV_CCNL.indexOf(liv) < 0){ ignorate.push(t.slice(0,40)); return; }
      const v = cNum(m[2].replace(/[^0-9.,]/g, ""), null);
      if (v == null || !(v > 0)){ ignorate.push(t.slice(0,40)); return; }
      valori[liv] = v;
    });
    return { valori: valori, ignorate: ignorate };
  };
  const ccSalva = function(){
    const dalN = ccnlDalN(ccDal);
    if (!dalN){ setCcErr("Scrivi la data di decorrenza come gg/mm/aaaa, per esempio 01/10/2026."); return; }
    const min = ccLeggi(ccTesto);
    const nMin = Object.keys(min.valori).length;
    if (nMin === 0){ setCcErr("Non ho letto nessun importo. Scrivi una riga per livello, per esempio «D1 1.637,57»."); return; }
    const sca = ccLeggi(ccScatti);
    const nSca = Object.keys(sca.valori).length;
    const nome = String(ccNome || "").trim() || ccDal.trim();
    const esiste = ((state && state.ccnlTab) || []).some(function(t){ return ccnlDalN(t && t.dal) === dalN; });
    const sovrascriveApp = Object.keys(MINIMI_DAL).filter(function(k){ return MINIMI_DAL[k] === dalN; });

    righe.push("Aggiungo una tabella CCNL:");

    righe.push("  scatti letti: " + (nSca ? (nSca + " livelli") : "nessuno — restano quelli di prima"));

    if (mancanti.length) righe.push("  ⚠ livelli SENZA importo: " + mancanti.join(" "));
    if (min.ignorate.length) righe.push("  ⚠ righe non capite e saltate: " + min.ignorate.length);
    if (sovrascriveApp.length) righe.push("  ⚠ ha la stessa decorrenza della tabella «" + sovrascriveApp.join("/") + "» dell'app: prenderà il suo posto");
    if (esiste) righe.push("  ⚠ c'è già una tua tabella con questa decorrenza: verrà sostituita");
    righe.push("");

    righe.push("");
    righe.push("Dopo questo serve 💾 per salvare.");
    if (!window.confirm(righe.join("\n"))) return;
    const rec = { dal: ccDal.trim(), nome: nome, minimi: min.valori };
    if (nSca) rec.scatti = sca.valori;
    if (props.onCCNLAdd) props.onCCNLAdd(rec);
    setCcErr(""); setCcDal(""); setCcNome(""); setCcTesto(""); setCcScatti("");
  };
  const ccElimina = function(dal){
    if (!window.confirm("Elimino la tabella CCNL che vale dal " + dal + "?\n\nI calcoli dei periodi che la usavano torneranno alla tabella precedente.\nDopo questo serve 💾 per salvare.")) return;
    if (props.onCCNLDel) props.onCCNLDel(dal);
  };
  const setPar = function(campo, val){ if (dp && props.onCostoPatch) props.onCostoPatch(dp.id, campo, val); };
  /* ver107: due campi insieme, in una sola copia dello stato (vedi onCostoPatchMulti). */
  const setParMulti = function(campi){ if (dp && props.onCostoPatchMulti) props.onCostoPatchMulti(dp.id, campi); };

  const campoNum = function(lbl, valore, onCh, segno, titoloAiuto, spento){
    return <label style={cella} title={titoloAiuto||""}><span style={spento ? Object.assign({}, etich, { color:"#64748b" }) : etich}>{lbl}</span>
      <input value={valore==null?"":String(valore)} inputMode="decimal" style={giallo} onChange={function(e){ onCh(e.target.value); }} />
      {segno ? <span style={{ fontSize:"12.5px", color:"#475569" }}>{segno}</span> : null}
      {spento ? <span style={{ display:"block", fontSize:"13px", fontWeight:700, color:"#64748b" }}>{(typeof spento==="string") ? spento : "non in uso: serve solo con le ore «Teoriche»"}</span> : null}</label>;
  };
  /* ver137 (09/11/2026, scelta «a» di Christian: «la casella del Costo orario diventa grigia e
     di sola lettura, il dato si scrive solo in Anagrafica»). Gemella di `campoNum`, ma GRIGIA e
     non scrivibile: serve per tutto ciò che il sistema ricava da sé — dall'ANAGRAFICA o dalle
     TABELLE CCNL. È il «grigiolino» del suo punto 7.
     ⚠️ Lo stesso grigio già usato per i campi automatici dell'Anagrafica (`roauto:`) e per gli
     scatti riconosciuti della ver135: #f1f5f9 con bordo #cbd5e1. */
  /* ver146 (A1): queste caselle non si scrivono più qui. La nota dice da dove arriva il dato:
     dall'ANAGRAFICA se è scritto là, oppure — per non perdere niente — dal vecchio valore
     rimasto in questa scheda, con l'invito a riscriverlo in Anagrafica. */
  const AIUTO_ANA = "Automatico: si scrive in ANAGRAFICA → Costo del lavoro.";
  const notaAna = function(campo, extra){
    const inAna = !!(dp && dp.ana && String(dp.ana[campo]==null?"":dp.ana[campo]).trim() !== "");
    return (inAna ? "si scrive in ANAGRAFICA → Costo del lavoro" : "da scrivere in ANAGRAFICA → Costo del lavoro (qui c'è ancora il vecchio valore della scheda)")
      + (extra ? (" · " + extra) : "");
  };
  const campoRO = function(lbl, valore, nota, titoloAiuto){
    return <label style={cella} title={titoloAiuto||""}><span style={etich}>{lbl}</span>
      <input value={valore==null?"":String(valore)} disabled
        style={{ width:"100%", border:"2px solid #cbd5e1", background:"#f1f5f9", color:"#475569", borderRadius:"6px", padding:"7px 9px", fontFamily:"inherit", fontSize:"15px" }} />
      {nota ? <span style={{ display:"block", fontSize:"12.5px", color:"#475569", lineHeight:1.3 }}>{nota}</span> : null}</label>;
  };

  if (!dp) return <div style={{ padding:"20px", color:"#475569" }}>Nessun dipendente: aggiungine uno dalla scheda ANAGRAFICA.</div>;

  const d = datiCosto(state, dp, pairs);
  const r = d.res;

  /* ver147 (A1 «Simulazione», 09/11/2026, Christian: «Simulazione a1 provvedi», dopo che la
     ver146 aveva portato in ANAGRAFICA i nove dati del costo del lavoro. Sua frase in a1:
     «Solo i dati per le simulazioni puoi tenerli nella scheda costo orario, eventualmente
     creando un box apposito con celle gialline per inserire i dati»).
     Le caselle giallline che restano in questa scheda NON sono dati della persona: sono leve
     per rispondere a «quanto costerebbe se...». Qui si conta quante sono accese, perche' una

  const simMesi  = String(d.raw.mesi        == null ? "" : d.raw.mesi).trim()        !== "";

  const simOre   = (d.fonte === "mano");

  if (simSettL) simForz.push("le settimane davvero lavorabili");
  if (simOre)   simForz.push("le ore scritte a mano");
  if (d.scattiAMano) simForz.push("gli scatti di anzianita'");
  if (d.supermAMano) simForz.push("il superminimo");
  /* Una casella giallina della simulazione: vuota resta VUOTA (con il valore calcolato come
     segnaposto), perche' stamparci dentro il calcolato farebbe credere che sia scritto, ed e'
     il difetto chiuso nella ver80 sul rimborso km. */
  const campoSim = function(lbl, raw, campo, segnaposto, nota){

      {nota ? <span style={{ fontSize:"12.5px", color:"#475569" }}>{nota}</span> : null}</label>;
  };

  /* ver113 (06/11/2026, richiesta di Christian: «nel riepilogo costo orario indica aliquote e
     parametri di riferimento che consentono il calcolo a lato di ogni voce: es inps 26,90 -
     fis 0,55, tredicesima 4 mesi, ore aggiuntive 56 ore etc»).
     Qui si costruiscono SOLO le scritte: nessun calcolo è stato toccato, i numeri sono quelli
     che `calcCosto` usa davvero (`c` = aliquote comuni, `d` = dati della persona, `r` = risultato).
     ⚠️ Le percentuali si mostrano con 2 decimali, ma se l'aliquota ne ha di più (il FIS vale
     0,53333%) si mostrano tutti: scrivere «0,53%» sarebbe un'aliquota diversa da quella usata. */
  /* ⚠️ `numTxt` scrive il numero con 2 decimali, ma se ne ha di più li mostra TUTTI: senza,
     l'ISTAT 1,011 comparirebbe come «1,01» mentre il conto userebbe 1,011 — una bugia a video. */
  const numTxt = function(v){
    const n = Number(v)||0;
    const r5 = Math.round(n*100000)/100000, r2 = Math.round(n*100)/100;
    return (r5===r2) ? fmt2(r2) : String(r5).replace(".", ",");
  };
  const pctTxt = function(v){ return numTxt(v) + "%"; };
  const nTxt = function(v){ const n=Number(v)||0; return Number.isInteger(n) ? String(n) : fmt2(n); };
  /* ⚠️ La paga oraria delle ore aggiuntive si mostra con QUATTRO decimali di proposito: con due
     (12,60 invece di 12,6045) il prodotto «ore × €/h» tornava 1,10 € più basso della voce, e
     chi rifà il conto con la calcolatrice troverebbe un numero diverso. */
  const dec4 = function(v){ return R2(Number(v)||0, 4).toFixed(4).replace(".", ","); };
  const mesiTxt = function(v){ const n=Number(v)||0; return nTxt(n) + (n===1 ? " mese" : " mesi"); };
  /* ⚠️ Quando il periodo si taglia in BLOCCHI (ver84), livello, ore settimanali e addizionale
     cambiano da pezzo a pezzo: le aliquote comuni valgono per tutti, l'addizionale no. */
  const aPezzi = !!d.blocchi;
  /* ver141: la colonna E.A.R. nella tabella dei pezzi compare solo se in almeno un pezzo
     c'e' davvero l'E.A.R., per non allargare la tabella a chi non e' educatore. */
  const earCol = (d.blocchi || []).some(function(b){ return (b.ear||0) > 0; });
  const oreAggTot = R2((Number(r.E18)||0)*d.mesi, 2);
  const euroOraAgg = (oreAggTot>0) ? (r.J18/oreAggTot)
    : (r.J2 + ((d.oreSett>=38) ? (d.minimo/165*0.15) : (r.J2*0.27)));
  const kmVal = (d.kmMese!=null ? d.kmMese : c.kmMese);
  const par = {
    /* ⚠️ A pezzi `r.H5` è la MEDIA dei pezzi pesata sui mesi: lo dice, così non sembra il
       mensile di un cedolino vero. */
    J5:  (aPezzi ? "mensile fisso medio dei pezzi " : "mensile fisso ") + fmt2(r.H5) + " € × " + mesiTxt(R2(d.mesi - d.mesiMater, 3)) + " pagati",
    J6:  "mensile fisso × " + nTxt(d.mesiRatei) + "/12 mesi di ratei",
    J8:  "mensile fisso × " + nTxt(d.mesiRatei) + "/12 × " + pctTxt(c.quattordic),
    J12: nTxt(r.fNon) + (Number(r.fNon)===1 ? " giorno" : " giorni") + " × " + fmt2(c.festNonGodCoef) + " (in 26esimi del mensile fisso)",
    /* ver125: la nota dice da dove vengono le giornate, perche' sono due pezzi diversi. */
    J13: (d.ferieLiq && d.ferieLiq.gg > 0)
      ? (nTxt(d.ferieLiq.gg) + (Number(d.ferieLiq.gg)===1 ? " giornata" : " giornate")
         + (aPezzi ? (" × il mensile fisso ÷ 26 dell'ULTIMO pezzo (quello della cessazione): qui a lato il medio è " + dec4(r.H5/26) + " €")
                   : (" × " + dec4(r.H5/26) + " € (mensile fisso ÷ 26)"))
         + " — cessazione del " + d.ferieLiq.cess
         + ": " + nTxt(d.ferieLiq.ggPeriodo) + " dal saldo " + d.ferieLiq.daLbl + " → " + d.ferieLiq.aLbl
         + " (maturate " + nTxt(d.ferieLiq.matGG) + " − godute " + nTxt(d.ferieLiq.godGG) + ")"
         + (d.ferieLiq.serveMano
             ? (" + " + nTxt(d.ferieLiq.ggPrec) + " scritte a mano per gli anni prima dei dati")
             : " — niente da aggiungere: l'app ha tutta la storia dall'assunzione"))
      : (d.ferieLiq ? "nessuna giornata da liquidare" : "non dovuta: nel periodo non cade nessuna cessazione"),
    J14: mesiTxt(d.mesiMater) + " di maternità × " + pctTxt(c.integrMater),
    L15: "retribuzione + 13ª + 14ª + festività non godute + ferie non godute liquidate + maternità",
    J17: fmt2(d.premiMese) + " €/mese × " + mesiTxt(R2(d.mesi - d.premiMesiTolti, 3)),
    J18: fmt2(oreAggTot) + " h sul periodo × " + dec4(euroOraAgg) + " €/h (maggiorazione " + (d.oreSett>=38 ? "15% sul minimo" : "27%") + ")",
    L18: "imponibile I + premi + ore aggiuntive",
    /* ver136: la nota scriveva «÷ 0» quando la casella era a zero, cioè mostrava un conto
       impossibile mentre l'importo era calcolato col valore di riserva. Ora dice il divisore
       davvero usato. */
    J19: "base TFR " + fmt2(r.H19) + " € ÷ " + nTxt((isFinite(Number(c.tfrDiv)) && Number(c.tfrDiv) > 0) ? Number(c.tfrDiv) : COSTO_COMUNE_DEF.tfrDiv),
    J20: "0,50% su imponibile II",
    /* ver114: due note diverse, perché sono due conti diversi. Col fondo scritto si vede il
       conto di legge; senza, resta la stima di prima. */
    J21: (d.tfrFondo>0)
      ? ("fondo TFR" + (d.tfrFondoAnno ? (" al 31/12/" + d.tfrFondoAnno) : "") + " " + fmt2(d.tfrFondo) + " € × (1,50% + 75% dell'ISTAT " + pctTxt(c.istat) + " = " + pctTxt(R2(1.5 + c.istat*0.75, 5)) + ") × " + fmt2(d.mesiRapporto) + "/12 mesi di rapporto")
      : ("stima: quota TFR del periodo × " + nTxt(c.anniTfr) + (Number(c.anniTfr)===1 ? " anno" : " anni") + " × (1,50% + 75% dell'ISTAT " + pctTxt(c.istat) + ")"),
    J23: pctTxt(c.prevCompl) + " su base TFR × quota a carico " + pctTxt(c.prevComplPag),
    J25: pctTxt(c.inps) + " × " + pctTxt(c.inpsPag) + " su imponibile II",
    J26: aPezzi ? "diversa in ogni pezzo: vedi «Come si divide il periodo»"
       : (d.indeterminato ? "non dovuta: contratto a tempo indeterminato" : pctTxt(d.addizTD) + " su imponibile II"),
    J27: pctTxt(c.fis) + " × " + pctTxt(c.fisPag) + " su imponibile II",
    J28: pctTxt(c.inail) + " × " + pctTxt(c.inailPag) + " su imponibile II, più l'1% di addizionale",
    J29: pctTxt(c.irap) + " × quota a carico " + pctTxt(c.irapPag) + " su imponibile II",
    J30: d.indeterminato ? (fmt2(c.sanitaria) + " €/anno ÷ 12 × " + nTxt(d.mesiRatei) + " mesi di ratei")
       : "non dovuta: contratto a tempo determinato",
    J31: fmt2(c.paghe) + " € × " + nTxt(d.mesiCedolini) + (Number(d.mesiCedolini)===1 ? " cedolino" : " cedolini"),
    J32: (function(){ const n = Math.max(1, Math.ceil(d.mesi/12));
          return fmt2(c.formazione) + " € × " + n + (n===1 ? " anno iniziato" : " anni iniziati"); })(),
    J34: (d.kmTipo==="secco") ? (fmt2(kmVal) + " € una volta sola")

    J35: "somma di tutte le voci qui sopra"
  };

  const esporta = function(){

      /* ver96: se non ci sono ore, nel foglio non si scrive un numero inventato. */
      righe.push([x.nome, periodoLabel, dd.indeterminato?"Indeterminato":"Determinato", dd.mesi, dd.oreSett, dd.liv||"", dd.minimo,
                  dd.oreMancanti ? 0 : R2(dd.res.H38), org, R2(dd.res.J35),
                  dd.oreMancanti ? "non calcolabile" : R2(dd.res.orario)]);
    });
    const wb = XLSX.utils.book_new();
    wb.Props = { Title:"Costo orario dipendenti", Author:"Christian Canonica", Company:"Spazio Ireos Società Cooperativa Sociale", CreatedDate:new Date() };
    const ws = XLSX.utils.aoa_to_sheet(righe);
    const hdr = { font:{ name:"Arial", bold:true, color:{rgb:"FFFFFFFF"} }, fill:{ patternType:"solid", fgColor:{rgb:"FF0F2740"} }, alignment:{horizontal:"center"} };
    (righe[0]||[]).forEach(function(_,i){ const ref=XLSX.utils.encode_cell({r:0,c:i}); if (ws[ref]) ws[ref].s=hdr; });
    ws["!cols"] = righe[0].map(function(){ return { wch:18 }; });
    XLSX.utils.book_append_sheet(wb, ws, "Costo orario");
    const ora=new Date(); const p2=function(n){ return (n<10?"0":"")+n; };

  };

  /* ver113: quarto parametro facoltativo `nota` = l'aliquota o il parametro di riferimento,

          <div style={{ borderTop:"2px solid #bfdbfe", marginTop:"6px", paddingTop:"6px" }}>

          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(190px, 1fr))", gap:"8px" }}>

            {campoNum("Quattordicesima %", cMostra(sc.quattordic, COSTO_COMUNE_DEF.quattordic), function(v){ setComune("quattordic", v); }, "50 = metà mensilità")}
            {campoNum("Ferie + permessi (gg/anno)", cMostra(sc.ferie, COSTO_COMUNE_DEF.ferie), function(v){ setComune("ferie", v); }, "26 ferie + 4 permessi")}
            {campoNum("Festività godute (gg/anno)", cMostra(sc.festGodute, COSTO_COMUNE_DEF.festGodute), function(v){ setComune("festGodute", v); }, "nel periodo scelto: " + fmt2(d.res.fGod), "", "non in uso: ora si contano dal calendario")}
            {campoNum("Festività NON godute (gg/anno)", cMostra(sc.festNonGod, COSTO_COMUNE_DEF.festNonGod), function(v){ setComune("festNonGod", v); }, "nel periodo scelto: " + fmt2(d.res.fNon), "", "non in uso: ora si contano dal calendario")}

            {campoNum("Altri permessi (gg/anno)", cMostra(sc.altriPermessi, COSTO_COMUNE_DEF.altriPermessi), function(v){ setComune("altriPermessi", v); })}
            {campoNum("Ore supplementari stimate %", cMostra(sc.suppPct, COSTO_COMUNE_DEF.suppPct), function(v){ setComune("suppPct", v); }, "% delle ore del mese", "", !suppAttiva)}
            <label style={cella}><span style={etich}>Supplementari nel TFR</span>

                  <tr><td style={tdE}>Importo orario</td><td style={Object.assign({}, tdV, cifre, azzurro, { padding:"4px 8px", fontSize:"16px", color:"#1f4e82" })}>{dec4(r.J2)} €/h</td></tr>
                  <tr><td style={tdE}>Mensile fisso di questa persona</td><td style={Object.assign({}, tdV, cifre, azzurro, { padding:"4px 8px" })}>{fmt2(r.H5)} € al mese</td></tr>
                </tbody></table>
                <div style={{ fontSize:"12.5px", color:"#475569", lineHeight:1.3, marginTop:"3px" }}>
                  <b>Minimo tabellare + scatti + premi (tempo pieno) + superminimo + E.A.R.</b>, diviso <b>165</b> ore. ⚠️ Le componenti sono a <b>tempo pieno</b>: l'importo orario <b>non cambia</b> con il part-time, cambia il mensile fisso (totale ÷ 38 × <b style={cifre}>{fmt2(d.oreSett)}</b> h/settimana). Le <b>ore aggiuntive</b> si pagano su questo importo maggiorato del <b>{d.oreSett >= 38 ? "15% sul minimo" : "27%"}</b>, cioè <b style={cifre}>{dec4(euroOraAgg)}</b> €/h.

            </div>

            <div className="co-sub" style={{ flex:"1 1 100%", minWidth:0 }}>

              <div style={blocco}>
                {nomeQui(false)}
                <div style={capo}>Le ore da dichiarare</div>
                <div style={{ fontSize:"13px", color:"#475569", lineHeight:1.35, marginBottom:"6px" }}>Al Comune si dichiarano <b>solo le ore davvero lavorate</b>: le assenze non si dichiarano. Scegli da dove prenderle.</div>
                <div style={{ display:"flex", flexDirection:"column", gap:"6px", fontSize:"14.5px" }}>
                  <label style={{ display:"flex", alignItems:"center", gap:"8px", cursor:"pointer" }}>
                    <input type="radio" name={"fonte-"+dp.id} checked={d.fonte==="riepiloghi"} onChange={function(){ setPar("fonteOre","riepiloghi"); }} />
                    <span>Dai <b>Riepiloghi</b>, ore inserite nei mesi del periodo: <b style={cifre}>{fmt2(d.oreDaRiep)} h</b>{d.oreDaRiep===0 ? <span style={{ color:"#b91c1c", fontWeight:700 }}> — in questo periodo non hai inserito nessuna ora</span> : null}</span>
                  </label>
                  <label style={{ display:"flex", alignItems:"center", gap:"8px", flexWrap:"wrap", cursor:"pointer" }}>
                    <input type="radio" name={"fonte-"+dp.id} checked={d.fonte==="mano"} onChange={function(){ setPar("fonteOre","mano"); }} />
                    <span>Scritte <b>a mano</b>:</span>
                    <input value={d.raw.oreManuali==null?"":String(d.raw.oreManuali)} inputMode="decimal" placeholder="es. 850" disabled={d.fonte!=="mano"}
                      style={{ width:"110px", border: d.fonte==="mano" ? "2px solid #f59e0b" : "2px solid #cbd5e1", background: d.fonte==="mano" ? "#fffde7" : "#f1f5f9", borderRadius:"6px", padding:"7px 9px", fontSize:"15px", fontVariantNumeric:"tabular-nums" }}
                      onChange={function(e){ setPar("oreManuali", e.target.value); }} /> <span>h</span>
                  </label>
                  <label style={{ display:"flex", alignItems:"center", gap:"8px", cursor:"pointer" }}>
                    <input type="radio" name={"fonte-"+dp.id} checked={d.fonte==="teoriche"} onChange={function(){ setPar("fonteOre","teoriche"); }} />
                    <span><b>Teoriche</b>, calcolate dalla tabella qui sotto: <b style={cifre}>{fmt2(r.F38)} h</b></span>
                  </label>
                </div>

                <div style={{ marginTop:"6px", borderTop:"1px solid #b9d5f1", paddingTop:"5px" }}>
                  <div style={{ fontSize:"14.5px", fontWeight:800, color:"#1f4e82", marginBottom:"2px" }}>Da dove escono le ore teoriche</div>

                      «🧪 Simulazione»; qui si leggono i numeri in uso. */}
                  <div style={{ fontSize:"13px", color:"#475569", lineHeight:1.3, marginBottom:"5px" }}>Le due righe delle <b>settimane</b> si possono forzare dal riquadro <b>🧪 Simulazione</b> in fondo alla scheda: servono a <b>simulare</b> — per esempio «in quel periodo si lavorano davvero 18 settimane». Lasciate vuote, l'app le calcola da sé.</div>
                  <table style={{ width:"100%", borderCollapse:"collapse" }}><tbody>
                    <tr><td style={tdE}>Settimane del periodo</td>
                        <td style={Object.assign({}, tdV, cifre, { width:"130px" })}>{fmt2(r.O5)}</td>
                        <td style={{ padding:"1px 0 1px 8px", fontSize:"13px", color:"#475569" }}>{simSettP ? <span>⚠️ <b>scritte a mano</b> in 🧪 Simulazione — calcolate: <b style={cifre}>{fmt2(r.O5calc)}</b></span> : <span>calcolate: <b style={cifre}>{fmt2(r.O5calc)}</b></span>}</td></tr>
                    <tr><td style={tdE}>Settimane davvero lavorabili</td>
                        <td style={Object.assign({}, tdV, cifre)}>{fmt2(r.O6)}</td>
                        <td style={{ padding:"1px 0 1px 8px", fontSize:"13px", color:"#475569" }}>{simSettL ? <span>⚠️ <b>scritte a mano</b> in 🧪 Simulazione — tolte ferie, festività e malattia: <b style={cifre}>{fmt2(r.O6calc)}</b></span> : <span>tolte ferie, festività e malattia: <b style={cifre}>{fmt2(r.O6calc)}</b></span>}</td></tr>
                    <tr><td style={tdE}>Ore settimanali</td><td style={Object.assign({}, tdV, cifre)}>{hoursDisp(d.oreSett)}</td><td></td></tr>
                    <tr><td style={tdE}>Ore lavorabili sul periodo</td><td style={Object.assign({}, tdV, cifre)}>{fmt2(r.O8)} h</td>
                        <td style={{ padding:"1px 0 1px 8px", fontSize:"13px", color:"#475569" }}>settimane × ore settimanali</td></tr>
                  </tbody></table>
                  {d.suppMensileAttivo ? <div style={{ fontSize:"12.5px", color:"#475569", lineHeight:1.3, marginTop:"4px" }}>⚠️ Con le ore <b>dai Riepiloghi</b> le <b>ore in più</b> non si contano da qui: si contano <b>mese per mese</b> sul monte contrattuale (riquadro «Le ore in più, mese per mese»). Questa tabellina serve alle ore <b>Teoriche</b> e alla simulazione: è lì che valgono ancora i giorni <b>presunti</b> di ferie e malattia dei valori comuni.</div> : null}
                  {/* ver133 (08/11/2026, Nu* di Christian: «la questione settimane davvero
                      lavorabili in realtà ci serve? Non calcoliamo tutto dalle ore reali da
                      tabellone?»). Con le ore dai Riepiloghi o a mano queste due caselle NON
                      servono per contare le ore, ma scriverle spegne il conto mese per mese
                      (ver117) e il taglio del periodo in pezzi (ver84): l'app ora lo dice.
                      NESSUN calcolo è cambiato: è solo un avviso. */}
                </div>
              </div>

              {/* ver147 (A1, 09/11/2026, Christian: «Simulazione a1 provvedi»). Il riquadro
                  raccoglie le caselle giallline che restano in questa scheda: non sono dati
                  della persona (quelli stanno in ANAGRAFICA dalla ver146) ma leve per
                  rispondere a «quanto costerebbe se...».
                  ⚠️ NESSUN calcolo e' cambiato: sono le stesse caselle di prima, spostate, con
                  gli stessi avvisi (ver108 per i mesi, ver133 per le settimane) e lo stesso
                  pulsante. In cima l'elenco delle forzature accese. */}
              <div style={Object.assign({}, blocco, { borderLeft:"4px solid #f59e0b" })}>
                {nomeQui(false)}
                <div style={capo}>🧪 Simulazione</div>
                <div style={{ fontSize:"13px", color:"#475569", lineHeight:1.35 }}>Qui <b>non</b> si scrivono i dati della persona — quelli stanno in <b>ANAGRAFICA</b>. Queste caselle <b>giallino</b> servono a rispondere a «<i>quanto costerebbe se…</i>»: scritte, <b>vincono sul calcolo</b>; lasciate vuote, l'app calcola da sé.</div>
                {simForz.length ?
                  <div style={{ marginTop:"5px", background:"#fff8e1", border:"2px solid #eac87a", borderRadius:"8px", padding:"7px 9px", fontSize:"12.5px", color:"#78350f", lineHeight:1.35 }}>
                    ⚠️ <b>Stai simulando.</b> L'app sta usando quello che hai scritto a mano per: <b>{simForz.join(" · ")}</b>.
                    {(d.scattiAMano || d.supermAMano) ? <div style={{ marginTop:"3px" }}>⚠️ <b>Gli scatti di anzianità e il superminimo si svuotano nel riquadro «La retribuzione»</b>, dove stanno accanto al minimo tabellare che forzano.</div> : null}
                    {simOre ? <div style={{ marginTop:"3px" }}>⚠️ Le <b>ore scritte a mano</b> si scelgono qui sopra, in «Le ore da dichiarare»: per tornare alle ore vere rimetti il pallino su <b>Dai Riepiloghi</b>.</div> : null}
                  </div>
                  : <div style={{ marginTop:"5px", background:"#ecfdf5", border:"2px solid #86c7a8", borderRadius:"8px", padding:"7px 9px", fontSize:"12.5px", color:"#065f46", lineHeight:1.35 }}>
                      ✅ <b>Non stai simulando niente</b>: i numeri di questa scheda sono quelli che l'app calcola dai dati veri.
                    </div>}
                <div className="co-grid" style={grigliaCampi}>
                  {/* ver147: la casella era l'ULTIMA con il difetto chiuso nella ver80 sul
                      rimborso km: da vuota mostrava il valore calcolato (12), quindi battendo
                      una cifra in fondo diventava «125» e il costo passava da 18.197,43 € a
                      164.566,02 €. Misurato in esecuzione, identico nella ver146. Ora e' vuota
                      con il calcolato come SEGNAPOSTO, come le due righe delle settimane.
                      ⚠️ Nessun calcolo e' cambiato: cambia solo cosa si vede da vuota. */}
                  {campoSim("Mesi di contratto", d.raw.mesi, "mesi", fmt2(d.mesiAuto),
                    "proposti: " + fmt2(d.mesiAuto) + " (giorni veri) · ferie, 13ª e 14ª su " + d.mesiRateiAuto)}
                  {(function(){
                    /* ver108 (05/11/2026, chiesto da Christian dopo la verifica meticolosa):
                       avviso giallo quando i mesi sono SCRITTI A MANO e non coincidono con
                       quelli calcolati sul periodo scelto. Senza, cambiando il periodo i conti
                       restavano fermi sul numero scritto e non lo diceva nessuno.
                       ⚠️ ver147: spostato qui dentro, testo identico. */
                    if (!simMesi) return null;
                    const nMan = cNum(d.raw.mesi, d.mesiAuto);
                    if (Math.abs(nMan - d.mesiAuto) <= 0.005) return null;
                    return <div style={{ gridColumn:"1 / -1", background:"#FFF8E1", border:"1px solid #EAC87A", borderRadius:"8px", padding:"7px 10px", marginTop:"2px", fontSize:"13px", lineHeight:1.35, color:"#7c4a03" }}>
                      ⚠️ <b>I mesi sono scritti a mano</b>: l'app sta usando <b>{fmt2(nMan)}</b>, non i <b>{fmt2(d.mesiAuto)}</b> che risultano dal periodo scelto ({d.periodoLabel || "il periodo scelto in cima"}).
                      Anche ferie, 13ª, 14ª e assistenza sanitaria seguono il numero scritto (<b>{Math.round(nMan)}</b> invece di {d.mesiRateiAuto}), e i cedolini sono <b>{Math.ceil(nMan)}</b> invece di {d.mesiCedoAuto}.
                      <b> Svuota la casella</b> per tornare al calcolo automatico.
                    </div>;
                  })()}
                  {campoSim("Settimane del periodo", d.raw.settPeriodo, "settPeriodo", fmt2(r.O5calc), "calcolate: " + fmt2(r.O5calc))}
                  {campoSim("Settimane davvero lavorabili", d.raw.settLav, "settLav", fmt2(r.O6calc), "tolte ferie, festività e malattia: " + fmt2(r.O6calc))}
                  {/* ver133 (08/11/2026, Nu* di Christian: «la questione settimane davvero
                      lavorabili in realtà ci serve? Non calcoliamo tutto dalle ore reali da
                      tabellone?»). Con le ore dai Riepiloghi o a mano queste due caselle NON
                      servono per contare le ore, ma scriverle spegne il conto mese per mese
                      (ver117) e il taglio del periodo in pezzi (ver84): l'app lo dice.
                      ⚠️ ver147: spostato qui dentro, testo identico. */}
                  {((simSettP || simSettL) && d.fonte !== "teoriche") ?
                    <div style={{ gridColumn:"1 / -1", background:"#fff8e1", border:"2px solid #eac87a", borderRadius:"8px", padding:"7px 9px", fontSize:"12.5px", color:"#78350f", lineHeight:1.35 }}>
                      ⚠️ <b>Queste settimane sono scritte a mano, ma qui non servono.</b> Con le ore {d.fonte === "mano" ? "scritte a mano" : "dai Riepiloghi"} le ore del periodo arrivano da lì, non dalla tabellina delle teoriche: lei serve solo alle ore <b>Teoriche</b> e alle simulazioni.
                      <div style={{ marginTop:"3px" }}>⚠️ Scriverle però <b>spegne due cose</b>: le <b>ore in più</b> tornano a contarsi sul <b>totale del periodo</b> invece che <b>mese per mese</b>, e il periodo <b>non si divide più in pezzi</b> (niente riquadro «Come si divide il periodo»). Il costo cambia di conseguenza.</div>
                      <div style={{ marginTop:"3px" }}>Per tornare all'automatico premi <b>↺ Rimetti i valori calcolati</b> qui sotto.</div>
                    </div> : null}
                </div>
                {/* ver147: lo stesso pulsante della ver73, con la stessa dicitura, che ora
                    svuota anche i mesi: sono le tre caselle di questo riquadro, e vanno in una
                    sola copia dello stato (ver107, altrimenti la seconda scrittura cancella la
                    prima). */}
                {(simMesi || simSettP || simSettL) ?
                  <button className="btn btn-gray" style={{ marginTop:"6px" }}
                    onClick={function(){ setParMulti({ mesi:"", settPeriodo:"", settLav:"" }); }}>↺ Rimetti i valori calcolati</button> : null}
              </div>
            </div>

            </div>

            <div className="co-det" style={{ flex:"1 1 340px", minWidth:0 }}>
              <div style={{ border:"2px solid #1f4e82", borderRadius:"12px", padding:"13px 12px", background:"#fff" }}>
                {nomeQui(true)}
                <div style={{ textAlign:"center", fontSize:"22px", fontWeight:700, color:"#0F2740", ...cifre }}>{fmt2(r.J35)} €</div>
                <div style={{ height:"2px", background:"#1f4e82", margin:"6px 0" }}></div>
                <div style={{ textAlign:"center", fontSize:"22px", fontWeight:700, color:"#0F2740", ...cifre }}>{d.oreMancanti ? "—" : fmt2(r.H38)} ore</div>
                <div style={{ textAlign:"center", fontSize:"13px", color:"#475569", margin:"6px 0 2px" }}>costo del periodo diviso le ore dichiarate</div>
                {d.oreMancanti ? (
                  <div>
                    <div style={{ textAlign:"center", fontSize:"24px", fontWeight:800, color:"#b45309", lineHeight:1.15 }}>non calcolabile</div>
                    <div style={{ textAlign:"center", fontSize:"13px", fontWeight:700, color:"#92400e", marginTop:"3px", lineHeight:1.35 }}>in questo periodo non ci sono ore {d.fonte === "mano" ? "scritte a mano" : "nei Riepiloghi"}</div>
                  </div>
                ) : (
                  <div>
                    <div style={{ textAlign:"center", fontSize:"34px", fontWeight:800, color:"#1f4e82", lineHeight:1.1, ...cifre }}>{fmt2(r.orario)}</div>
                    <div style={{ textAlign:"center", fontSize:"15px", fontWeight:700, color:"#1f4e82" }}>euro all'ora</div>
                  </div>
                )}
              </div>

              {/* ver136: un divisore scritto a ZERO rompeva il calcolo e il risultato veniva
                   mostrato come «0,00», senza dire niente. Ora si usa il valore di riserva e
                   l'avviso dice quale casella va rimessa a posto. ⚠️ Dicitura nuova, scritta da
                   Claude: prima non c'era nessun avviso. */}
              {(r.divNonValidi && r.divNonValidi.length) ? (
                <div style={{ background:"#FEE2E2", border:"2px solid #b91c1c", borderRadius:"8px", padding:"7px 10px", marginTop:"8px", fontSize:"13px", lineHeight:1.35, color:"#7f1d1d" }}>
                  🔴 <b>{r.divNonValidi.length === 1 ? "Un valore comune non è valido" : "Due valori comuni non sono validi"}: {r.divNonValidi.join(" e ")}.</b> Non può valere zero, perché è un divisore. Il costo qui sopra è calcolato con il valore di riserva ({r.divNonValidi.indexOf("Giorni settimanali") >= 0 ? ("giorni settimanali " + nTxt(COSTO_COMUNE_DEF.ggSett)) : ""}{r.divNonValidi.length === 2 ? " · " : ""}{r.divNonValidi.indexOf("Divisore TFR") >= 0 ? ("divisore TFR " + nTxt(COSTO_COMUNE_DEF.tfrDiv)) : ""}), quindi <b>non è il numero vero</b>.
                  <div style={{ marginTop:"3px" }}>Rimetti il valore giusto in <b>⚙ Aliquote e costi fissi validi per tutti</b> (o nella scheda della persona) e premi 💾.</div>
                </div>
              ) : null}

              {/* ver120 (Christian ha scelto la strada 1: solo un avviso, nessun numero toccato) */}
              {/* ver125: se le ferie non godute vengono LIQUIDATE (c'e' una cessazione nel
