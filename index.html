/* ============== LEGGIBILITA' (ver66 - 31ott26) ==============
   Pensata per chi legge con la vista stanca.
   1) nessuna scritta sotto i 12px fuori dalla griglia del mese;
   2) i grigi chiari su bianco diventano piu' scuri: piu' contrasto;
   3) bordo ben visibile sulla casella in cui stai scrivendo;
   4) pulsanti piu' alti, piu' facili da centrare.
   Le misure minuscole sono scritte dentro l'attributo style, percio' si
   recuperano con [style*="..."] e !important. Solo aspetto: nessuna logica.  */
[style*="font-size: 5px"],[style*="font-size: 6px"],[style*="font-size: 9px"],
[style*="font-size: 11px"],[style*="font-size: 11.5px"]{font-size:12.5px !important}
[style*="color: #94a3b8"],[style*="color: #cbd5e1"],
[style*="color: #9ca3af"]{color:#475569 !important}
.btn{min-height:40px;font-size:14px}
/* ver69 (02nov26): campi dell'anagrafica piu' vicini tra loro. Solo spazi:
   l'altezza delle caselle NON si tocca, resta comoda da toccare col dito. */
.ana-grid .field label{margin-bottom:2px}
input:focus,select:focus,textarea:focus{outline:3px solid #1d4ed8;outline-offset:1px}
.btn:focus-visible{outline:3px solid #1d4ed8;outline-offset:2px}
/* ================= fine aggiunta leggibilita' ================= */

  /* ===== COSTO ORARIO — due sotto-colonne solo su schermi larghi (ver76) ===== */
  /* Sotto i 1500px NON cambia nulla: .co-sub resta a tutta larghezza, come prima. */
  /* su telefono e tablet stretto le caselle stanno in due per riga invece che in una sola */
  @media (max-width:900px){
    .co-grid { grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)) !important; }
    /* su telefono la tabellina delle settimane usciva di lato: le etichette vanno a capo */
    .co-sub table td { white-space:normal !important; }
    /* ===== ver117 (06/11/2026, Christian: «3, sistema») — ANAGRAFICA su telefono ======
       Difetto PREESISTENTE misurato il 05/11/2026 con la verifica meticolosa: a 390px la
       vista Anagrafica scorreva di lato (724px). Causa: l'elenco delle persone e la scheda
       stanno su una riga flex che non va a capo, e la scheda (flex:1) ha min-width:auto,
       quindi non si restringe sotto la larghezza minima del suo contenuto — che e' la riga
       «Genera documento: 📄 Contratto 📄 Proroga 📄 Trasformazione».
       Qui l'elenco va a capo e i tre pulsanti si impilano. Solo aspetto: nessuna dicitura,
       nessun campo, nessuna logica toccata; sopra i 900px non cambia niente. */
    .ana-wrap { flex-wrap:wrap !important; }
    .ana-wrap > div { min-width:0 !important; }
    .ana-sheet { flex:1 1 100% !important; }
    .ana-gen { flex-wrap:wrap !important; }
  }
  @media (min-width:1500px){
    .co-wrap { flex-grow:2; }
    .co-sub  { flex:1 1 360px !important; }
    .co-det  { flex:1 1 320px !important; }
    /* nelle colonne strette le etichette delle tabelle devono poter andare a capo,
       altrimenti la tabellina delle settimane esce dal riquadro (provato il 03/11/2026) */
    .co-sub table td { white-space:normal !important; }
  }

  /* ===== ver86 (04/11/2026) — si vede meglio quello che conta ==================
     Richieste di Christian: "ingrossiamo le cornici nelle schede in cui inserisco
     le ore, perche' la vista mi si confonde" e "il risultato del mese evidenzialo
     bene". Solo aspetto: nessuna dicitura, nessun calcolo. */
  /* a) griglia del mese: le righe della tabella passano da 1px quasi invisibile
        (#e2e8f0) a 2px di grigio medio, e la casella in cui scrivi da 2 a 3px.
        La tabella si allarga di ~32px ma sta dentro .grid-wrap, che gia' scorre. */
  table.cal td { border:2px solid #94a3b8; }
  .cell-in { border-width:3px; }
  .cell-in.blocked { border:2px dashed #cbd5e1; }
  /* b) il risultato del mese: da pastiglia piccola a badge pieno, con lo stesso
        colore del cartellino che gli sta accanto (arancione / viola / verde). */
  .cong-row { gap:8px; }
  .cong-chip.strong { border:none; color:#fff; padding:5px 16px; font-size:19px; font-weight:800; box-shadow:0 2px 6px rgba(0,0,0,.25); }
  .cong-chip.strong b { font-size:26px; font-weight:900; letter-spacing:.3px; }
  /* ver88 (04/11/2026, colori scelti da Christian): ROSSO se il mese e' SOPRA la base
     (ore in piu'), VERDE ACQUA se e' SOTTO (ore in meno), VERDE se e' IN PARI.
     ⚠️ Qui il rosso NON vuol dire "pericolo": e' stato Christian a chiederlo per lo
     straordinario. Il cartellino accanto (.cong-status) segue gli stessi tre colori,
     altrimenti nella stessa riga ci sarebbero due colori diversi per la stessa cosa. */
  .cong.warn .cong-chip.strong, .cong.warn .cong-status { background:#b91c1c; }
  .cong.over .cong-chip.strong, .cong.over .cong-status { background:#0d9488; }
  .cong.ok   .cong-chip.strong, .cong.ok   .cong-status { background:#15803d; }
  /* c) TOT calcolato: era a 12px sotto la griglia, ora si legge da lontano. */
  .foot-line .foot-tot { font-size:16px; }
  .foot-line .foot-tot b { font-size:22px; font-weight:900; color:#0F2740; }

  /* ===== ver149 (07/11/2026) — LEGGIBILITA': niente sotto i 12,5px FUORI dalle griglie =====
     Trovato con il collaudo integrale chiesto da Christian. La sua regola permanente (§10.6)
     dice che nessuna scritta scende sotto i 12,5px fuori dalle griglie dense; misurando a
     390/768/1024/1280/1680px risultavano 209 scritte a 11-12px nel Tabellone, 79
     nell'Anagrafica e 18 nei Riepiloghi (fra cui intestazioni a 10px). Erano cosi' anche nella
     ver128 e nella ver126 pubblicata: difetto PREESISTENTE, non introdotto dalla ver129.
     ⚠️ ESCLUSE, di proposito:
       - tutto quello che sta DENTRO la griglia del mese (`table.cal`, `.grid-wrap`), dentro la
         tabella «Come si divide il periodo» (`.co-scroll`) e dentro le tabelle dense: alzare le
         misure la' dentro allarga la tabella, ed e' vietato (provato il 31/10 su Fogli ore);
       - targhetta della revisione (`.app-rev`), avviso «Modalita' LOCALE» (`.banner`) e barra
         «Zoom vista» (`.zlbl`, `.zval`, `.btn-fit`, `.btn-100`): sono eccezioni gia' dichiarate
         nel CLAUDE.md alla ver76.
     ⚠️ Solo la MISURA cambia: nessuna dicitura, nessun colore, nessun calcolo. */
  .pill, .legend-code, .cong-chip, .foot-teor, .sost-head, .tot-teor,
  .edit-mini, .btn-mini, .lock-badge, .lock-info, .badge, .azzera-btn,
  .sub, .ana-grid label, .ana-grid label > div, .rep-scroll th {
    font-size:12.5px;
  }
  table.cal .tot-teor, .grid-wrap .tot-teor,
  table.cal .pill, .grid-wrap .pill,
  table.cal .badge, .grid-wrap .badge,
  .co-scroll th, .tbl-dense th, .tbl-dense td { font-size:inherit; }
  /* b) le regole di cui sopra perdevano contro selettori piu' specifici o contro il
     `font-size` scritto nell'attributo `style` dal JavaScript: qui si vincono, una per una.
     Misurato con la sonda: `.emp-head .pill` (0,2,0) batteva `.pill` (0,1,0). */
  .emp-head .pill,
  .emp-head .edit-mini, .emp-head .edit-mini.qf, .emp-head .edit-mini.svuota,
  .legend-item span, .foot-line .foot-teor, .foot-line label, .nota-line label,
  .rep-scroll th, .toolbar label, .ana-gen span { font-size:12.5px !important; }
  /* c) le misure scritte in riga: la ver66 recuperava 5/6/9/11/11,5px, mancavano 10 e 12.
     ⚠️ ESCLUSE le griglie dense, dove alzare le misure allarga la tabella. */
  [style*="font-size: 10px"]:not(table.cal *):not(.grid-wrap *):not(.co-scroll *),
  [style*="font-size: 12px"]:not(table.cal *):not(.grid-wrap *):not(.co-scroll *) {
    font-size:12.5px !important;
  }
  /* d) le eccezioni dichiarate alla ver76 restano come sono (ultime, quindi comandano loro) */
  .app-rev { font-size:11px !important; }
  .app-header .sub { font-size:11px !important; }
  .banner, .zlbl, .zval, .btn-fit, .btn-100 { font-size:12px !important; }

  /* ================= COMPATTAZIONE (ver134 - 08nov26) =================
     Richiesta di Christian dell'08/11/2026: "REVISIONE GRAFICA COMPLESSIVA
     DEL GESTIONALE - compattazione dell'interfaccia".
     Tre sue scelte, prese con una domanda prima di costruire:
       1) NIENTE VERDE: la codifica a colori per provenienza del dato non e'
          distinguibile dal solo CSS (parametro preassegnato e compilazione
          manuale sono la stessa casella nel DOM), quindi si rimanda.
       2) I COLORI GIA' SCELTI DA LUI VINCONO SEMPRE: qui NON si cambia
          nessun colore, nessuno sfondo, nessun bordo. Solo spazi.
       3) LE ALTEZZE NON SI RIDUCONO: .btn resta a min-height 40px (ver66),
          .cell-in resta height 34px, le caselle restano quelle che sono.
          Si stringono SOLO margini, imbottiture, distanze e interlinea dei
          CONTENITORI, come vuole il paragrafo 10.6.
     ESCLUSIONI: niente di tutto questo entra dentro la griglia del mese
     (table.cal, .grid-wrap) ne' dentro "Come si divide il periodo"
     (.co-scroll): la' le misure non si toccano (provato il 31/10 su Fogli
     ore: la tabella si allarga e su telefono si scorre di piu').
     Nessuna dicitura, nessun calcolo, nessun dato toccati.
     ==================================================================== */

  /* --- a) il telaio: testata, linguette, barre --- */
  .app-header { padding:8px 14px; gap:10px; }
  .tabs { padding:6px 12px 0; }
  .zoombar { padding:4px 12px; }
  .yearbar { padding:2px 5px; }
  .monthstrip { margin:6px -14px -8px; padding:5px 14px; }

  /* --- b) l'area di lavoro e le schede delle persone --- */
  .content { padding:10px; }
  .toolbar { margin-bottom:8px; }
  .lock-info { padding:5px 10px; margin-bottom:8px; }
  .emp-card { margin-bottom:10px; }
  .emp-head { padding:7px 12px; }
  .grid-wrap { padding:6px 8px 3px; }
  .foot-line { padding:5px 14px 2px; }

  /* --- c) i riquadri sotto la griglia (conguaglio, sostituzioni, note) --- */
  .cong { margin-top:3px; padding:6px 9px; }
  .cong-head { margin-bottom:4px; }
  .cong-plain { padding:4px 8px; margin-bottom:4px; }
  .cong-bar { margin:2px 0 4px; }
  .sost-box { margin:3px 14px 7px; padding:6px 8px; }
  .sost-head { margin-bottom:4px; }
  .sost-row { margin-bottom:4px; }
  .nota-line { padding:5px 14px 8px; }
  .note-box { margin:7px 14px 10px; padding:7px 9px; }
  .note-head { margin-bottom:5px; }
  .voce-row { margin-bottom:4px; }

  /* --- d) Riepiloghi e legenda --- */
  .legend, .rep-box { padding:8px 11px; margin-bottom:9px; }
  .legend h3, .rep-box h3 { margin:0 0 5px; }
  table.rep th, table.rep td { padding:4px 7px; }

  /* --- e) finestre --- */
  .overlay { padding:12px; }
  .modal { padding:15px; }
  .field { margin-bottom:8px; }
  .modal-actions { margin-top:11px; }
  .login-box { padding:22px; }

  /* --- f) spaziature scritte in riga dal JavaScript: servono !important.
         Ogni regola esclude le tre griglie dense. --- */
  /* i quattro riquadri in fondo alla scheda: proroghe, trasformazioni,
     monte ore, massimali (sono il contenitore piu' largo dell'app) */
  [style*="padding: 12px"][style*="margin-bottom: 12px"]:not(table.cal *):not(.grid-wrap *):not(.co-scroll *)
    { padding:8px !important; margin-bottom:8px !important; }
  /* riquadro "Come si usa" e riquadro "Mensilizza tutti" dell'Anagrafica */
  [style*="padding: 10px 14px"]:not(table.cal *):not(.grid-wrap *):not(.co-scroll *)
    { padding:7px 10px !important; }
  [style*="padding: 12px 14px"]:not(table.cal *):not(.grid-wrap *):not(.co-scroll *)
    { padding:8px 11px !important; }
  /* la scheda dell'Anagrafica e il riquadro del risultato del Costo orario */
  .ana-sheet { padding:10px !important; }
  [style*="padding: 13px 12px"]:not(table.cal *):not(.grid-wrap *):not(.co-scroll *)
    { padding:9px 10px !important; }
  /* le sezioni dell'Anagrafica e le righe di spiegazione */
  [style*="margin-bottom: 16px"]:not(table.cal *):not(.grid-wrap *):not(.co-scroll *)
    { margin-bottom:10px !important; }
  [style*="margin-bottom: 14px"]:not(table.cal *):not(.grid-wrap *):not(.co-scroll *)
    { margin-bottom:9px !important; }

  /* --- g) interlinea dei testi lunghi di spiegazione, fuori dalle griglie.
         NON cambia la misura dei caratteri: solo lo spazio fra le righe. --- */
  .legend p, .rep-box p, .co-par { line-height:1.25; }


  /* --- h) secondo giro: Anagrafica e Costo orario erano gia' compatti
         (ver69 e ver76), qui si recupera il resto degli spazi in riga. --- */
  .ana-grid { gap:5px !important; }
  [style*="margin-bottom: 10px"]:not(table.cal *):not(.grid-wrap *):not(.co-scroll *)
    { margin-bottom:7px !important; }
  [style*="margin-bottom: 8px"]:not(table.cal *):not(.grid-wrap *):not(.co-scroll *)
    { margin-bottom:5px !important; }
  [style*="margin-bottom: 6px"]:not(table.cal *):not(.grid-wrap *):not(.co-scroll *)
    { margin-bottom:4px !important; }
  [style*="margin-top: 6px"]:not(table.cal *):not(.grid-wrap *):not(.co-scroll *)
    { margin-top:4px !important; }
  /* i riquadri del Costo orario: box() e blocco, 7px 10px -> 5px 8px */
  [style*="padding: 7px 10px"]:not(table.cal *):not(.grid-wrap *):not(.co-scroll *)
    { padding:5px 8px !important; }

  /* ============== fine aggiunta ver134 ============== */

/* R2: arrotonda SENZA farsi ingannare dal modo in cui il computer tiene i decimali.
   67,5 x 22,99 dentro la macchina vale 1551,8249999999998 e R2(x) lo

function R2(v,dec){dec=(dec==null)?2:dec;var n=Number(v);if(!isFinite(n))return 0;var seg=n<0?-1:1;n=Math.abs(n);var p=Math.pow(10,dec);return seg*(Math.round(Number((n*p).toPrecision(12)))/p)}
function fmt2(num){
  let n = parseFloat(String(num).replace(",", "."));
  if (isNaN(n)) n = 0;
  const neg = n < 0; n = Math.abs(R2(n,2));
  const s = n.toFixed(2);
  const parts = s.split(".");
  let out = "";
  for (let i = 0; i < parts[0].length; i++){
    if (i > 0 && (parts[0].length - i) % 3 === 0) out += ".";
    out += parts[0][i];
  }
  return (neg ? "-" : "") + out + "," + parts[1];
}

function pasqua(anno){

  const m=Math.floor((a+11*h+22*l)/451),mese=Math.floor((h+l-7*m+114)/31),giorno=((h+l-7*m+114)%31)+1;
  return { m:mese, d:giorno };
}

function getRecFrom(state, y, m, dipId){
  const mp = state.dati[monthKey(y, m)] || {};
  return mp[dipId] || { giorni:{}, nota:"" };
}
function totOfRec(rec, y, m){
  let t = 0; const nd = daysInMonth(y, m);
  for (let d = 1; d <= nd; d++) t += parseHour(rec.giorni[d]);
  return Math.round(t * 100) / 100;
}
function saldoPrec(state, anno, mese, dipId){
  const months = [];
  Object.keys(state.dati || {}).forEach(function(k){
    const mm = k.match(/^(\d{4})-(\d{1,2})$/); if (!mm) return;
    const y = parseInt(mm[1], 10), m = parseInt(mm[2], 10);
    if (y > anno || (y === anno && m >= mese)) return; // solo mesi precedenti
    const rec = state.dati[k][dipId]; if (!rec) return;
    months.push({ y:y, m:m, rec:rec, key:y*100+m });
  });
  months.sort(function(a,b){ return a.key - b.key; });
  let startIdx = 0;
  for (let i = 0; i < months.length; i++){ if (months[i].rec.saldoAzzerato) startIdx = i + 1; } // riparte dopo l'ultimo azzeramento
  let s = 0;
  for (let i = startIdx; i < months.length; i++){
    const d = String(months[i].rec.dich == null ? "" : months[i].rec.dich).trim(); if (d === "") continue;
    const D = parseFloat(d.replace(",", ".")); if (isNaN(D)) continue;
    s += (D - totOfRec(months[i].rec, months[i].y, months[i].m));
  }
  return Math.round(s * 100) / 100;
}
function dipSorted(state){
  const arr = state.dipendenti.slice();
  arr.sort(function(a,b){ return a.nome.localeCompare(b.nome); });
  return arr;
}

          const sv = String(v === undefined ? "" : v).trim();
          let txt;
          if (sv === "--") txt = "R";                                       // riposo settimanale -> R (in rosso)
          else if (sv === "") txt = isDom ? "R" : (rosso ? "–" : "");       // domenica senza dato -> riposo (per tutti)
          /* ver87: anche per i mensilizzati si scrivono le ORE, non piu' la "P" di presenza
             (richiesta di Christian del 04/11/2026). */
          else if (CODE_SET[sv]) txt = sv;
          else txt = pdfHM(v);
          /* ver91: nel Report il permesso si segnala con TRE asterischi grossi (richiesta di
             Christian del 05/11/2026) e in calce si scrive quante ore vanno aggiunte. */
          if (perm){ txt = (txt === "" ? "***" : txt + "***"); permMese.push({ nome:dp.nome, giorno:d, ore:perm.ore, tipo:perm.tipo }); }
          row.push(txt);
        });
        row.push(dayLabel);
        body.push(row);
      }
      /* ver87: il totale finale resta in CENTESIMI (numero decimale vero), non in ore,minuti. */
      const totRow = ["TOT ORE RESE"].concat(tot.map(function(t){ return fmt2(R2(t)); })).concat(["TOT ORE RESE"]);
      body.push(totRow);
      const ncols = 2 + chunk.length;
      const lastIdx = chunk.length + 1;
      doc.autoTable({
        /* ver93: numeri piu' grandi (Christian: "i numeri sono molto piccoli nel report, a
           prova di aquila") e margine basso stretto, per far stare le 33 righe in una pagina. */
        head: head, body: body, startY: 16, theme:"grid", margin:{ left:14, right:14, top:16, bottom:8 }, tableWidth: ncols*colW,
        styles:{ fontSize:7.5, cellPadding:0.8, halign:"center", valign:"middle", lineColor:[210,210,210], lineWidth:0.1, overflow:"linebreak", cellWidth:colW, fontStyle:"bold" },
        headStyles:{ fillColor:[15,39,64], textColor:[255,255,255], fontSize:6.5, valign:"middle", fontStyle:"bold", cellWidth:colW },
        columnStyles:(function(){ const cs={ 0:{ halign:"left", fontStyle:"bold", cellWidth:colW } }; cs[lastIdx]={ halign:"left", fontStyle:"bold", cellWidth:colW }; return cs; })(),
        didParseCell: function(data){
          const ci = data.column.index;
          const isDayCol = (ci === 0 || ci === lastIdx);
          if (isDayCol){ data.cell.styles.lineColor = [15,39,64]; data.cell.styles.lineWidth = 0.5; }
          if (data.section !== "body") return;
          const ri = data.row.index;
          const raw = String(data.cell.raw || "").trim();
          const isPerm = raw.slice(-3) === "***";        // ver91: cella con permesso orario
          const isNum = /^-?\d+,\d{2}(\*\*\*)?$/.test(raw);   // ore in formato ORE,MINUTI
          const isWhole = /^-?\d+,00(\*\*\*)?$/.test(raw);    // ore intere -> ",00" in grigio
          /* ver87: lo sbiadito del ",00" vale solo per le celle dei giorni, non per la riga
             del TOTALE, che ormai e' un numero decimale vero.
             ver91: se la cella ha un permesso, se ne occupa il disegno dei tre asterischi. */
          if (!isDayCol && isPerm && ri !== nd){ data.cell.__perm3 = true; data.cell.text = [""]; data.cell.styles.minCellHeight = 10.5; }
          else if (!isDayCol && isWhole && ri !== nd){ data.cell.__hm00 = true; data.cell.text = [""]; }
          if (ri === nd){ data.cell.styles.fontStyle = "bold"; data.cell.styles.fillColor = [238,242,255]; if (!isDayCol) data.cell.styles.fontSize = 9; return; }
          const day = ri + 1;
          if (isDayCol){
            if (isRosso(fset, anno, m, day)){ data.cell.styles.fillColor = [178,34,34]; data.cell.styles.textColor = [255,255,255]; }
          } else {
            if (isNum) data.cell.styles.fontSize = 9; // ver93: le ore si leggono senza occhiali
            const txt = raw.replace(/\*$/, "");
            if (txt === "R"){ data.cell.styles.textColor = [178,34,34]; data.cell.styles.fontStyle = "bold"; } // riposo: R in rosso
            else if (CODE_SET[txt]){
              const hx = CODE_SET[txt].bg.replace("#","");
              data.cell.styles.fillColor = [parseInt(hx.slice(0,2),16), parseInt(hx.slice(2,4),16), parseInt(hx.slice(4,6),16)];
              data.cell.styles.textColor = lumaText(CODE_SET[txt].bg) === "#ffffff" ? [255,255,255] : [17,24,39];
            }
          }
        },
        didDrawCell: function(data){
          if (data.section === "body" && data.row.index < nd && weekdayOf(anno, m, data.row.index + 1) === 0){
            doc.setDrawColor(15, 39, 64); doc.setLineWidth(0.5);
            doc.line(data.cell.x, data.cell.y + data.cell.height, data.cell.x + data.cell.width, data.cell.y + data.cell.height);
          }
          if (data.cell.__perm3){
            /* ver93 (dicitura scelta da Christian): sotto il valore si scrive
               "+ aggiunta / come sotto / ***", su tre righe perche' la colonna e' stretta. */
            let raw = String(data.cell.raw || "").trim();
            const val = raw.slice(0, raw.length - 3);
            const fs = data.cell.styles.fontSize || 8;
            const cx = data.cell.x + data.cell.width / 2;
            let y = data.cell.y + 1.6;
            doc.setFont(undefined, "bold");
            const tc = data.cell.styles.textColor;
            if (Array.isArray(tc)) doc.setTextColor(tc[0], tc[1], tc[2]); else doc.setTextColor(17, 24, 39);
            if (val){ doc.setFontSize(fs); y += fs * 0.3528 * 0.8; doc.text(val, cx, y, { align:"center", baseline:"middle" }); }
            doc.setTextColor(109, 40, 217);
            doc.setFontSize(6);
            y += 2.4; doc.text("+ aggiunta", cx, y, { align:"center", baseline:"middle" });
            y += 2.4; doc.text("come sotto ***", cx, y, { align:"center", baseline:"middle" });
            return;
          }
          if (!data.cell.__hm00) return;
          let raw = String(data.cell.raw || "").trim();
          let star = ""; if (raw.slice(-1) === "*"){ star = "*"; raw = raw.slice(0, -1); }
          const p2 = ",00" + star;
          const p1 = raw.slice(0, raw.length - ",00".length);
          const fs = data.cell.styles.fontSize || 9;
          doc.setFontSize(fs); doc.setFont(undefined, "bold");
          const w1 = doc.getTextWidth(p1); const w2 = doc.getTextWidth(p2);
          const cx = data.cell.x + data.cell.width / 2;
          const cy = data.cell.y + data.cell.height / 2;
          const sx = cx - (w1 + w2) / 2;
          const tc = data.cell.styles.textColor;
          if (Array.isArray(tc)) doc.setTextColor(tc[0], tc[1], tc[2]); else doc.setTextColor(17, 24, 39);
          doc.text(p1, sx, cy, { baseline:"middle" });
          doc.setTextColor(180, 180, 180);
          doc.text(p2, sx + w1, cy, { baseline:"middle" });
        }
      });

      if (ci === chunks.length - 1){
        let yy = doc.lastAutoTable.finalY + 6;
        const ensureY = function(h){ if (yy + h > FONDO){ doc.addPage(); yy = 18; } };
        /* ver95 (05/11/2026): la riga di legenda e' stata TOLTA su richiesta di Christian
           ("sopprimi la legenda nel pdf"). I tre setter restano perche' li usano i blocchi
           che seguono, che non li rimettono tutti. */
        doc.setFontSize(6.5); doc.setTextColor(90,90,90); doc.setFont(undefined,"normal");
        // RECUPERO / ORE NUOVE (mensilizzati con debito pregresso)
        const recupLines = [];
        dipsMese.forEach(function(dp){
          if (!dp.mensilizzato) return;
          if (!(mensDalYM(dp)===0 || (anno*100+m) >= mensDalYM(dp))) return;
          const bp = bancaPrecA(state, dp, anno, m);
          const bm = bancaMeseA(state, dp, anno, m);
          if (bm == null) return;
          const deb = Math.max(0, -bp);
          if (deb <= 0.0005) return;
          const rec = (bm > 0) ? Math.min(bm, deb) : 0;
          const nuo = R2((bm - rec),3);
          recupLines.push(dp.nome + " — debito pregresso " + fmt3(deb) + " h: recupero " + fmt3(R2(rec,3)) + " h, ore nuove " + fmt3(nuo) + " h");
        });
        if (recupLines.length > 0){
          ensureY(8);
          const boxH = 7 + recupLines.length*4.2 + 2;
          if (yy + boxH > FONDO){ doc.addPage(); yy = 18; }
          doc.setFillColor(255,247,237); doc.setDrawColor(251,146,60); doc.setLineWidth(0.4);
          doc.rect(13, yy - 4, 184, boxH, "FD");
          doc.setFontSize(9); doc.setTextColor(124,45,18); doc.setFont(undefined,"bold");
          doc.text("RECUPERO / ORE NUOVE DEL MESE (mensilizzati con debito pregresso)", 15, yy); yy += 5.2;
          doc.setFontSize(8); doc.setFont(undefined,"normal"); doc.setTextColor(60,40,20);
          recupLines.forEach(function(l){ const ls = doc.splitTextToSize("•  " + l, 178); ls.forEach(function(x){ ensureY(4.2); doc.text(x, 16, yy); yy += 4.2; }); });
          yy += 2;
        }
        // NOTE DEL MESE — ben visibili, subito sotto la tabella
        if (noteMese.length > 0){
          ensureY(10);
          doc.setFillColor(255,249,224); doc.setDrawColor(245,158,11); doc.setLineWidth(0.4);
          const boxH = 6.5 + noteMese.reduce(function(a,n){ return a + 4.6 + n.righe.reduce(function(b,rg){ return b + Math.max(1, doc.splitTextToSize(rg, 165).length) * 4.2; }, 0); }, 0) + 3;
          if (yy + boxH > FONDO){ doc.addPage(); yy = 18; }
          doc.rect(13, yy - 4, 184, boxH, "FD");
          doc.setFontSize(10.5); doc.setTextColor(146,64,14); doc.setFont(undefined,"bold");
          doc.text("NOTE DEL MESE", 15, yy); yy += 6;
          noteMese.forEach(function(n){
            doc.setFontSize(8.4); doc.setFont(undefined,"bold"); doc.setTextColor(15,39,64);
            ensureY(4.6); doc.text("•  " + n.nome, 15, yy); yy += 4.4;
            doc.setFont(undefined,"normal"); doc.setTextColor(40,40,40); doc.setFontSize(8);
            n.righe.forEach(function(rg){
              const ls = doc.splitTextToSize(rg, 165);
              ls.forEach(function(line){ ensureY(4.2); doc.text(line, 20, yy); yy += 4.2; });
            });
            yy += 1;
          });
          yy += 2;
        }
        if (permMese.length > 0){
          yy += 1; ensureY(4);
          doc.setFontSize(7); doc.setTextColor(15,39,64); doc.setFont(undefined,"bold");
          doc.text("Permessi orari (segnalati con ***, non inclusi nel TOT):", 14, yy); yy += 3.6; doc.setFont(undefined,"normal");
          doc.setFontSize(6.5); doc.setTextColor(70,70,70);
          permMese.forEach(function(pp){
            const riga = pp.nome + " — giorno " + pp.giorno + ": Aggiungere " + fmt2(pp.ore) + " ore di permesso (" + pp.tipo + ")";
            const ls = doc.splitTextToSize("•  " + riga, 269); ensureY(ls.length * 3.2); doc.text(ls, 14, yy); yy += ls.length * 3.2; });
        }
        if (orfani.length > 0){
          yy += 3;
          const lines = [];
          orfani.forEach(function(dp){ const ls = doc.splitTextToSize("•  " + dp.nome + " — ha ore registrate fuori rapporto (prima dell'assunzione o dopo la cessazione), NON incluse: verificare.", 178); ls.forEach(function(l){ lines.push(l); }); });
          const boxH = 7 + lines.length*4.2 + 2;
          if (yy + boxH > FONDO){ doc.addPage(); yy = 18; }
          doc.setFillColor(254,226,226); doc.setDrawColor(220,38,38); doc.setLineWidth(0.4);
          doc.rect(13, yy - 4, 184, boxH, "FD");
          doc.setFontSize(9.5); doc.setTextColor(153,27,27); doc.setFont(undefined,"bold");
          doc.text("ATTENZIONE — ore fuori rapporto non incluse nella stampa", 15, yy); yy += 5.4;
          doc.setFontSize(8); doc.setFont(undefined,"normal"); doc.setTextColor(120,20,20);
          lines.forEach(function(line){ ensureY(4.2); doc.text(line, 18, yy); yy += 4.2; });
        }
      }
    });
  });
  if (first){ doc.setFontSize(12); doc.text("Nessun dato nel periodo selezionato", 14, 24); }
  doc.save(fileName("pdf"));
}

/* ===== ver153 (11/11/2026) — REPORT PDF A4 MENSILIZZ. =========================
   Richiesta di Christian: «un pdf a4 report in dipendenti che segnali giornalmente la presenza,
   AN oppure altra assenza retribuita indicando P se presente il dipendente, oppure AN oppure
   altra assenza retribuita e a parte il totale supplementare da dare all'ufficio paghe che
   elabora i cedolini mensilizzati». Nome del pulsante scelto da lui: «Report PDF A4 mensilizz.».
   ⚠️ Il Report che c'era PRIMA non e' stato toccato: la «P» ne era stata TOLTA da Christian
   stesso il 04/11/2026 (ver87, «il pdf a4 mi deve dare le ore come in precedenza, non con A o
   P»), quindi questo e' un SECONDO report, separato.
   ⚠️ Ci vanno dentro solo i MENSILIZZATI del mese (sua regola: «ci vanno dentro i mensilizzati,
   da ottobre 26 sono tutti mensilizzati»). Se in quel mese non ce n'e' nessuno, lo dice.
   ⚠️ Il «supplementare» e' il Risultato del mese del Tabellone (`bancaMeseA`), col suo SEGNO:
   puo' essere piu', meno o zero. Esiste solo dai mesi >= ottobre 2026 (BM_DAL_YM): prima si
   scrive «—», non uno zero che sarebbe una bugia.
   ⚠️ Le festivita' NON GODUTE stanno in una colonna A PARTE: sono retribuite ma NON coprono le
   ore dovute, quindi si pagano IN PIU' (sua regola dell'11/11/2026). Si contano dal CALENDARIO
   con `contaFestivita` (i festivi che cadono di domenica piu' il 4 novembre sempre) e si pagano
   alla stessa quota delle festivita' godute, cioe' ore settimanali / giorni settimanali.
   ⚠️ Diciture nuove, scritte da Claude. */
function esportaPDFMens(state, pairs){
  const JsPDF = window.jspdf.jsPDF;
  const doc = new JsPDF({ orientation:"landscape", unit:"mm", format:"a4" });
  const PG_H = (doc.internal && doc.internal.pageSize && doc.internal.pageSize.getHeight)
    ? doc.internal.pageSize.getHeight() : 210;
  const FONDO = PG_H - 10;
  const dips = dipSorted(state);
  /* ver154 (11/11/2026, Christian: «Un'unica tabella anche qui in unica pagina»): prima erano
     blocchi da 14 colonne, cioè due pagine con 16 mensilizzati. Alzato a 24: su A4 orizzontale
     269 mm / 26 colonne restano ~10 mm a colonna, che bastano per P / AN / R e i codici. */
  const MAXCOL = 24;
  let first = true;
  pairs.forEach(function(pr){
    const anno = pr.y, m = pr.m;
    const fset = festivitaSet(anno);
    const mk = monthKey(anno, m);
    const dati = state.dati[mk] || {};
    const ymP = anno*100 + m;
    const inForzaMese = function(dp){ const aInt=assunzInt(dp); const aMon=aInt?Math.floor(aInt/100):0; const ceStr=cessEffStr(dp); const ceInt=ymdIt(ceStr); const ceMon=ceInt?Math.floor(ceInt/100):0; return (!aMon || ymP>=aMon) && (!ceMon || ymP<=ceMon); };
    const mensAl = function(dp){ return !!dp.mensilizzato && (mensDalYM(dp)===0 || ymP >= mensDalYM(dp)); };
    const dipsMese = dips.filter(function(dp){ return inForzaMese(dp) && mensAl(dp); });
    const haData = Object.keys(dati).some(function(k){ const rr=dati[k]; return rr.giorni && Object.keys(rr.giorni).length>0; });
    if (!haData && dipsMese.length === 0) return;
    const nd = daysInMonth(anno, m);
    if (!first) doc.addPage();
    first = false;
    if (dipsMese.length === 0){
      doc.setFontSize(12); doc.setTextColor(15,39,64); doc.setFont(undefined,"bold");
      doc.text("Spazio Ireos — Presenze mensilizzati   ·   " + MONTH_LABEL[m-1] + " " + anno, 14, 12);
      doc.setFontSize(10); doc.setFont(undefined,"normal"); doc.setTextColor(120,20,20);
      doc.text("In questo mese non c'è nessun dipendente mensilizzato: niente da mandare alle paghe.", 14, 22);
      return;
    }
    /* ---- i numeri di ciascuno, una volta sola ---- */
    const righe = dipsMese.map(function(dp){
      const rec = getRecFrom(state, anno, m, dp.id);
      const am = assMese(rec, dp, anno, m);
      const fg = festGoduteMese(state, dp, anno, m, null);
      const perm = permOreMese(rec);
      const nonGodGG = contaFestivita([{ y:anno, m:m }], dp).non;
      /* ver154 (Christian: «2 uniforma su monte/26»): la quota delle festività NON GODUTE è ora
         la stessa del Costo orario (J12 = H5/26). Le GODUTE restano a oreSett/ggSett (ver119). */
      const quotaFest = quotaGiorno(dp, anno, m);
      let ggP = 0, ggAN = 0;
      for (let d=1; d<=nd; d++){
        const cv = String(rec.giorni[d] == null ? "" : rec.giorni[d]).trim();
        if (cv === "") continue;
        if (CODE_SET[cv]){ if (cv === "AN") ggAN++; continue; }
        if (parseHour(cv) > 0) ggP++;
      }
      return { dp:dp, rec:rec, am:am, ggP:ggP, ggAN:ggAN,
               rese: totOfRec(rec, anno, m), dovute: monteFissoMese(dp, anno, m),
               festOre: fg.ore, festGG: fg.gg, permOre: perm.pagate, permAltre: perm.altre,
               nonGodGG: nonGodGG, nonGodOre: nonGodGG * quotaFest,
               compilato: recHasData(rec), sup: bancaMeseA(state, dp, anno, m) };
    });
    /* ---- le voci di assenza DAVVERO usate in questo mese, nell'ordine di CODICI ---- */
    const vociCop = CODICI.filter(function(c){
      if (c.c === "--" || c.c === "AN") return false;
      if (!copreOre(c.c)) return false;
      return righe.some(function(r){ return (r.am.cop.perCod[c.c] || 0) > 0; });
    }).map(function(c){ return c.c; });
    const vociNon = CODICI.filter(function(c){
      if (c.c === "--" || c.c === "AN") return false;
      if (copreOre(c.c)) return false;
      return righe.some(function(r){ return (r.am.nonRetr.perCod[c.c] || 0) > 0 || (c.c === "FESTNG" && r.am.festngCelle.gg > 0); });
    }).map(function(c){ return c.c; });
    /* ---- la pagina delle presenze ---- */
    const chunks = []; for (let i=0; i<righe.length; i+=MAXCOL) chunks.push(righe.slice(i, i+MAXCOL));
    const permMese = [];
    const colW = Math.round((269 / (2 + Math.min(righe.length, MAXCOL))) * 100) / 100;
    chunks.forEach(function(chunk, ci){
      if (ci > 0) doc.addPage();
      doc.setFontSize(12); doc.setTextColor(15,39,64); doc.setFont(undefined,"bold");
      let titolo = "Spazio Ireos — Presenze mensilizzati   ·   " + MONTH_LABEL[m-1] + " " + anno;
      if (chunks.length > 1) titolo += "   (dipendenti " + (ci*MAXCOL+1) + "–" + (ci*MAXCOL+chunk.length) + " di " + righe.length + " · pag. " + (ci+1) + "/" + chunks.length + ")";
      doc.text(titolo, 14, 12);
      doc.setFont(undefined,"normal");
      const head = [["Giorno"].concat(chunk.map(function(r){ return r.dp.nome; })).concat(["Giorno"])];
      const body = [];
      for (let d=1; d<=nd; d++){
        const rosso = isRosso(fset, anno, m, d);
        const isDom = weekdayOf(anno, m, d) === 0;
        const dayLabel = d + " " + WD[weekdayOf(anno, m, d)];
        const row = [dayLabel];
        chunk.forEach(function(r){
          const cv = String(r.rec.giorni[d] == null ? "" : r.rec.giorni[d]).trim();
          const perm = (r.rec.permessi && r.rec.permessi[d]) ? r.rec.permessi[d] : null;
          let txt;
          if (cv === "--") txt = "R";
          else if (cv === "") txt = isDom ? "R" : (rosso ? "–" : "");
          else if (CODE_SET[cv]) txt = cv;                 /* AN e le assenze col loro codice */
          else txt = (parseHour(cv) > 0) ? "P" : "";       /* ore scritte -> presente */
          if (perm){ txt = (txt === "" ? "***" : txt + "***"); permMese.push({ nome:r.dp.nome, giorno:d, ore:perm.ore, tipo:perm.tipo }); }
          row.push(txt);
        });
        row.push(dayLabel);
        body.push(row);
      }
      /* ver154 (Christian: «in calce scrivi oltre ai giorni di P anche tutti i totali dei giorni
         di assenza retribuita e non retribuita, indicandoli dettagliatamente»): una riga per
         voce, non più il solo «gg P». Stessa tabella, in calce. */
      const totRighe = [];
      totRighe.push({ lab:"gg P", get:function(r){ return r.ggP; } });
      vociCop.forEach(function(c){ totRighe.push({ lab:"gg " + c, get:function(r){ return r.am.cop.perCod[c] || 0; } }); });
      vociNon.forEach(function(c){ totRighe.push({ lab:"gg " + c, get:function(r){
        return (c === "FESTNG") ? ((r.am.nonRetr.perCod[c] || 0) + r.am.festngCelle.gg) : (r.am.nonRetr.perCod[c] || 0); } }); });
      totRighe.push({ lab:"gg AN", get:function(r){ return r.ggAN; } });
      totRighe.push({ lab:"gg R", get:function(r){ return r.am.riposi.gg; } });
      totRighe.forEach(function(tr){
        body.push([tr.lab].concat(chunk.map(function(r){ const n = tr.get(r); return n ? String(n) : ""; })).concat([tr.lab]));
      });
      const nTot = totRighe.length;
      const lastIdx = chunk.length + 1;
      doc.autoTable({
        head: head, body: body, startY: 16, theme:"grid", margin:{ left:14, right:14, top:16, bottom:8 },
        tableWidth: (2 + chunk.length) * colW,
        styles:{ fontSize:8.5, cellPadding:0.8, halign:"center", valign:"middle", lineColor:[210,210,210], lineWidth:0.1, overflow:"linebreak", cellWidth:colW, fontStyle:"bold" },
        headStyles:{ fillColor:[15,39,64], textColor:[255,255,255], fontSize:6.5, valign:"middle", fontStyle:"bold", cellWidth:colW },
        columnStyles:(function(){ const cs={ 0:{ halign:"left", fontStyle:"bold", cellWidth:colW } }; cs[lastIdx]={ halign:"left", fontStyle:"bold", cellWidth:colW }; return cs; })(),
        didParseCell: function(data){
          const ci2 = data.column.index;
          const isDayCol = (ci2 === 0 || ci2 === lastIdx);
          if (isDayCol){ data.cell.styles.lineColor = [15,39,64]; data.cell.styles.lineWidth = 0.5; }
          if (data.section !== "body") return;
          const ri = data.row.index;
          const raw = String(data.cell.raw || "").trim();
          const isPerm = raw.slice(-3) === "***";
          if (!isDayCol && isPerm && ri < nd){ data.cell.__perm3 = true; data.cell.text = [""]; data.cell.styles.minCellHeight = 10.5; }
          if (ri >= nd){                                   /* le righe dei totali in calce */
            data.cell.styles.fontStyle = "bold";
            data.cell.styles.fillColor = (ri === nd) ? [238,242,255] : [245,247,252];
            if (isDayCol){ data.cell.styles.fontSize = 6.5; data.cell.styles.halign = "left"; }
            else data.cell.styles.fontSize = 9;
            return;
          }

          if (isDayCol){

          } else {
            const txt = raw.replace(/\*\*\*$/, "");

            else if (txt === "R"){ data.cell.styles.textColor = [178,34,34]; }

            }
          }
        },
        didDrawCell: function(data){

            doc.setDrawColor(15, 39, 64); doc.setLineWidth(0.5);
            doc.line(data.cell.x, data.cell.y + data.cell.height, data.cell.x + data.cell.width, data.cell.y + data.cell.height);
          }
          if (!data.cell.__perm3) return;
          const raw = String(data.cell.raw || "").trim();
          const val = raw.slice(0, raw.length - 3);
          const fs = data.cell.styles.fontSize || 8;
          const cx = data.cell.x + data.cell.width / 2;
          let y = data.cell.y + 1.6;
          doc.setFont(undefined, "bold");
          const tc = data.cell.styles.textColor;
          if (Array.isArray(tc)) doc.setTextColor(tc[0], tc[1], tc[2]); else doc.setTextColor(17, 24, 39);
          if (val){ doc.setFontSize(fs); y += fs * 0.3528 * 0.8; doc.text(val, cx, y, { align:"center", baseline:"middle" }); }
          doc.setTextColor(109, 40, 217); doc.setFontSize(6);
          y += 2.4; doc.text("+ aggiunta", cx, y, { align:"center", baseline:"middle" });
          y += 2.4; doc.text("come sotto ***", cx, y, { align:"center", baseline:"middle" });
        }
      });
    });
    /* ---- la pagina per l'ufficio paghe: UNA SOLA tabella ---- */
    doc.addPage();
    doc.setFontSize(12); doc.setTextColor(15,39,64); doc.setFont(undefined,"bold");
    doc.text("Spazio Ireos — Per l'ufficio paghe   ·   " + MONTH_LABEL[m-1] + " " + anno, 14, 12);
    doc.setFont(undefined,"normal");
    const supEsiste = (ymP >= BM_DAL_YM);
    const dash = "—";
    /* ver154 (Christian: «serve più precisione: ore rese, di cui assenze retribuite ferie x ore,
       di cui permessi exf y ore, di cui malattia z ore etc.; poi festivi non goduti e
       supplementari a parte, nonché AN ed equiparabili (asp 0h) e riposi. Tutto in un'unica
       tabella»): le voci di assenza sono ora COLONNE IN ORE, una per codice usato nel mese, e la
       tabella dei giorni non è più separata. */
    const headA = [["Dipendente","Ore dovute","Ore rese"]
      .concat(vociCop.map(function(c){ return c + " (h)"; }))
      .concat(["Permessi (h)","Fest. godute (h)","SUPPLEMENTARE","Fest. non godute (gg / h) da pagare in più"])
      .concat(vociNon.map(function(c){ return c + " (gg)"; }))
      .concat(["AN (gg)","Riposi (gg · dom.)"])];
    const iSup = 3 + vociCop.length + 2;
    let tDov=0,tRes=0,tPer=0,tFes=0,tSup=0,tNgG=0,tNgO=0,tAN=0,tRip=0,tRipD=0, nSup=0;
    const tCop={}, tNon={};
    const bodyA = righe.map(function(r){
      const cells = [r.dp.nome, fmt3(r.dovute)];
      if (!r.compilato){
        cells.push("mese non compilato");
        vociCop.forEach(function(){ cells.push(dash); });
        cells.push(dash, dash, dash, r.nonGodGG + " / " + fmt3(r.nonGodOre));
        vociNon.forEach(function(){ cells.push(dash); });
        cells.push(dash, dash);
        tNgG+=r.nonGodGG; tNgO+=r.nonGodOre;
        return cells;
      }
      tDov+=r.dovute; tRes+=r.rese; tPer+=r.permOre; tFes+=r.festOre;
      tNgG+=r.nonGodGG; tNgO+=r.nonGodOre; tAN+=r.ggAN; tRip+=r.am.riposi.gg; tRipD+=r.am.riposi.dom;
      cells.push(fmt3(r.rese));
      vociCop.forEach(function(c){
        const gg = r.am.cop.perCod[c] || 0; const ore = gg * r.am.quota;
        tCop[c] = (tCop[c] || 0) + ore;
        cells.push(gg ? fmt3(ore) : "");
      });
      cells.push(fmt3(r.permOre), fmt3(r.festOre));
      let sup = dash;
      if (supEsiste && r.sup != null){ sup = (r.sup > 0.0005 ? "+" : "") + fmt3(r.sup); tSup+=r.sup; nSup++; }
      cells.push(sup, r.nonGodGG + " / " + fmt3(r.nonGodOre));
      vociNon.forEach(function(c){
        const gg = (c === "FESTNG") ? ((r.am.nonRetr.perCod[c] || 0) + r.am.festngCelle.gg) : (r.am.nonRetr.perCod[c] || 0);
        tNon[c] = (tNon[c] || 0) + gg;
        cells.push(gg ? String(gg) : "");
      });
      cells.push(r.ggAN ? String(r.ggAN) : "", r.am.riposi.gg + " · " + r.am.riposi.dom);
      return cells;
    });
    const totRow = ["TOTALE", fmt3(tDov), fmt3(tRes)]
      .concat(vociCop.map(function(c){ return tCop[c] ? fmt3(R2(tCop[c],3)) : ""; }))
      .concat([fmt3(tPer), fmt3(tFes),
               (nSup ? ((tSup > 0.0005 ? "+" : "") + fmt3(R2(tSup,3))) : dash),
               tNgG + " / " + fmt3(R2(tNgO,3))])
      .concat(vociNon.map(function(c){ return tNon[c] ? String(tNon[c]) : ""; }))
      .concat([tAN ? String(tAN) : "", tRip + " · " + tRipD]);
    bodyA.push(totRow);
    doc.autoTable({
      head: headA, body: bodyA, startY: 16, theme:"grid", margin:{ left:14, right:14, top:16, bottom:8 },
      styles:{ fontSize:8, cellPadding:1, halign:"right", valign:"middle", lineColor:[200,200,200], lineWidth:0.1, overflow:"linebreak" },
      headStyles:{ fillColor:[15,39,64], textColor:[255,255,255], fontSize:7, halign:"center", valign:"middle", fontStyle:"bold" },
      columnStyles:(function(){ const cs={ 0:{ halign:"left", fontStyle:"bold", cellWidth:42 } };
        cs[iSup] = { fontStyle:"bold", fontSize:9.5 };
        cs[iSup+1] = { halign:"center" };
        cs[headA[0].length-1] = { halign:"center" };
        return cs; })(),
      didParseCell: function(data){
        if (data.section === "head" && data.column.index >= 3 && data.column.index < 3 + vociCop.length){
          const c = vociCop[data.column.index - 3];
          if (CODE_SET[c]){ const hx = CODE_SET[c].bg.replace("#","");
            data.cell.styles.fillColor = [parseInt(hx.slice(0,2),16), parseInt(hx.slice(2,4),16), parseInt(hx.slice(4,6),16)];
            data.cell.styles.textColor = lumaText(CODE_SET[c].bg) === "#ffffff" ? [255,255,255] : [17,24,39]; }
        }
        if (data.section !== "body") return;
        if (data.row.index === bodyA.length - 1){ data.cell.styles.fontStyle = "bold"; data.cell.styles.fillColor = [238,242,255]; }
        if (data.column.index === iSup){
          const t = String(data.cell.raw || "").trim();
          if (t.charAt(0) === "+") data.cell.styles.textColor = [185,28,28];          /* ore in piu' */
          else if (t.charAt(0) === "-" || t.charAt(0) === "−") data.cell.styles.textColor = [13,148,136]; /* ore in meno */
          else if (t !== dash) data.cell.styles.textColor = [21,128,61];               /* in pari */
        }
      }
    });
    let yy = doc.lastAutoTable.finalY + 6;
    const ensureY = function(h){ if (yy + h > FONDO){ doc.addPage(); yy = 18; } };
    if (!supEsiste){
      ensureY(6); doc.setFontSize(8.5); doc.setTextColor(120,20,20); doc.setFont(undefined,"bold");
      doc.text("Il supplementare non esiste per i mesi prima di ottobre 2026 (decorrenza della base mensile): per questo e' scritto «—».", 14, yy);
      yy += 6; doc.setFont(undefined,"normal");
    }
    /* ver154 (Christian, 11/11/2026: «NON METTERLA»): le quattro righe di legenda in calce sono
       state TOLTE. Stessa scelta della ver95 sul Report storico: non rimetterle. */
    if (permMese.length > 0){
      ensureY(5);
      doc.setFontSize(8.5); doc.setTextColor(15,39,64); doc.setFont(undefined,"bold");
      doc.text("Permessi orari (segnalati con ***, già compresi nel supplementare):", 14, yy); yy += 4; doc.setFont(undefined,"normal");
      doc.setFontSize(8); doc.setTextColor(70,70,70);
      permMese.forEach(function(pp){
        const riga = pp.nome + " — giorno " + pp.giorno + ": Aggiungere " + fmt2(pp.ore) + " ore di permesso (" + pp.tipo + ")";
        const ls = doc.splitTextToSize("•  " + riga, 269); ensureY(ls.length * 3.8); doc.text(ls, 14, yy); yy += ls.length * 3.8; });
    }
  });
  if (first){ doc.setFontSize(12); doc.text("Nessun dato nel periodo selezionato", 14, 24); }
  doc.save(fileName("pdf", "Presenze mensilizzati"));
}


/* ===================== IMPORT EXCEL ===================== */
function importaExcel(file, state, onDone){
  const reader = new FileReader();
  reader.onload = function(ev){
    try {
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, { type:"array", cellDates:true });
      const next = JSON.parse(JSON.stringify(state));
      const byName = {}; next.dipendenti.forEach(function(d){ byName[d.nome.trim().toUpperCase()] = d.id; });
      const sheetRe = /^([A-Z]{3})(\d{2})$/;
      const mAbbr = {}; MONTH_ABBR.forEach(function(a,i){ mAbbr[a] = i+1; });
      wb.SheetNames.forEach(function(sn){
        const mm = sn.trim().toUpperCase().match(sheetRe);
        if (!mm || mAbbr[mm[1]] === undefined) return;
        const mese = mAbbr[mm[1]], anno = 2000 + parseInt(mm[2],10);
        if (next.anni.indexOf(anno) === -1) next.anni.push(anno);
        const ws = wb.Sheets[sn];
        const aoa = XLSX.utils.sheet_to_json(ws, { header:1, raw:true });
        for (let i = 0; i < aoa.length; i++){
          const row = aoa[i] || []; const nome = row[0];
          if (typeof nome === "string" && String(row[10]).trim() === "ORE SETT"){
            const key = nome.trim().toUpperCase(); let id = byName[key];
            if (!id){ id = uid(); next.dipendenti.push({ id:id, nome:key, livello:"", oreSett:Number(row[11])||0, tipoContratto:"indeterminato", scadenza:"", dataAssunzione:"", dataCessazione:"", colore: PALETTE[next.dipendenti.length % PALETTE.length] }); byName[key] = id; }
            const hoursRow = aoa[i+4] || []; const nd = daysInMonth(anno, mese); const giorni = {};
            for (let d = 1; d <= nd; d++){
              const cell = hoursRow[d-1];
              if (cell === undefined || cell === null || cell === "") continue;
              giorni[d] = (typeof cell === "number") ? cell : String(cell).trim();
            }
            const notaRow = aoa[i+5] || []; let nota = ""; const nv = notaRow[0];
            if (typeof nv === "string" && nv.trim() !== "" && nv.indexOf("min") === -1) nota = nv.trim();
            const mk = monthKey(anno, mese); if (!next.dati[mk]) next.dati[mk] = {}; next.dati[mk][id] = { giorni:giorni, nota:nota };
          }
        }
      });
      next.anni.sort(function(a,b){ return a-b; }); next.updatedAt = new Date().toISOString();
      onDone(next, null);
    } catch (e) { console.error("importaExcel", e); onDone(null, "File non leggibile o formato non riconosciuto."); }
  };
  reader.onerror = function(){ onDone(null, "Errore di lettura del file."); };
  reader.readAsArrayBuffer(file);
}

function Toast(props){
  useEffect(function(){ const t = setTimeout(props.onDone, props.warn ? 3600 : 2600); return function(){ clearTimeout(t); }; }, []);
  return <div className={"toast" + (props.warn ? " warn" : "")}>{props.msg}</div>;
}

function CellInput(props){
  const [foc, setFoc] = useState(false);
  const [rif, setRif] = useState(false);          /* ver102: lampeggio quando la scrittura e' rifiutata */
  const iniz = useRef("");                        /* com'era la cella quando ci sono entrato */
  const val = (props.value === undefined || props.value === null) ? "" : props.value;
  const s = String(val).trim();
  const isCode = CODE_SET[s] !== undefined;
  let display;
  if (foc) display = String(val);
  else if (s === "") display = "";
  else if (isCode) display = s;
  else if (isNumeric(s)) display = fmt2(s);
  else display = String(val);
  const showTrattino = (s === "" && props.rosso && !props.disabled);
  const ignota = !foc && isCellaIgnota(s);          /* ver101: mentre scrivi non si segnala niente */
  return (
    <input className={"cell-in " + (isCode ? "is-code" : "is-num") + (props.disabled ? " blocked" : "") + (showTrattino ? " trattino" : "") + (ignota ? " ignota" : "") + (rif ? " rifiutata" : "")}
      style={props.style} list={foc ? "codici-list" : undefined} title={props.title} disabled={props.disabled}
      value={display} placeholder={showTrattino ? "–" : ""}
      onFocus={function(){ setFoc(true); setRif(false); iniz.current = String(val == null ? "" : val); }}
      onBlur={function(e){
        setFoc(false); setRif(false);
        /* ver102: all'uscita la cella deve contenere un codice vero o un numero.
           - «ferie» diventa «FERIE» (le maiuscole le mette l'app);
           - un pezzo rimasto a meta' («FER») viene tolto, e l'app lo dice;
           - ⚠️ una scritta che c'era GIA' PRIMA (vecchi dati) NON viene cancellata solo
             perche' ci sono entrato e uscito: resta li', segnalata in rosso dalla ver101. */
        const grezzo = String(e.target.value).trim();
        const fin = cellaValoreFinale(grezzo);
        if (fin === null){
          if (grezzo !== "" && grezzo !== String(iniz.current).trim()){
            props.onChange("");
            if (props.onAvviso) props.onAvviso(
              (isNumeric(grezzo) && !oreEntroIlMassimo(grezzo))
                ? ("In un giorno non si possono scrivere più di " + ORE_MAX_GIORNO + " ore: la cella è stata lasciata vuota.")   /* ver142 */
                : ("«" + grezzo + "» non è un codice né un numero: la cella è stata lasciata vuota."), true);
          }
        } else if (fin !== grezzo){
          props.onChange(fin);
        }
        if (props.onBlur) props.onBlur(e.target.value);
      }}
      onChange={function(e){
        const v = e.target.value;
        if (cellaScritturaAmmessa(v)){ setRif(false); props.onChange(v); }
        else {
          setRif(true);                               /* ver102: la scrittura NON entra */
          if (props.onAvviso) props.onAvviso(
            /^\d{0,2}([.,]\d{0,2})?$/.test(v) && !oreEntroIlMassimo(v)
              ? ("In un giorno non si possono scrivere più di " + ORE_MAX_GIORNO + " ore.")   /* ver142 */
              : "Qui si scrive un numero di ore oppure un codice dell'elenco (FERIE, MAL, EXF…).", true);
        }
      }} />
  );
}

function shrinkImageBlob(blob){
  return new Promise(function(resolve){
    try{
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = function(){
        try{
          let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
          if(!w||!h){ URL.revokeObjectURL(url); resolve(null); return; }
          const maxw=1000; if(w>maxw){ h=Math.round(h*maxw/w); w=maxw; }
          const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
          const ctx=cv.getContext("2d"); ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
          cv.toBlob(function(b){ URL.revokeObjectURL(url); resolve(b); }, "image/jpeg", 0.82);
        }catch(e){ URL.revokeObjectURL(url); resolve(null); }
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    }catch(e){ resolve(null); }
  });
}
function shrinkZipImages(zip){
  try{
    const names = Object.keys(zip.files).filter(function(n){ return /^word\/media\/.+\.jpe?g$/i.test(n); });
    if(!names.length) return Promise.resolve(zip);
    let chain = Promise.resolve();
    names.forEach(function(name){
      chain = chain.then(function(){
        return zip.file(name).async("blob").then(function(blob){
          if(!blob || blob.size < 120000) return;
          return shrinkImageBlob(blob).then(function(small){
            if(small && small.size > 0 && small.size < blob.size){ zip.file(name, small); }
          });
        }).catch(function(e){ });
      });
    });
    return chain.then(function(){ return zip; }).catch(function(e){ return zip; });
  }catch(e){ return Promise.resolve(zip); }
}

function withTemplatesForCloud(state){ const obj=Object.assign({}, state); const LIMIT=950000; let used=0; try{ used=JSON.stringify(obj).length; }catch(e){ return obj; } const mods={}; const cand=[["p",lsGet(LS_TEMPLATE_PRO)],["t",lsGet(LS_TEMPLATE_TRASF)],["c",lsGet(LS_TEMPLATE)]]; cand.forEach(function(pr){ const k=pr[0], v=pr[1]; if(typeof v==="string" && v.length>100 && (used + v.length + 30) < LIMIT){ mods[k]=v; used += v.length + 30; } }); if(Object.keys(mods).length) obj.modelli=mods; return obj; }

// ===== SCHEDA CONTRATTO (dentro ANAGRAFICA) ==================================
// Blocchi che prima stavano SOLO nella finestrella "Modifica dipendente":
// trasformazioni/proroghe, monte ore temporaneo, mensilizzazione, massimali
// annui, colore. Qui ogni modifica scrive subito nello stato (come fanno gia'
// gli altri campi della scheda) e accende il 💾: nessun salvataggio a parte.
// I dati restano negli stessi campi di prima: dp.proroghe, dp.trasformazioni,
// dp.orariTemp, dp.mensilizzato/mensilizzatoDal, dp.tettiAnnui/tettoAnnuo/
// tettoPeriodo, dp.colore. I calcoli non sono stati toccati.
function SchedaContratto(props){
  const dp = props.dp;
  const patch = function(o){ props.onPatch(dp.id, o); };
  const proroghe = Array.isArray(dp.proroghe) ? dp.proroghe : [];
  const trasf = Array.isArray(dp.trasformazioni) ? dp.trasformazioni.map(function(t){ return typeof t==="string" ? { data:t } : Object.assign({}, t); }) : [];
  const orariTemp = Array.isArray(dp.orariTemp) ? dp.orariTemp : [];
  const tetti = Array.isArray(dp.tettiAnnui) ? dp.tettiAnnui : [];
  const tettoPeriodo = dp.tettoPeriodo === "civile" ? "civile" : "scolastico";
  const determinato = String(dp.tipoContratto||"indeterminato") === "determinato";
  const _now = new Date();

  const [nuovaPro, setNuovaPro] = useState("");
  const [ntMese, setNtMese] = useState(String(_now.getMonth()+1));
  const [ntAnno, setNtAnno] = useState(String(_now.getFullYear()));
  const [ntLiv, setNtLiv] = useState("");
  const [ntOre, setNtOre] = useState("");
  const [ntIndet, setNtIndet] = useState(false);
  const [ntSup, setNtSup] = useState("");          /* ver131: superminimo della trasformazione */
  const [otMeseI, setOtMeseI] = useState(String(_now.getMonth()+1));
  const [otAnnoI, setOtAnnoI] = useState(String(_now.getFullYear()));
  const [otMeseF, setOtMeseF] = useState(String(_now.getMonth()+1));
  const [otAnnoF, setOtAnnoF] = useState(String(_now.getFullYear()));
  const [otOre, setOtOre] = useState("");
  const [ntTettoAnno, setNtTettoAnno] = useState("");
  const [ntTettoOre, setNtTettoOre] = useState("");
  const [ntVoci, setNtVoci] = useState([]);            /* ver100: righe servizio+ore del massimale */
  // i quattro "+ Aggiungi ..." ora APRONO le caselle, che prima stavano sempre a vista
  const [apPro, setApPro] = useState(false);
  const [apTra, setApTra] = useState(false);
  const [apOt,  setApOt]  = useState(false);
  const [apTet, setApTet] = useState(false);
  const [errPro, setErrPro] = useState("");
  const [errTra, setErrTra] = useState("");
  const [errOt,  setErrOt]  = useState("");
  const [errTet, setErrTet] = useState("");
  const _mdal = dp.mensilizzatoDal ? ymdIt(dp.mensilizzatoDal) : 0;
  const _mdef = ymdIt(MENS_DAL_DEFAULT);
  const [mensMese, setMensMese] = useState(String(Math.floor(((_mdal||_mdef)%10000)/100)));
  const [mensAnno, setMensAnno] = useState(String(Math.floor((_mdal||_mdef)/10000)));

  const giallo = { border:"2px solid #f59e0b", background:"#fffde7", borderRadius:"6px", padding:"6px 8px", fontFamily:"inherit", fontSize:"13px" };
  const etich = { fontSize:"11px", fontWeight:700, marginBottom:"2px" };
  /* ver140: le tendine di questa scheda sono DATI scritti da Christian (mese e anno di una
     trasformazione, del monte ore temporaneo, della mensilizzazione, il periodo del massimale):
     quindi giallline con cornice ocra come le caselle, non il grigio del sistema operativo. */
  const gialloSel = { border:"2px solid #f59e0b", background:"#fffde7", borderRadius:"6px", padding:"6px 8px", fontFamily:"inherit", fontSize:"14px" };

  // --- trasformazioni e proroghe ---
  const trasfSummary = function(t){
    const parts=[];
    if(t.toIndet) parts.push("→ a tempo indeterminato");
    if(t.livello) parts.push("livello "+t.livello);
    if(t.oreSett!=null && String(t.oreSett)!=="") parts.push((Number.isInteger(Number(t.oreSett))?String(Number(t.oreSett)):fmt2(Number(t.oreSett)))+" h/sett");
    if(t.superminimo!=null && String(t.superminimo)!=="") parts.push("superminimo "+fmt2(Number(t.superminimo))+" \u20ac");   /* ver131 */
    return (parts.join(", ")||"nessuna modifica")+" — dal "+t.data;
  };
  const addPro = function(){
    const v=nuovaPro.trim();
    if(v===""){ setErrPro("Scrivi la nuova data di scadenza (gg/mm/aa)."); return false; }
    patch({ proroghe: proroghe.concat([v]) }); setNuovaPro(""); setErrPro(""); return true;
  };
  const chiudiPro = function(){ setApPro(false); setNuovaPro(""); setErrPro(""); };
  const delPro = function(i){ patch({ proroghe: proroghe.filter(function(_,k){ return k!==i; }) }); };
  const addTrasf = function(){
    const mm=parseInt(ntMese,10), yy=parseInt(ntAnno,10);
    if(!mm||mm<1||mm>12||!yy||yy<2000||yy>2100){ setErrTra("Scegli un mese e un anno di 4 cifre (es. 2026)."); return false; }
    const rec={ data:"01/"+(mm<10?"0":"")+mm+"/"+yy };
    if(ntLiv.trim()!=="") rec.livello=ntLiv.trim().toUpperCase();
    /* ver136 — DIFETTO PREESISTENTE: qui si leggeva il numero con
       `String(x).replace(",",".")`, che NON capisce il punto delle migliaia. Scrivendo
       «1.500,00» nel superminimo usciva "1.500.00" -> NaN -> il campo veniva BUTTATO IN
       SILENZIO, e la trasformazione si salvava comunque (senza il superminimo) se c'era almeno
       il livello. Ora si usa `cNum`, la stessa funzione delle 35 caselle del Costo orario, e
       un numero illeggibile FERMA il salvataggio dicendolo. ⚠️ Diciture nuove, scritte da
       Claude: prima questi due messaggi non esistevano. */
    const oreTxt=String(ntOre).trim();
    const oreV=(oreTxt==="")? null : cNum(oreTxt, null);
    if(oreTxt!=="" && oreV==null){ setErrTra("Il monte ore non è un numero: scrivilo come 30 oppure 30,5."); return false; }
    if(oreV!=null) rec.oreSett=oreV;
    if(ntIndet) rec.toIndet=true;
    /* ver131: il superminimo. Lo ZERO e' un valore valido (serve a TOGLIERE un superminimo che
       c'era prima), quindi si guarda se la casella e' scritta, non se il numero e' > 0. */
    const supTxt=String(ntSup).trim();
    const supV=(supTxt==="")? null : cNum(supTxt, null);
    if(supTxt!=="" && supV==null){ setErrTra("Il superminimo non è un numero: scrivilo come 100 oppure 1.500,00."); return false; }
    if(supV!=null && supV<0){ setErrTra("Il superminimo non può essere negativo."); return false; }
    if(supV!=null) rec.superminimo=supV;
    if(!rec.livello && rec.oreSett==null && rec.superminimo==null && !rec.toIndet){ setErrTra("Compila almeno uno tra livello, monte ore, superminimo o la spunta \u00aba tempo indeterminato\u00bb."); return false; }
    patch({ trasformazioni: trasf.concat([rec]).sort(function(a,b){ return ymdIt(a.data)-ymdIt(b.data); }) });
    setNtLiv(""); setNtOre(""); setNtSup(""); setNtIndet(false); setErrTra(""); return true;
  };
  const chiudiTra = function(){ setApTra(false); setNtLiv(""); setNtOre(""); setNtSup(""); setNtIndet(false);
    setNtMese(String(_now.getMonth()+1)); setNtAnno(String(_now.getFullYear())); setErrTra(""); };
  const delTrasf = function(i){ patch({ trasformazioni: trasf.filter(function(_,k){ return k!==i; }) }); };

  // --- monte ore temporaneo ---
  const otLabel = function(w){
    const o=Number(w.oreSett);
    return (Number.isInteger(o)?String(o):fmt2(o))+" h/sett — da "+String(w.inizio).slice(3)+" a "+String(w.fine).slice(3);
  };
  const addOt = function(){
    const mi=parseInt(otMeseI,10), yi=parseInt(otAnnoI,10), mf=parseInt(otMeseF,10), yf=parseInt(otAnnoF,10);
    if(!mi||mi<1||mi>12||!yi||yi<2000||yi>2100){ setErrOt("Scegli mese e anno di inizio validi (anno di 4 cifre)."); return false; }
    if(!mf||mf<1||mf>12||!yf||yf<2000||yf>2100){ setErrOt("Scegli mese e anno di fine validi (anno di 4 cifre)."); return false; }
    const oreV=String(otOre).replace(",",".").trim();
    if(oreV==="" || isNaN(Number(oreV))){ setErrOt("Scrivi quante ore a settimana (es. 20)."); return false; }
    if((yi*100+mi) > (yf*100+mf)){ setErrOt("Il mese di inizio viene dopo quello di fine."); return false; }
    const rec={ inizio:"01/"+(mi<10?"0":"")+mi+"/"+yi, fine:"01/"+(mf<10?"0":"")+mf+"/"+yf, oreSett:Number(oreV) };
    patch({ orariTemp: orariTemp.concat([rec]).sort(function(a,b){ return ymdIt(a.inizio)-ymdIt(b.inizio); }) });
    setOtOre(""); setErrOt(""); return true;
  };
  const chiudiOt = function(){ setApOt(false); setOtOre("");
    setOtMeseI(String(_now.getMonth()+1)); setOtAnnoI(String(_now.getFullYear()));
    setOtMeseF(String(_now.getMonth()+1)); setOtAnnoF(String(_now.getFullYear())); setErrOt(""); };
  const delOt = function(i){ patch({ orariTemp: orariTemp.filter(function(_,k){ return k!==i; }) }); };

  // --- mensilizzazione ---
  const dalStr = function(m,y){
    const mm=parseInt(m,10), yy=parseInt(y,10);
    return (mm>=1 && mm<=12 && yy>=2000) ? ("01/"+(mm<10?"0":"")+mm+"/"+yy) : "";
  };
  const setMens = function(on){ patch({ mensilizzato: !!on, mensilizzatoDal: on ? dalStr(mensMese,mensAnno) : "" }); };

  // --- massimali annui ---
  const tettoRowLabel = function(t){
    const an = parseInt(t.anno,10)||0;
    const lab = an>0 ? ("dal "+an+(tettoPeriodo==="civile"?"":"/"+(an+1))) : "da sempre (valore di partenza)";
    const n = Number(String(t.ore).replace(",","."));
    return (Number.isInteger(n)?String(n):fmt2(n)) + " ore — " + lab;
  };
  const patchTetti = function(lista){
    /* ver100: se il massimale ha delle VOCI (servizio + ore), il campo `ore` viene riscritto
       con la loro somma. Così tutto il resto dell'app continua a leggere un numero solo. */
    const out = lista.map(function(t){
        const vv = tettoVoci(t);
        const ore = vv.length ? String(tettoVociSomma(vv)) : String(t.ore).trim();
        const o = { anno: parseInt(t.anno,10)||0, ore: ore };
        if (vv.length) o.voci = vv.map(function(v){ return { nome:v.nome, ore:String(v.ore) }; });
        return o;
      })
      .filter(function(t){ const nn=parseFloat(String(t.ore).replace(",",".")); return !isNaN(nn) && nn>0; })
      .sort(function(a,b){ return a.anno-b.anno; });
    let legacy = "";
    if(out.length){ const base=out.filter(function(t){ return t.anno===0; }); legacy = base.length ? base[0].ore : out[0].ore; }
    patch({ tettiAnnui: out, tettoAnnuo: legacy });
  };
  /* ver100: le righe servizio+ore. Una riga vale solo se ha IL NOME e ORE > 0; quelle lasciate
     del tutto vuote si buttano senza dire niente, quelle a metà fermano il salvataggio. */
  const vociValide = ntVoci.filter(function(v){ const n=parseFloat(String(v.ore).replace(",",".")); return String(v.nome).trim()!=="" && !isNaN(n) && n>0; });
  const vociVuote  = ntVoci.filter(function(v){ return String(v.nome).trim()==="" && String(v.ore).trim()===""; });
  const vociMezze  = ntVoci.length - vociValide.length - vociVuote.length;
  const sommaVoci  = tettoVociSomma(vociValide.map(function(v){ return { ore: parseFloat(String(v.ore).replace(",",".")) }; }));
  const addVoce = function(){ setNtVoci(ntVoci.concat([{ nome:"", ore:"" }])); };
  const setVoce = function(i, campo, val){ setNtVoci(ntVoci.map(function(v,k){ if(k!==i) return v; const n=Object.assign({},v); n[campo]=val; return n; })); };
  const delVoce = function(i){ setNtVoci(ntVoci.filter(function(_,k){ return k!==i; })); };
  const addTetto = function(){
    const anno = String(ntTettoAnno).replace(/[^0-9]/g,"").slice(0,4);
    if (ntVoci.length > 0){
      if (vociMezze > 0){ setErrTet("In ogni riga per servizio servono sia il nome sia le ore (maggiori di zero)."); return false; }
      if (vociValide.length === 0){ setErrTet("Scrivi almeno un servizio con le sue ore, oppure togli le righe e metti il totale."); return false; }
      patchTetti(tetti.concat([{ anno: anno, ore: String(sommaVoci), voci: vociValide.map(function(v){ return { nome:String(v.nome).trim(), ore:String(v.ore).trim() }; }) }]));
      setNtTettoAnno(""); setNtTettoOre(""); setNtVoci([]); setErrTet(""); return true;
    }
    const oreV=String(ntTettoOre).replace(",",".").trim();
    if(oreV==="" || isNaN(Number(oreV)) || Number(oreV)<=0){ setErrTet("Scrivi un numero di ore maggiore di zero (es. 500)."); return false; }
    patchTetti(tetti.concat([{ anno: anno, ore: String(ntTettoOre).trim() }]));
    setNtTettoAnno(""); setNtTettoOre(""); setNtVoci([]); setErrTet(""); return true;
  };
  const chiudiTet = function(){ setApTet(false); setNtTettoAnno(""); setNtTettoOre(""); setNtVoci([]); setErrTet(""); };
  const delTetto = function(i){ patchTetti(tetti.filter(function(_,k){ return k!==i; })); };

  const box = function(colore, bordo){ return { background:colore, border:"1px solid "+bordo, borderRadius:"10px", padding:"12px", marginBottom:"12px" }; };
  const titolo = { fontWeight:800, fontSize:"14px", marginBottom:"6px", display:"block" };
  const aiuto = { fontSize:"11.5px", color:"#64748b", lineHeight:1.5, margin:"0 0 8px" };

  return (
    <div style={{ marginTop:"14px" }}>

      <div style={box("#faf5ff","#e9d5ff")}>
        <label style={titolo}>Trasformaz./proroghe</label>
        <div style={aiuto}>Qui registri i <b>cambi di contratto</b> (nuovo livello, nuovo monte ore, passaggio a tempo indeterminato) e, per i contratti a termine, le <b>proroghe</b>. Ogni cambio parte <b>dal 1° del mese</b> che indichi: i mesi precedenti restano come prima, quelli successivi si adeguano da soli.</div>

        {determinato ?
          <div style={{ marginBottom:"10px" }}>
            <div style={etich}>Proroghe — la scadenza originale resta quella scritta sopra</div>
            {proroghe.length===0 ? <div style={{ fontSize:"12px", color:"#64748b", margin:"4px 0" }}>Nessuna proroga.</div> :
              <div style={{ margin:"6px 0" }}>
                {proroghe.map(function(pp,i){ return (
                  <div key={"p"+i} style={{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"4px", fontSize:"13px" }}>
                    <span style={{ fontWeight:700 }}>{i+1}ª proroga → {pp}</span>
                    <button className="voce-del" title="Rimuovi proroga" onClick={function(){ delPro(i); }}>✕</button>
                  </div>
                ); })}
                <div style={{ fontSize:"12px", color:"#1f4e82", marginTop:"4px" }}>Scadenza effettiva: <b>{proroghe[proroghe.length-1]}</b></div>
              </div>}
            {!apPro ?
              <button className="btn btn-blue" onClick={function(){ setApPro(true); setErrPro(""); }}>+ Aggiungi proroga</button> :
              <div style={{ display:"flex", gap:"8px", alignItems:"center", flexWrap:"wrap" }}>
                <input value={nuovaPro} placeholder="gg/mm/aa" autoFocus style={Object.assign({width:"140px"}, giallo)}
                  onChange={function(e){ setNuovaPro(e.target.value); }}
                  onKeyDown={function(e){ if(e.key==="Enter"){ e.preventDefault(); if(addPro()) setApPro(false); } }} />
                <button className="btn btn-blue" onClick={function(){ if(addPro()) setApPro(false); }}>✔ Aggiungi</button>

   - assistenza sanitaria: 132 euro fissi, SOLO indeterminati, non proporzionati ai mesi
     (nel foglio Excel era legata all'addizionale: qui e' legata al tipo di contratto);
   - mesi contati INTERI (prudenziale) anche se il contratto inizia o finisce a meta' mese. */

/* ver128 (06/11/2026): le TRE tranche del rinnovo CCNL e tutti i 13 livelli, dalla tabella
   ufficiale «AUMENTI RETRIBUTIVI» mandata da Christian. Prima c'erano solo 6 livelli e due
   tabelle, e due valori erano sbagliati di un centesimo (B1 Ott25 1436,78 -> 1436,79;
   E1 Ott25 1839,16 -> 1839,15): corretti sulla tabella, che e' la fonte.
   ⚠️ C3 e D1 hanno lo stesso tabellare, e cosi' D3 ed E1: e' giusto, e' scritto cosi' nella
   tabella del CCNL. */
const MINIMI_CCNL = {
  "Feb24": { "A1":1307.22,"A2":1319.37,"B1":1381.00,"C1":1485.21,"C2":1529.48,"C3":1574.41,"D1":1574.41,"D2":1660.99,"D3":1768.09,"E1":1768.09,"E2":1908.58,"F1":2107.81,"F2":2407.25 },
  "Ott24": { "A1":1333.54,"A2":1345.95,"B1":1408.89,"C1":1515.21,"C2":1560.27,"C3":1605.99,"D1":1605.99,"D2":1694.41,"D3":1803.62,"E1":1803.62,"E2":1947.00,"F1":2150.18,"F2":2455.67 },
  "Ott25": { "A1":1359.85,"A2":1372.53,"B1":1436.79,"C1":1545.21,"C2":1591.06,"C3":1637.57,"D1":1637.57,"D2":1727.83,"D3":1839.15,"E1":1839.15,"E2":1985.42,"F1":2192.54,"F2":2504.09 }
};
/* da quale mese vale ogni tabella: anno*100 + mese */
const MINIMI_DAL = { "Feb24":202402, "Ott24":202410, "Ott25":202510 };
/* La tabella in vigore in un dato mese. ⚠️ Prima del 02/2024 l'app non ha la tabella vecchia:
   usa la Feb24 e lo dice. Oggi non succede, i dati partono dal 2025. */
/* ═══ ver138 — LE TABELLE CCNL SI AGGIORNANO SENZA TOCCARE IL CODICE ═══════════════════════
   Richiesta di Christian (punto 6 della direttiva del 09/11/2026): «voglio poter caricare le
   nuove tabelle retributive in occasione di ogni rinnovo … conservare integralmente le tabelle
   precedenti e le rispettive decorrenze … aggiornare una sola volta e fare in modo che tutti i
   calcoli recepiscano automaticamente le nuove condizioni».
   ⚠️ **Prima di costruire è stato verificato che non esistesse già** (suo punto 6): le tabelle
   erano scritte SOLO dentro `index.html`, come costanti, e non c'era nessun modo di aggiungerne
   una. Non si duplica niente.
   **Come funziona.** Le tre tranche dell'app (`MINIMI_CCNL` + `MINIMI_DAL`) restano dove sono e
   non si possono cancellare: sono il punto di partenza. Quelle che Christian carica stanno nei
   DATI, in `state.ccnlTab`, e si AGGIUNGONO. Una tranche sua con la stessa decorrenza di una
   dell'app prende il posto di quella (serve a correggere un importo), ma la riga originale resta
   nel codice e ricompare se lui cancella la sua.
   ⚠️ **Gli importi storici non si sovrascrivono MAI**: ogni tranche porta la sua decorrenza e
   `ccnlAl` sceglie quella in vigore **nel mese**, quindi un periodo del 2025 continua a usare la
   tabella del 2025 anche dopo un rinnovo del 2027. È il suo punto 4.
   ⚠️ Gli **scatti** sono per Christian «fissi, nel senso che il loro importo non è mai stato
   alzato con i rinnovi» (09/11/2026), e la tabella dell'app è una sola. Ma il suo punto 6.2
   chiede di poterli aggiornare con la decorrenza: perciò una tranche può portare anche i suoi
   scatti, e se non li porta si usano quelli della tranche precedente (in fondo, quelli
   dell'app). Così la cosa funziona sia se non cambiano mai, sia se un giorno cambiano. */
function ccnlDalN(dal){                      /* "01/10/2026" -> 202610 */
  const v = ymdIt(dal); if (!v) return 0;
  return Math.floor(v/10000)*100 + Math.floor((v%10000)/100);
}
function ccnlTranche(state){
  const out = Object.keys(MINIMI_DAL).map(function(k){
    return { nome:k, dalN:MINIMI_DAL[k], minimi:MINIMI_CCNL[k], scatti:null, fonte:"app" };
  });
  ((state && state.ccnlTab) || []).forEach(function(t){
    if (!t) return;
    const dalN = ccnlDalN(t.dal); if (!dalN) return;
    const rec = { nome:(t.nome || t.dal || String(dalN)), dalN:dalN, dal:t.dal,
                  minimi:(t.minimi && typeof t.minimi==="object") ? t.minimi : {},
                  scatti:(t.scatti && typeof t.scatti==="object") ? t.scatti : null, fonte:"tuo" };
    const i = out.findIndex(function(x){ return x.dalN === dalN; });
    if (i >= 0) out[i] = rec; else out.push(rec);
  });
  out.sort(function(a,b){ return a.dalN - b.dalN; });
  return out;
}
/* la tranche in vigore in quel mese (la più recente con decorrenza <= mese) */
function ccnlAl(state, y, m){
  const el = ccnlTranche(state); const n = y*100 + m;
  let best = el[0];
  el.forEach(function(t){ if (t.dalN <= n) best = t; });
  return best;
}
/* i minimi di una tranche, per NOME: serve perché il resto del codice gira su `tab` (il nome) */
function minimiDi(state, nome){
  const t = ccnlTranche(state).find(function(x){ return x.nome === nome; });
  return (t && t.minimi) ? t.minimi : (MINIMI_CCNL[nome] || {});
}
/* lo scatto di un livello su una tranche: se la tranche non ne porta, si eredita indietro */
function scattoDi(state, nome, liv){
  const el = ccnlTranche(state);
  let i = el.findIndex(function(x){ return x.nome === nome; });
  if (i < 0) i = el.length - 1;
  for (let k = i; k >= 0; k--){ const s = el[k].scatti; if (s && s[liv] != null && !isNaN(Number(s[liv]))) return Number(s[liv]); }
  return SCATTI_CCNL[liv] || 0;
}
/* ver138: il terzo parametro `state` è FACOLTATIVO, così le chiamate senza stato continuano a
   comportarsi come prima (solo le tre tranche dell'app). Con lo stato si vedono anche le tranche
   che Christian ha caricato. */
function tabellaAl(y, m, state){
  if (state){ const t = ccnlAl(state, y, m); if (t) return t.nome; }
  const n = y*100 + m;
  let best = "Feb24";
  Object.keys(MINIMI_DAL).forEach(function(k){
    if (MINIMI_DAL[k] <= n && MINIMI_DAL[k] >= MINIMI_DAL[best]) best = k;
  });
  return best;
}
