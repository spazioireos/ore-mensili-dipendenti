          const d = state.dati[monthKey(anno, i+1)] || {};
          const filled = Object.keys(d).some(function(k){ const rr=d[k]; return rr.giorni && Object.keys(rr.giorni).length>0; });
          return <div key={a} className={"tab" + (vista==="m"+(i+1)?" active":"") + (filled?" filled":"")} onClick={function(){ setVista("m"+(i+1)); }}>{a}</div>;
        })}
        <div className={"tab rep" + (vista==="rep"?" active":"")} onClick={function(){ setVista("rep"); }}>📊 Riepiloghi</div>
        <div className={"tab rep" + (vista==="ana"?" active":"")} onClick={function(){ setVista("ana"); }}>📇 Anagrafica</div>
        <div className={"tab rep" + (vista==="query"?" active":"")} onClick={function(){ setVista("query"); }}>🔎 Query personale</div>
      </div>

      <div className="zoombar">
        <span className="zlbl">Zoom vista</span>
        <button className="zstep" title="Riduci" onClick={function(){ setZoomP(zoom - 5); }}>−</button>
        <input type="range" min="40" max="110" step="1" value={zoom} onChange={function(e){ setZoomP(parseInt(e.target.value, 10)); }} />
        <button className="zstep" title="Ingrandisci" onClick={function(){ setZoomP(zoom + 5); }}>+</button>
        <span className="zval">{zoom}%</span>
        <button className="btn-fit" title="Adatta la larghezza del mese alla finestra" onClick={fitWidth}>⤢ Adatta larghezza</button>
        <button className="btn-100" onClick={function(){ setZoomP(100); }}>100%</button>
      </div>

      <div className="content" style={{ zoom: zoom / 100 }}>
        {vista === "rep" ? <Riepiloghi state={state} anno={anno} /> :
         vista === "ana" ? <Anagrafica state={state} onAnaField={onAnaField} onAnaSet={onAnaSet} onCessCleanup={onCessCleanup} onTemplateChanged={onTemplateChanged} onImportAna={onImportAna} onExportAna={onExportAna} onAddDip={function(){ setDipModal({}); }} onEditDip={function(d){ setDipModal({ dip:d }); }} onSave={doSave} dirty={dirty} /> :
         vista === "query" ? <QueryPanel state={state} /> :
          <div>
            <div className="toolbar">
              <strong style={{ fontSize:"15px", color:"#0f2740" }}>{MONTH_LABEL[mese-1]} {anno}</strong>
              {mLocked ? <span className="lock-badge">🔒 Mese bloccato</span> : null}
              <div className="spacer"></div>
              <button className={"btn " + (mLocked ? "btn-red" : "btn-gray")} title={mLocked ? "Sblocca il mese per poterlo modificare" : "Blocca il mese: nessuna cella potrà più essere modificata"}
                onClick={toggleLock}>{mLocked ? "🔓 Sblocca mese" : "🔒 Blocca mese"}</button>
              <button className="btn btn-blue" disabled={mLocked} onClick={function(){ setDipModal({}); }}>+ Dipendente</button>
            </div>
            {mLocked ? <div className="lock-info">Questo mese è bloccato: le celle non sono modificabili. Premi "Sblocca mese" per riaprirlo.</div> : null}
            {state.dipendenti.length === 0 ?
              <div style={{ padding:"30px", textAlign:"center", color:"#64748b" }}>Nessun dipendente. Aggiungine uno o importa il file Excel.</div>
              :
              dipSorted(state).map(function(dp){
                const dipList = state.dipendenti.filter(function(x){ return x.id !== dp.id; }).map(function(x){ return x.nome; }).sort(function(a,b){ return a.localeCompare(b); });
                const saldoP = saldoPrec(state, anno, mese, dp.id);
                return <EmployeeCard key={dp.id} dp={dp} rec={getRecFrom(state, anno, mese, dp.id)} anno={anno} mese={mese} fset={fset} mLocked={mLocked}
                  dipList={dipList} onCell={onCell} onNota={onNota} onFestConfirm={onFestConfirm} onQuickFill={onQuickFill}
                  onVoceSet={onVoceSet} onVoceAdd={onVoceAdd} onVoceDel={onVoceDel}
                  onDich={onDich} onSvuotaMese={onSvuotaMese} saldoPrec={saldoP} onAzzeraSaldo={onAzzeraSaldo} onAnnullaAzzera={onAnnullaAzzera}
                  onSostAdd={onSostAdd} onSostChange={onSostChange} onSostDel={onSostDel} onOpenPerm={onOpenPerm}
                  onEditDip={function(d){ setDipModal({ dip:d }); }} onDelDip={askDelDip} />;
              })
            }
            <div className="legend">
              <h3>Legenda codici</h3>
              <div className="legend-grid">
                {CODICI.map(function(x){ return <div key={x.c} className="legend-item">
                  <span className="legend-code" style={{ background:x.bg, color:lumaText(x.bg) }}>{x.c}</span><span>{x.l}</span></div>; })}
                <div className="legend-item"><span className="legend-code" style={{ background:CRIMSON, color:"#fff" }}>festivo</span><span>Festività nazionale e domeniche (crimson #B22222)</span></div>
                <div className="legend-item"><span className="legend-code" style={{ background:"#7c3aed", color:"#fff" }}>● perm.</span><span>Pallino viola in cella = permesso orario (clic per impostarlo)</span></div>
              </div>
            </div>
          </div>
        }
      </div>

      {quickFill ? <QuickFillModal dp={quickFill} rec={getRecFrom(state, anno, mese, quickFill.id)} anno={anno} mese={mese} fset={fset} onApply={onQuickFillApply} onClose={function(){ setQuickFill(null); }} /> : null}
      {exportModal ? <ExportModal kind={exportModal} anni={state.anni} annoCorrente={anno} meseCorrente={mese}
        onGenera={function(pairs){ if (exportModal === "Excel") esportaExcel(state, pairs); else esportaPDF(state, pairs); setExportModal(null); }}
        onClose={function(){ setExportModal(null); }} /> : null}
      {permModal ? (function(){
        const rc = getRecFrom(state, anno, mese, permModal.dipId);
        const cur = (rc.permessi && rc.permessi[permModal.day]) ? rc.permessi[permModal.day] : null;
        return <PermModal perm={cur} day={permModal.day} mese={mese} anno={anno}
          onSave={function(obj){ onPermSave(permModal.dipId, permModal.day, obj); }}
          onDelete={function(){ onPermDelete(permModal.dipId, permModal.day); }}
          onClose={function(){ setPermModal(null); }} />;
      })() : null}
      {dipModal ? <DipModal dip={dipModal.dip} onSave={saveDip} onClose={function(){ setDipModal(null); }} /> : null}
      {confirm ? <ConfirmModal title={confirm.title} body={confirm.body} confirmLabel={confirm.confirmLabel} onConfirm={confirm.onConfirm} onClose={function(){ if (confirm.onCancel) confirm.onCancel(); else setConfirm(null); }} /> : null}
      {toast ? <Toast msg={toast.msg} warn={toast.warn} onDone={function(){ setToast(null); }} /> : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
