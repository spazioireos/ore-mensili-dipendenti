                   «Ferie non godute liquidate» lo ha gia' rimesso dentro. Quindi l'avviso
                   della ver120 sparisce, perche' direbbe una cosa falsa. */}
              {(d.ferie && d.ferie.debitoH > (d.ferie.quota/2) && d.ferie.pct > 0 && !(d.ferieLiq && d.ferieLiq.gg > 0)) ? (
                <div style={{ background:"#FFF8E1", border:"1px solid #EAC87A", borderRadius:"8px", padding:"7px 10px", marginTop:"8px", fontSize:"13px", lineHeight:1.35, color:"#7c4a03" }}>
                  ⚠️ <b>Ferie non godute.</b> In questo periodo ne sono maturate <b style={cifre}>{fmt2(d.ferie.matGG)}</b> giornate e ne risultano godute <b style={cifre}>{fmt2(d.ferie.godGG)}</b>: le <b style={cifre}>{fmt2(d.ferie.debitoGG)}</b> che restano (<b style={cifre}>{fmt2(d.ferie.debitoH)}</b> h) sono un <b>debito</b> — o verranno godute dopo, o andranno pagate. Finché restano lì, la persona rende più ore a parità di stipendio, quindi il <b>costo orario qui sopra è più basso del vero di circa {fmt2(d.ferie.pct)}%</b>.
                </div>
              ) : null}

              <div style={{ marginTop:"12px" }}>
                <button className="btn btn-gray" onClick={function(){ setApriDett(!apriDett); }}>{apriDett ? "▲ Nascondi il dettaglio" : "▼ Mostra il dettaglio del calcolo"}</button>
              </div>
              {apriDett ?
                <div style={{ marginTop:"10px" }}>
                  {voce("Retribuzione mensilizzata", r.J5, false, par.J5)}
                  {voce("Tredicesima", r.J6, false, par.J6)}
                  {voce("Quattordicesima", r.J8, false, par.J8)}
                  {voce("Festività non godute", r.J12, false, par.J12)}
                  {/* ver125 (06/11/2026, Christian: «fallo»). Compare SOLO quando c'e' qualcosa
                      da liquidare, cioe' quando nel periodo cade una cessazione e restano
                      giornate non godute: fuori da quel caso la voce sarebbe sempre 0,00 € e
                      allungherebbe il dettaglio per niente. */}
                  {(d.ferieLiq && d.ferieLiq.gg > 0) ? voce("Ferie non godute liquidate", r.J13, false, par.J13) : null}
                  {voce("Integrazione maternità", r.J14, false, par.J14)}
                  {voce("Imponibile I", r.L15, true, par.L15)}
                  {voce("Premi", r.J17, false, par.J17)}
                  {voce("Ore aggiuntive", r.J18, false, par.J18)}
                  {voce("Imponibile II", r.L18, true, par.L18)}
                  {voce("TFR maturato", r.J19 + r.J20, false, par.J19)}
                  {voce("0,50% già nei contributi, tolto dal TFR", -r.J20, false, par.J20)}
                  {voce("Rivalutazione TFR", r.J21, false, par.J21)}
                  {voce("Previdenza complementare", r.J23, false, par.J23)}
                  {voce("Contributi INPS", r.J25, false, par.J25)}
                  {voce("Addizionale tempo determinato", r.J26, false, par.J26)}
                  {voce("Contributi FIS", r.J27, false, par.J27)}
                  {voce("INAIL, addizionale compresa", r.J28, false, par.J28)}
                  {voce("IRAP", r.J29, false, par.J29)}
                  {voce("Assistenza sanitaria", r.J30, false, par.J30)}
                  {voce("Paghe e dichiarazioni", r.J31, false, par.J31)}
                  {voce("Formazione", r.J32, false, par.J32)}
                  {voce("Rimborso km", r.J34, false, par.J34)}
                  {voce("Costo totale", r.J35, true, par.J35)}
                  {aPezzi ? <div style={{ fontSize:"12.5px", color:"#7c4a03", background:"#fff8e1", border:"1px solid #eac87a", borderRadius:"8px", padding:"5px 7px", marginTop:"6px", lineHeight:1.3 }}>Il periodo è stato calcolato <b>a pezzi</b>: le aliquote comuni (INPS, FIS, INAIL, IRAP, TFR) valgono per tutti i pezzi, mentre <b>livello, tabella CCNL, scatti, minimo, ore settimanali, E.A.R. e addizionale</b> cambiano da pezzo a pezzo — li trovi nella tabella «Come si divide il periodo». Le voci che partono dal mensile fisso (retribuzione, 13ª, 14ª, festività) sono la <b>somma dei pezzi</b>, quindi rifacendole col mensile medio può restare qualche centesimo di differenza.</div> : null}
                  <div style={{ fontSize:"12.5px", color:"#475569", lineHeight:1.3, marginTop:"5px" }}>I parametri a lato sono scritti arrotondati: rifacendo i conti a mano può restare qualche <b>centesimo</b> di differenza, mentre gli importi sono quelli giusti.</div>
                  <table style={{ width:"100%", borderCollapse:"collapse", marginTop:"10px" }}><tbody>
                    <tr><td style={tdE}>Ore ordinarie lavorabili</td><td style={Object.assign({}, tdV, cifre)}>{fmt2(r.O8)} h</td></tr>
                    <tr><td style={tdE}>Settimane lavorabili</td><td style={Object.assign({}, tdV, cifre)}>{fmt2(r.O6)}</td></tr>
                    <tr><td style={tdE}>Ore aggiuntive al mese</td><td style={Object.assign({}, tdV, cifre)}>{fmt2(r.E18)} h</td></tr>
                    <tr><td style={tdE}>Ore aggiuntive sul periodo</td><td style={Object.assign({}, tdV, cifre)}>{fmt2((Number(r.E18)||0)*d.mesi)} h</td></tr>
                    <tr><td style={tdE}>Mensile fisso</td><td style={Object.assign({}, tdV, cifre)}>{fmt2(r.H5)} €</td></tr>
                  </tbody></table>
                  <div style={{ fontSize:"13px", color:"#475569", lineHeight:1.35, marginTop:"5px" }}>
                    {d.fonte === "teoriche"
                      ? <span>Le ore aggiuntive sono <b>stimate</b>: ore del mese teoriche (<b style={cifre}>{fmt2(r.P2)}</b> h) × <b style={cifre}>{fmt2(c.suppPct)}%</b>.</span>
                      : (d.suppMensileAttivo
                        ? <span>Le ore aggiuntive vengono <b>dal dato vero, mese per mese</b>: in ogni mese le ore rese meno le ore lavorabili <b>di quel mese</b>, mai sotto zero, e poi sommate — così <b>un mese sotto non compensa un mese sopra</b>. Le ore lavorabili del mese sono quelle <b>contrattuali</b> (165 h a 38 h/settimana, in proporzione per gli altri) meno le <b>assenze vere segnate nel Tabellone</b> (ferie, malattia e permessi retribuiti di quel mese) e meno le <b>festività godute</b>{(d.sottoSoglia > 0) ? <span>, più le ore perse sotto soglia (<b style={cifre}>{fmt2(d.sottoSoglia)}</b> h al mese)</span> : null}. È la stessa formula del <b>Risultato del mese</b> del Tabellone, con in più la deduzione delle festività. Il conto mese per mese è nel riquadro qui sotto.</span>
                        : <span>Le ore aggiuntive vengono <b>dal dato vero</b>: ore dichiarate (<b style={cifre}>{fmt2(r.H38)}</b> h) meno le ore ordinarie lavorabili (<b style={cifre}>{fmt2(r.O8)}</b> h){(d.sottoSoglia > 0) ? <span>, più le ore perse sotto soglia (<b style={cifre}>{fmt2(d.sottoSoglia * d.mesi)}</b> h)</span> : null}; mai sotto zero.</span>)}
                    {" "}Si pagano con la maggiorazione del <b>{d.oreSett >= 38 ? "15% sul minimo" : "27%"}</b>.
                  </div>
                  {(d.suppMensileAttivo && d.suppRighe && d.suppRighe.length) ? (
                    <div style={{ marginTop:"8px", border:"1px solid #d7dde5", borderRadius:"8px", padding:"6px 8px" }}>
                      <div style={{ fontSize:"14.5px", fontWeight:800, color:"#1f4e82", marginBottom:"3px" }}>Le ore in più, mese per mese</div>
                      <div className="co-scroll" style={{ overflowX:"auto", maxWidth:"100%" }}>
                      <table style={{ width:"100%", borderCollapse:"collapse", fontSize:"13.5px" }}><tbody>
                        <tr style={{ fontWeight:800, color:"#1f4e82" }}>
                          <td style={{ padding:"1px 6px 1px 0" }}>Mese</td>
                          <td style={{ padding:"1px 6px", textAlign:"right" }}>Assenze</td>
                          <td style={{ padding:"1px 6px", textAlign:"right" }}>Festività</td>
                          <td style={{ padding:"1px 6px", textAlign:"right" }}>Lavorabili</td>
                          <td style={{ padding:"1px 6px", textAlign:"right" }}>Rese</td>
                          <td style={{ padding:"1px 0", textAlign:"right" }}>In più</td>
                        </tr>
                        {d.suppRighe.map(function(rr){
                          return (
                            <tr key={"sm" + rr.y + "-" + rr.m} style={{ borderTop:"1px dotted #e2e8f0" }}>
                              <td style={{ padding:"1px 6px 1px 0" }}>{mLabelY(rr.y, rr.m)}</td>
                              <td style={{ padding:"1px 6px", textAlign:"right", color:"#64748b" }}>
                                <span style={cifre}>{fmt2(rr.ass || 0)}</span>
                                {((rr.det && rr.det.length) || rr.perm > 0.0005) ?
                                  <div style={{ fontSize:"12.5px", color:"#475569", fontWeight:400, lineHeight:1.25, whiteSpace:"normal" }}>
                                    {(rr.det || []).map(function(x){ return x.cod + " " + x.gg + (x.gg === 1 ? " gg" : " gg"); }).join(" · ")}
                                    {(rr.perm > 0.0005) ? ((rr.det && rr.det.length ? " · " : "") + "permessi " + fmt2(rr.perm) + " h") : ""}
                                  </div> : null}
                              </td>
                              <td style={{ padding:"1px 6px", textAlign:"right", color:"#64748b" }}>
                                <span style={cifre}>{fmt2(rr.fest || 0)}</span>
                                {(rr.festGG > 0) ? <div style={{ fontSize:"12.5px", color:"#475569", fontWeight:400, lineHeight:1.25 }}>{rr.festGG} gg</div> : null}
                              </td>
                              <td style={Object.assign({ padding:"1px 6px", textAlign:"right", verticalAlign:"top" }, cifre)}>{fmt2(rr.lav)}</td>
                              <td style={Object.assign({ padding:"1px 6px", textAlign:"right", verticalAlign:"top" }, cifre)}>{fmt2(rr.rese)}</td>
                              <td style={Object.assign({ padding:"1px 0", textAlign:"right", verticalAlign:"top", fontWeight: rr.supp > 0 ? 800 : 400, color: rr.supp > 0 ? "#b45309" : "#64748b" }, cifre)}>{fmt2(rr.supp)}</td>
                            </tr>
                          );
                        })}
                        <tr style={{ borderTop:"1px solid #cbd5e1", fontWeight:800 }}>
                          <td style={{ padding:"2px 6px 2px 0" }}>Totale</td>
                          <td style={Object.assign({ padding:"2px 6px", textAlign:"right", color:"#64748b" }, cifre)}>{fmt2(d.suppRighe.reduce(function(a,x){ return a + (x.ass||0); }, 0))}</td>
                          <td style={Object.assign({ padding:"2px 6px", textAlign:"right", color:"#64748b" }, cifre)}>{fmt2(d.suppRighe.reduce(function(a,x){ return a + (x.fest||0); }, 0))}</td>
                          <td style={Object.assign({ padding:"2px 6px", textAlign:"right" }, cifre)}>{fmt2(d.suppRighe.reduce(function(a,x){ return a + x.lav; }, 0))}</td>
                          <td style={Object.assign({ padding:"2px 6px", textAlign:"right" }, cifre)}>{fmt2(d.suppRighe.reduce(function(a,x){ return a + x.rese; }, 0))}</td>
                          <td style={Object.assign({ padding:"2px 0", textAlign:"right" }, cifre)}>{fmt2(d.suppMensileOre)}</td>
                        </tr>
                      </tbody></table>
                      </div>
                      {(!d.blocchi && d.suppVecchio != null) ? <div style={{ fontSize:"12.5px", color:"#475569", lineHeight:1.3, marginTop:"4px" }}>Con il conto vecchio (totale del periodo contro totale) sarebbero <b style={cifre}>{fmt2(d.suppVecchio)}</b> h: la differenza è la <b>compensazione fra i mesi</b>, che ora non c'è più.</div> : null}
                      <div style={{ fontSize:"12.5px", color:"#475569", lineHeight:1.3, marginTop:"4px" }}>La colonna <b>Assenze</b> sono le ore di ferie, malattia e permessi retribuiti <b>davvero segnate nel Tabellone</b> in quel mese, con sotto le <b>voci che le compongono</b> (giornate per ciascun codice e ore di permesso); non sono più i numeri presunti dei valori comuni. La colonna <b>Festività</b> sono le festività <b>godute</b> contate dal calendario, cioè quelle che nel Tabellone <b>non</b> hanno un codice scritto: dove invece il codice c'è (per esempio <b>FEST</b>) la giornata compare fra le Assenze, per non contarla due volte. <b>Lavorabili = monte del mese − Assenze − Festività.</b></div>
                    </div>
                  ) : null}
                </div> : null}

              {d.blocchi ? (
                <div style={blocco}>
                  <div style={capo}>Come si divide il periodo</div>
                  <div style={{ fontSize:"13px", color:"#475569", lineHeight:1.35, marginBottom:"6px" }}>Dentro il periodo che hai scelto è cambiato qualcosa (livello, ore settimanali, tipo di contratto, una proroga, il <b>rinnovo del CCNL</b> o uno <b>scatto di anzianità</b>): il conto è stato fatto <b>a pezzi</b> e poi sommato. La <b>formazione</b> ({fmt2(d.formazTot)} €) è contata <b>una volta sola</b>{d.fonte === "mano" ? ", e le ore scritte a mano sono state divise in proporzione alle ore di ciascun pezzo" : ""}.</div>
                  {/* ver117 (06/11/2026, Christian: «3, sistema»): difetto PREESISTENTE. Questa
                      tabella ha SETTE colonne e a 390px non ci sta: spingeva la pagina a 429px e
                      il Costo orario scorreva di lato. Ora scorre lei dentro il suo riquadro,
                      come fa da sempre la griglia del mese. Solo aspetto. */}
                  <div className="co-scroll" style={{ overflowX:"auto", maxWidth:"100%" }}>
                  <table style={{ width:"100%", borderCollapse:"collapse", fontSize:"13.5px" }}><tbody>
                    <tr style={{ fontWeight:800, color:"#1f4e82" }}>
                      <td style={{ padding:"1px 6px 1px 0" }}>Periodo</td>
                      <td style={{ padding:"1px 6px" }}>Liv.</td>
                      <td style={{ padding:"1px 6px" }}>Tab.</td>
                      <td style={{ padding:"1px 6px", textAlign:"right" }}>Scatti</td>
                      <td style={{ padding:"1px 6px" }}>h/sett</td>
                      <td style={{ padding:"1px 6px" }}>Addiz.</td>
                      {earCol ? <td style={{ padding:"1px 6px", textAlign:"right" }}>E.A.R.</td> : null}
                      <td style={{ padding:"1px 6px", textAlign:"right" }}>Aggiunt.</td>
                      <td style={{ padding:"1px 6px", textAlign:"right" }}>Ore</td>
                      <td style={{ padding:"1px 0", textAlign:"right" }}>Costo</td>
                    </tr>
                    {d.blocchi.map(function(bb, bi){
                      return (
                        <tr key={"bl" + bi} style={{ borderTop:"1px dotted #e2e8f0" }}>
                          <td style={{ padding:"1px 6px 1px 0" }}>{bb.da === bb.a ? bb.da : (bb.da + " → " + bb.a)}</td>
                          <td style={{ padding:"1px 6px" }}>{bb.liv}</td>
                          <td style={{ padding:"1px 6px" }}>{bb.tab}</td>
                          <td style={Object.assign({ padding:"1px 6px", textAlign:"right" }, cifre)}>{nTxt(bb.nSc) + " = " + fmt2(bb.scatti) + " €"}</td>
                          <td style={Object.assign({ padding:"1px 6px" }, cifre)}>{fmt2(bb.oreSett)}</td>
                          <td style={Object.assign({ padding:"1px 6px" }, cifre)}>{bb.indet ? "—" : (fmt2(bb.addiz) + "%")}</td>
                          {earCol ? <td style={Object.assign({ padding:"1px 6px", textAlign:"right" }, cifre)}>{(bb.ear||0) > 0 ? (fmt2(bb.ear) + " \u20ac") : "\u2014"}</td> : null}
                          <td style={Object.assign({ padding:"1px 6px", textAlign:"right" }, cifre)}>{fmt2(bb.agg)}</td>
                          <td style={Object.assign({ padding:"1px 6px", textAlign:"right" }, cifre)}>{fmt2(bb.ore)}</td>
                          <td style={Object.assign({ padding:"1px 0", textAlign:"right" }, cifre)}>{fmt2(bb.costo)} €</td>
                        </tr>
                      );
                    })}
                  </tbody></table>
                  </div>
                </div>
              ) : ((d.noTaglio && d.tagliPossibili > 1) ? (
                <div style={{ background:"#FFF8E1", border:"1px solid #EAC87A", borderRadius:"8px", padding:"7px 10px", marginBottom:"6px", fontSize:"13px", lineHeight:1.35 }}>⚠️ In questo periodo qualcosa cambia (si dividerebbe in <b>{d.tagliPossibili}</b> pezzi), ma il conto è su <b>un pezzo solo</b> perché ci sono <b>{d.noTaglio}</b>. Per il conto preciso svuota quelle caselle, oppure calcola i periodi separatamente.</div>
              ) : null)}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Anagrafica(props){
  const state = props.state;
  const dips = dipSorted(state);
  const [selId, setSelId] = useState((props.selInit && dips.some(function(x){ return x.id===props.selInit; })) ? props.selInit : (dips.length ? dips[0].id : null));
  const [msg, setMsg] = useState("");
  const [mtOpen, setMtOpen] = useState(false);                                   // pannello "Mensilizza tutti"
  const _mtdef = ymdIt(MENS_DAL_DEFAULT);
  const [mtMese, setMtMese] = useState(String(Math.floor((_mtdef%10000)/100)));
  const [mtAnno, setMtAnno] = useState(String(Math.floor(_mtdef/10000)));
  const [mtEsclusi, setMtEsclusi] = useState([]);
  const tplRef = React.useRef(null);
  const tplProRef = React.useRef(null);
  const tplTrasfRef = React.useRef(null);
  const dp = dips.find(function(x){ return x.id===selId; }) || dips[0];
  if (!dp) return <div style={{padding:"20px",color:"#64748b"}}>Nessun dipendente. Aggiungine uno dalla vista mensile o col pulsante qui sopra.</div>;
  const calcCF = function(){
    const a = dp.ana || {};
    let sesso = a.sesso || cfSexFrom(a.cf);
    if (!sesso){ setMsg("⚠️ Per calcolare il CF scegli prima il Sesso (M/F)."); return; }
    if (!a.dataNascita || !isRealDate(a.dataNascita)){ setMsg("⚠️ Inserisci una Data di nascita valida (gg/mm/aaaa) prima di calcolare il CF."); return; }
    if (!a.cognome || !a.nome){ setMsg("⚠️ Servono Cognome e Nome per calcolare il CF."); return; }
    let bel = belfioreOf(a.luogoNascita) || (a.belfiore || "");
    const patch = {};
    if (!bel || bel.length!==4){
      const inp = window.prompt("Codice catastale (Belfiore) del comune di nascita \"" + (a.luogoNascita||"") + "\" — 4 caratteri (es. F205):", a.belfiore||"");
      if (inp && String(inp).trim().length===4){ bel = String(inp).trim().toUpperCase(); patch.belfiore = bel; }
      else { setMsg("⚠️ CF non calcolato: manca il codice catastale del comune di nascita."); return; }
    }
    const cf = cfCompute(a.cognome, a.nome, a.dataNascita, sesso, bel);
    if (!cf){ setMsg("⚠️ CF non calcolato: controlla i dati inseriti."); return; }
    patch.cf = cf; if (!a.sesso) patch.sesso = sesso;
    props.onAnaSet(dp.id, patch);
    setMsg("🧮 Codice fiscale calcolato: " + cf + "  (candidato: verifica in caso di omocodia).");
  };
  const genera = function(){
    if (firstBadDate(dp)){ setMsg("⚠️ Correggi le date in formato gg/mm/aaaa (evidenziate in rosso) prima di generare il documento."); return; }
    generaContratto(dp, function(e){ setMsg("⚠️ Errore nella generazione del contratto: " + (e && e.message ? e.message : e)); });
    setMsg("📄 Contratto generato per " + dp.nome + " (scaricato).");
  };
  const generaPro = function(){
    if (firstBadDate(dp)){ setMsg("⚠️ Correggi le date in formato gg/mm/aaaa (evidenziate in rosso) prima di generare il documento."); return; }
    generaProroga(dp, function(e){ setMsg("⚠️ " + (e && e.message ? e.message : e)); });
    if (prorogheList(dp).length > 0) setMsg("📄 Proroga generata per " + dp.nome + " (scaricata).");
  };
  const onTplPro = function(ev){
    const f=ev.target.files && ev.target.files[0]; ev.target.value="";
    if (!f) return;
    aggiornaModelloProroga(f, function(err, n){ if (err) setMsg("⚠️ " + (err.message||err)); else { if(props.onTemplateChanged) props.onTemplateChanged(); setMsg("✅ Modello proroga aggiornato ("+n+" campi). Premi 💾 per salvarlo (cloud + backup) e averlo su tutti i dispositivi."); } });
  };
  const generaTrasf = function(){
    if (firstBadDate(dp)){ setMsg("⚠️ Correggi le date in formato gg/mm/aaaa (evidenziate in rosso) prima di generare il documento."); return; }
    generaTrasformazione(dp, function(e){ setMsg("⚠️ " + (e && e.message ? e.message : e)); });
    setMsg("📄 Trasformazione generata per " + dp.nome + " (scaricata).");
  };
  const onTplTrasf = function(ev){
    const f=ev.target.files && ev.target.files[0]; ev.target.value="";
    if (!f) return;
    aggiornaModelloTrasformazione(f, function(err, n){ if (err) setMsg("⚠️ " + (err.message||err)); else { if(props.onTemplateChanged) props.onTemplateChanged(); setMsg("✅ Modello trasformazione aggiornato ("+n+" campi). Premi 💾 per salvarlo (cloud + backup) e averlo su tutti i dispositivi."); } });
  };
  const onTpl = function(ev){
    const f=ev.target.files && ev.target.files[0]; ev.target.value="";
    if (!f) return;
    aggiornaModello(f, function(err, n){ if (err) setMsg("⚠️ " + (err.message||err)); else { if(props.onTemplateChanged) props.onTemplateChanged(); setMsg("✅ Modello contratto aggiornato ("+n+" campi, immagine alleggerita). Premi 💾 per salvarlo (cloud + backup) e averlo su tutti i dispositivi."); } });
  };
  return (
    <div>
      <div className="toolbar">
        <strong style={{ fontSize:"15px", color:"#1f4e82" }}>📇 Anagrafica dipendenti</strong>
        <button className={"btn btn-save" + (props.dirty ? " dirty" : "")} disabled={!props.dirty} onClick={props.onSave} style={{ marginLeft:"12px" }} title="Salva le modifiche (cloud + copia locale)">💾 Salva</button>
        <div className="spacer"></div>
        <button className="btn btn-blue" onClick={props.onAddDip} title="Crea un nuovo dipendente: comparirà anche nei mesi con il box ore">+ Aggiungi dipendente</button>
        <button className="btn btn-gray" onClick={props.onImportAna} title="Riempie i campi vuoti dei dipendenti presenti nell'elenco importato (non sovrascrive)">⤵ Importa anagrafiche</button>
        <button className="btn btn-blue" onClick={props.onExportAna}>📊 Esporta Excel</button>
      </div>
      <div style={{ display:"flex", gap:"8px", alignItems:"center", flexWrap:"wrap", marginBottom:"10px" }}>
        <span style={{ fontSize:"11px", fontWeight:800, color:"#64748b", textTransform:"uppercase", letterSpacing:".4px" }}>Gestione modelli (avanzato):</span>
        <button className="btn btn-gray" onClick={function(){ tplRef.current.click(); }} title="Carica un nuovo modello Word (.docx) del contratto quando cambiano le norme">🔄 Aggiorna modello contratto</button>
        {templatePersonalizzato() ? <button className="btn btn-gray" onClick={function(){ ripristinaModello(); if(props.onTemplateChanged) props.onTemplateChanged(); setMsg("↩️ Ripristinato il modello contratto originale. Premi 💾 per aggiornare cloud e backup."); }}>↩️ Ripristina contratto</button> : null}
        <button className="btn btn-gray" onClick={function(){ tplProRef.current.click(); }} title="Carica un nuovo modello Word (.docx) della proroga">🔄 Aggiorna modello proroga</button>
        {templateProPersonalizzato() ? <button className="btn btn-gray" onClick={function(){ ripristinaModelloProroga(); if(props.onTemplateChanged) props.onTemplateChanged(); setMsg("↩️ Ripristinato il modello proroga originale. Premi 💾 per aggiornare cloud e backup."); }}>↩️ Ripristina proroga</button> : null}
        <button className="btn btn-gray" onClick={function(){ tplTrasfRef.current.click(); }} title="Carica un nuovo modello Word (.docx) della trasformazione">🔄 Aggiorna modello trasformazione</button>
        {templateTrasfPersonalizzato() ? <button className="btn btn-gray" onClick={function(){ ripristinaModelloTrasformazione(); if(props.onTemplateChanged) props.onTemplateChanged(); setMsg("↩️ Ripristinato il modello trasformazione originale. Premi 💾 per aggiornare cloud e backup."); }}>↩️ Ripristina trasformazione</button> : null}
        <span style={{ fontSize:"11px", color:"#64748b" }}>Contratto: <b>{templatePersonalizzato() ? "personalizzato" : "originale"}</b> · Proroga: <b>{templateProPersonalizzato() ? "personalizzato" : "originale"}</b> · Trasformazione: <b>{templateTrasfPersonalizzato() ? "personalizzato" : "originale"}</b></span>
        <input ref={tplRef} type="file" accept=".docx" style={{ display:"none" }} onChange={onTpl} />
        <input ref={tplProRef} type="file" accept=".docx" style={{ display:"none" }} onChange={onTplPro} />
        <input ref={tplTrasfRef} type="file" accept=".docx" style={{ display:"none" }} onChange={onTplTrasf} />
      </div>
      <div style={{ display:"flex", gap:"8px", alignItems:"center", flexWrap:"wrap", marginBottom:"10px" }}>
        <span style={{ fontSize:"11px", fontWeight:800, color:"#64748b", textTransform:"uppercase", letterSpacing:".4px" }}>Azioni su tutti:</span>
        <button className="btn btn-gray" onClick={function(){ setMtOpen(!mtOpen); setMsg(""); }} title="Imposta la mensilizzazione su piu' persone in una sola volta">📅 Mensilizza tutti dal mese…</button>
      </div>
      {mtOpen ?
        <div style={{ background:"#ecfdf5", border:"2px solid #6ee7b7", borderRadius:"10px", padding:"12px 14px", marginBottom:"12px" }}>
          <div style={{ fontSize:"14px", fontWeight:800, color:"#065f46", marginBottom:"6px" }}>Mensilizza piu' persone in una volta</div>
          <div style={{ fontSize:"12.5px", color:"#065f46", lineHeight:1.5, marginBottom:"8px" }}>Mette la spunta <b>Mensilizzato</b> a tutte le persone selezionate, con decorrenza <b>dal 1° del mese</b> che scegli. Togli la spunta a chi <b>non</b> deve esserlo. Chi è già mensilizzato da quella stessa data non viene toccato. Prima di scrivere ti chiedo conferma; poi premi <b>💾 Salva</b>.</div>
          <div style={{ display:"flex", gap:"10px", alignItems:"flex-end", flexWrap:"wrap", marginBottom:"8px" }}>
            <div><div style={{ fontSize:"12px", fontWeight:700, color:"#374151", marginBottom:"2px" }}>Dal mese</div>
              <select value={mtMese} style={{ padding:"8px" }} onChange={function(e){ setMtMese(e.target.value); }}>{MONTH_LABEL.map(function(l,i){ return <option key={i} value={String(i+1)}>{l}</option>; })}</select></div>
            <div><div style={{ fontSize:"12px", fontWeight:700, color:"#374151", marginBottom:"2px" }}>Anno</div>
              <input value={mtAnno} inputMode="numeric" style={{ width:"100px", border:"2px solid #f59e0b", background:"#fffde7", borderRadius:"8px", padding:"8px 10px", fontFamily:"inherit", fontSize:"14px" }}
                onChange={function(e){ setMtAnno(e.target.value.replace(/[^0-9]/g,"").slice(0,4)); }} /></div>
            <div style={{ fontSize:"13px", color:"#065f46" }}>Decorrenza: <b>{(parseInt(mtMese,10)>=1 && parseInt(mtAnno,10)>=2000) ? ("01/"+(parseInt(mtMese,10)<10?"0":"")+parseInt(mtMese,10)+"/"+parseInt(mtAnno,10)) : "— (scegli mese e anno)"}</b></div>
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(230px, 1fr))", gap:"4px", marginBottom:"10px" }}>
            {dips.map(function(x){ const incluso = mtEsclusi.indexOf(x.id)<0; return (
              <label key={x.id} style={{ display:"flex", alignItems:"center", gap:"6px", fontSize:"13px", cursor:"pointer" }}>
                <input type="checkbox" checked={incluso} onChange={function(e){ setMtEsclusi(e.target.checked ? mtEsclusi.filter(function(i){ return i!==x.id; }) : mtEsclusi.concat([x.id])); }} />
                <span style={{ fontWeight:700 }}>{x.nome}</span>
                {x.mensilizzato && x.mensilizzatoDal ? <span style={{ fontSize:"12px", color:"#475569" }}>(già dal {x.mensilizzatoDal})</span> : null}
              </label>
            ); })}
          </div>
          <div style={{ display:"flex", gap:"8px", flexWrap:"wrap" }}>
            <button className="btn btn-blue" onClick={function(){

     servizio chiuso = non consuma il massimale. E' un dato del GIORNO: se quel giorno c'e'
     anche un'assenza, il barrato cambia anche a lei. */
  const [chiuso, setChiuso] = useState(props.ero === false);

            }}>

              {PERM_TIPI.map(function(x){ return <option key={x.c} value={x.c}>{x.c} — {x.l}</option>; })}
              <option value="__ALTRO__">Altro…</option>

        <div style={{ marginTop:"8px", padding:"7px 9px", background:"#f8fafc", border:"1px solid #cbd5e1", borderRadius:"8px" }}>

/* ===================== RIEPILOGHI ===================== */
function Riepiloghi(props){
  const state = props.state;
  const anniDisp = (function(){ const o={}; (state.anni||[]).forEach(function(y){ o[y]=true; }); o[props.anno]=true; o[props.anno+1]=true; return Object.keys(o).map(function(y){ return parseInt(y,10); }).sort(function(a,b){ return a-b; }); })();
  const [faY, setFaY] = useState(props.anno); const [faM, setFaM] = useState(1);
  const [taY, setTaY] = useState(props.anno); const [taM, setTaM] = useState(12);
  const dips = dipSorted(state);
  const scopePairs = monthsBetween(parseInt(faY,10), parseInt(faM,10), parseInt(taY,10), parseInt(taM,10));
  const periodoLabel = scopePairs.length ? (mLabelY(scopePairs[0].y, scopePairs[0].m) + " → " + mLabelY(scopePairs[scopePairs.length-1].y, scopePairs[scopePairs.length-1].m)) : "";

  const tabPeriodo = dips.map(function(dp){
    const perMese = scopePairs.map(function(pr){ return totOfRec(getRecFrom(state, pr.y, pr.m, dp.id), pr.y, pr.m); });
    const tot = perMese.reduce(function(a,b){ return a+b; }, 0);
    return { dp:dp, perMese:perMese, tot:R2(tot) };
  });
  const tabTeor = dips.map(function(dp){
    let lav=0, teor=0;
    scopePairs.forEach(function(pr){ lav += totOfRec(getRecFrom(state, pr.y, pr.m, dp.id), pr.y, pr.m); teor += oreSettAt(dp, pr.y, pr.m) * daysInMonth(pr.y, pr.m) / 7; });
    lav=R2(lav); teor=R2(teor);
    return { dp:dp, lav:lav, teor:teor, scost:R2((lav-teor)) };
  });
  const codiciUsati = {};
  dips.forEach(function(dp){ scopePairs.forEach(function(pr){ const rec=getRecFrom(state,pr.y,pr.m,dp.id);
    Object.keys(rec.giorni).forEach(function(d){ const v=String(rec.giorni[d]).trim(); if (CODE_SET[v] && v!=="--" && v!=="AN") codiciUsati[v]=true; }); }); });
  const codeCols = CODICI.filter(function(c){ return codiciUsati[c.c]; }).map(function(c){ return c.c; });
  const tabAssenze = dips.map(function(dp){
    const counts = {}; codeCols.forEach(function(c){ counts[c]=0; });
    scopePairs.forEach(function(pr){ const rec=getRecFrom(state,pr.y,pr.m,dp.id);
      Object.keys(rec.giorni).forEach(function(d){ const v=String(rec.giorni[d]).trim(); if (counts[v]!==undefined) counts[v]+=1; }); });
    return { dp:dp, counts:counts };
  });
  const tabPay = dips.map(function(dp){
    let ret=0, non=0;
    scopePairs.forEach(function(pr){ const rec=getRecFrom(state,pr.y,pr.m,dp.id);
      Object.keys(rec.giorni).forEach(function(d){ const v=String(rec.giorni[d]).trim(); if (CODE_SET[v] && v!=="--" && v!=="AN"){ if (CODE_SET[v].pay) ret+=1; else non+=1; } }); });
    return { dp:dp, ret:ret, non:non };
  });
  const oggi = new Date(); const tabScad = [];
  dips.forEach(function(dp){
    if (dp.tipoContratto !== "determinato") return;
    const eff = scadEff(dp);
    const dt = parseDMY(eff); if (!dt) return;
    const gg = Math.round((dt - oggi)/86400000);
    const pl = prorogheList(dp);
    tabScad.push({ dp:dp, orig:dp.scadenza || "", prorog: pl.length ? pl[pl.length-1] : "", eff:eff, gg:gg });
  });
  tabScad.sort(function(a,b){ return a.gg-b.gg; });
  const tabNote = [];
  dips.forEach(function(dp){ scopePairs.forEach(function(pr){ const rec=getRecFrom(state,pr.y,pr.m,dp.id);
    vociLines(rec).forEach(function(line){ tabNote.push({ mese:mLabelY(pr.y,pr.m), dp:dp.nome, nota:line }); }); }); });
  const tabPerm = [];
  dips.forEach(function(dp){ scopePairs.forEach(function(pr){ const rec=getRecFrom(state,pr.y,pr.m,dp.id);
    if (rec.permessi){ Object.keys(rec.permessi).forEach(function(d){ const prm=rec.permessi[d];
      tabPerm.push({ dp:dp.nome, mese:mLabelY(pr.y,pr.m), giorno:parseInt(d,10), ore:prm.ore, tipo:prm.tipo }); }); } }); });
  tabPerm.sort(function(a,b){ if (a.dp!==b.dp) return a.dp.localeCompare(b.dp); return a.giorno-b.giorno; });

  // statistiche voci-categoria per ogni dipendente per ogni mese

/* ===================== LOGIN ===================== */
function Login(props){
  const [pinSet] = useState(localStorage.getItem(LS_PIN) !== null);
  const [pin, setPin] = useState(""); const [pin2, setPin2] = useState("");
  const [email, setEmail] = useState(""); const [pwd, setPwd] = useState("");
  const [err, setErr] = useState("");
  const doFb = function(){ setErr(""); firebase.auth().signInWithEmailAndPassword(email, pwd).catch(function(e){ setErr("Accesso non riuscito. Verifica le credenziali."); console.error(e); }); };
  const doPin = function(){
    setErr("");
    if (!pinSet){
      if (pin.length < 4){ setErr("Il PIN deve avere almeno 4 cifre."); return; }
      if (pin !== pin2){ setErr("I due PIN non coincidono."); return; }
      localStorage.setItem(LS_PIN, hashPin(pin)); props.onPinOk();
    } else { if (hashPin(pin) === localStorage.getItem(LS_PIN)) props.onPinOk(); else setErr("PIN errato."); }
  };
  return (
    <div className="login-box">
      <div className="logo">Spazio Ireos</div>
      <div className="tag">Report Ore mensile — accesso riservato</div>
      {FB_READY ?
        <div>
          <div className="field"><label style={{textAlign:"left"}}>Email</label>
            <input value={email} onChange={function(e){ setEmail(e.target.value); }} /></div>
          <div className="field"><label style={{textAlign:"left"}}>Password</label>
            <input type="password" value={pwd} onChange={function(e){ setPwd(e.target.value); }} onKeyDown={function(e){ if (e.key==="Enter") doFb(); }} /></div>
          {err ? <div style={{ color:"#dc2626", fontSize:"12px", marginBottom:"10px" }}>{err}</div> : null}
          <button className="btn btn-blue" style={{ width:"100%", justifyContent:"center" }} onClick={doFb}>Entra</button>
        </div>
        :
        <div>
          {!pinSet ? <div style={{ fontSize:"12px", color:"#64748b", marginBottom:"10px" }}>Primo accesso: crea un PIN (min 4 cifre).</div> : null}
          <div className="field"><label style={{textAlign:"left"}}>{pinSet ? "PIN" : "Nuovo PIN"}</label>
            <input type="password" inputMode="numeric" value={pin} onChange={function(e){ setPin(e.target.value.replace(/\D/g,"")); }} onKeyDown={function(e){ if (e.key==="Enter" && pinSet) doPin(); }} /></div>
          {!pinSet ? <div className="field"><label style={{textAlign:"left"}}>Conferma PIN</label>
            <input type="password" inputMode="numeric" value={pin2} onChange={function(e){ setPin2(e.target.value.replace(/\D/g,"")); }} /></div> : null}
          {err ? <div style={{ color:"#dc2626", fontSize:"12px", marginBottom:"10px" }}>{err}</div> : null}
          <button className="btn btn-blue" style={{ width:"100%", justifyContent:"center" }} onClick={doPin}>{pinSet ? "Entra" : "Crea PIN ed entra"}</button>
        </div>}
    </div>
  );
}

/* ===================== CONFRONTO CON L'APP "FOGLI ORE" (SOLA LETTURA) =====================
   Questa app usa GIA' il progetto Firebase "spazio-ireos-foglio-ore", lo stesso dell'app
   "Fogli ore": si riusa la connessione Firestore già aperta (dbRef) e si leggono SOLTANTO
   le collection "users" e "timesheets". Non si scrive MAI nulla lì.
   Il risultato è un AVVISO NON VINCOLANTE: l'inserimento manuale resta primario. */
const FO_RUOLI = ["worker", "editor"];
/* fasce orarie di Fogli ore: 4 dirette + 2 indirette */
const FO_FASCE = [["t1f","t1t"], ["t2f","t2t"], ["t3f","t3t"], ["t4f","t4t"], ["iF","iT"], ["iF2","iT2"]];
/* assenze di Fogli ore -> codici equivalenti di QUESTA app (null = qualunque assenza va bene) */
const FO_ASSENZE = {
  "FERIE":            ["FERIE"],
  "MALATTIA":         ["MAL", "MAL 0H"],
  "MALATTIA FIGLIO":  ["MALFG"],
  "PERM. ELETTORALE": ["ELEZ"],
  "PERM. LUTTO":      ["LUTTO"],
  "ALTRO AUTORIZ.":   null
};
function foNorm(s){ return String(s === null || s === undefined ? "" : s).replace(/\s+/g, " ").trim().toUpperCase(); }
/* ver149 (10/11/2026, punto 8 dell'elenco, risposta di Christian: «Ignorali e attenzione a
   accenti e apostrofi in fine di parola, perche' si equivalgono»).
   IL DIFETTO, misurato dal collaudo delle interconnessioni: l'UNICO identificativo che
   attraversa il confine fra le app e' il NOME scritto a mano in due anagrafiche diverse, e
   `foNorm` confrontava lettera per lettera: «NICOLO'» e «NICOLÒ» erano due persone diverse, e
   le ore non si abbinavano piu'.
   ⚠️ `foNorm` NON e' stata toccata: serve a come il nome si VEDE. `foChiave` serve solo a
   CONFRONTARE: toglie i segni (accenti, dieresi) con NFD e l'apostrofo in fine di parola. */
function foChiave(s){
  let t = foNorm(s);
  try { t = t.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); } catch (e){}
  t = t.replace(/['\u2019\u00b4`\u02bc]+(?=\s|$)/g, "");
  return t.replace(/\s+/g, " ").trim();
}
/* "COGNOME NOME" dell'utente di Fogli ore: se cognome/nome mancano si ricava da name
   (PRIMA parola = cognome, resto = nome) */
function foNomeUtente(u){
  const cog = foNorm(u.cognome), nom = foNorm(u.nome);
  if (cog && nom) return cog + " " + nom;
  const nm = foNorm(u.name);
  if (nm){ const p = nm.split(" "); return p.length > 1 ? (p[0] + " " + p.slice(1).join(" ")) : nm; }
  return cog || nom || "";
}
/* parser orario TOLLERANTE (equivalente a quello di Fogli ore) -> minuti dalla mezzanotte, null se non valido.
   Accetta "9:00", "09:00", "14.30", "14h30", "900" (=09:00), "130" (=01:30), "9" (=09:00). */
function foParseMin(v){
  if (v === null || v === undefined) return null;
  const s = String(v).trim().toLowerCase().replace(/\s+/g, "");
  if (s === "") return null;
  let h = null, mi = null, mm = null;
  if ((mm = s.match(/^(\d{1,2})[:.,h;'](\d{1,2})$/))){ h = parseInt(mm[1], 10); mi = parseInt(mm[2], 10); }
  else if ((mm = s.match(/^(\d{3,4})$/))){ h = parseInt(mm[1].slice(0, mm[1].length - 2), 10); mi = parseInt(mm[1].slice(-2), 10); }
  else if ((mm = s.match(/^(\d{1,2})[:.,h;']?$/))){ h = parseInt(mm[1], 10); mi = 0; }
  else return null;
  if (isNaN(h) || isNaN(mi) || h < 0 || h > 24 || mi < 0 || mi > 59) return null;
  const t = h * 60 + mi;
  return (t < 0 || t > 1440) ? null : t;
}
/* ore lavorate in un giorno = somma, su tutte le fasce dirette e indirette, di (fine - inizio) */
function foOreEntry(e){
  if (!e || typeof e !== "object") return 0;
  let tot = 0;
  for (let i = 0; i < FO_FASCE.length; i++){
    const a = foParseMin(e[FO_FASCE[i][0]]), b = foParseMin(e[FO_FASCE[i][1]]);
    if (a === null || b === null) continue;
    if (b > a) tot += (b - a) / 60;
  }
  return tot;   /* perm / spole / pausa / nonImp NON sono ore lavorate: ignorati */
}
/* aggrega i documenti timesheets di UNA persona per UN mese (uno per servizio: vanno sommati).
   L'assenza è scritta su TUTTI i servizi del giorno: va contata UNA SOLA VOLTA e vale 0 ore. */
function foAggregaMese(daysList){
  const ore = {}, ass = {};
  (daysList || []).forEach(function(days){
    if (!days || typeof days !== "object") return;
    Object.keys(days).forEach(function(k){
      const d = parseInt(k, 10);
      if (isNaN(d) || d < 1 || d > 31) return;
      const e = days[k];
      if (!e || typeof e !== "object") return;
      const ab = foNorm(e.absence);
      if (ab !== ""){ if (!ass[d]) ass[d] = ab; return; }
      ore[d] = (ore[d] || 0) + foOreEntry(e);
    });
  });
  let tot = 0;
  Object.keys(ore).forEach(function(d){ if (!ass[d]) tot += ore[d]; });
  /* ver86: quante giornate di ogni tipo di assenza ha segnato l'operatore in Fogli ore.
     L'assenza e' scritta su TUTTI i servizi del giorno: "ass" la tiene gia' una volta sola. */
  const assConta = {};
  Object.keys(ass).forEach(function(d){ const a = ass[d]; if (!a) return; assConta[a] = (assConta[a] || 0) + 1; });
  return { tot: Math.round(tot * 100) / 100, ore: ore, ass: ass, assConta: assConta };
}
/* codice-assenza di QUESTA app per una cella: null se vuota, numerica, "--" o "AN" */
function foCodiceMio(v){
  const s = String(v === null || v === undefined ? "" : v).trim();
  if (s === "" || s === "--" || s === "AN" || !CODE_SET[s]) return null;
  return s;
}
function foAssenzeCompatibili(absFogliOre, codiceMio){
  const a = foNorm(absFogliOre);
  if (!Object.prototype.hasOwnProperty.call(FO_ASSENZE, a)) return true;   /* codice non previsto: non facciamo le pulci */
  const lista = FO_ASSENZE[a];
  if (lista === null) return true;                                          /* "ALTRO AUTORIZ.": basta che ci sia un'assenza */
  return lista.indexOf(foNorm(codiceMio)) !== -1;
}
/* confronto di un dipendente per il mese: null se tutto combacia (nessun avviso da mostrare) */
function foConfronta(rec, y, m, agg){
  const totMio = totOfRec(rec, y, m);
  const totFo = agg.tot;
  const diffTot = Math.abs(totMio - totFo) > 0.01;
  const giorni = [];
  const nd = daysInMonth(y, m);
  const gg = (rec && rec.giorni) ? rec.giorni : {};
  for (let d = 1; d <= nd; d++){
    const val = gg[d];
    const mioCod = foCodiceMio(val);
    const foAbs = agg.ass[d] ? agg.ass[d] : null;
    if (!mioCod && !foAbs) continue;                 /* solo i giorni con assenza in almeno una delle due app */
    const mieOre = parseHour(val);
    const foOre = foAbs ? 0 : (agg.ore[d] || 0);
    if (mioCod && foAbs){
      if (!foAssenzeCompatibili(foAbs, mioCod)) giorni.push({ g:d, mio:mioCod, fo:foAbs });
    } else if (mioCod){
      if (foOre > 0.005) giorni.push({ g:d, mio:mioCod, fo:fmt2(foOre) + " h" });
    } else {
      if (mieOre > 0.005) giorni.push({ g:d, mio:fmt2(mieOre) + " h", fo:foAbs });
    }
  }
  /* ver86: la riga esce SEMPRE (scelta di Christian del 04/11/2026), perche' serve anche

/* ver150 (10/11/2026, punto 1 dell'elenco, risposta di Christian: «avvisa»).
   L'unico identificativo che attraversa il confine fra le app e' il NOME, scritto a mano in
   due anagrafiche diverse. Se due persone hanno lo stesso nome, l'app non puo' sapere quali
   ore sono di chi: prima vinceva l'ultima IN SILENZIO (il confronto mostrava le ore di una
   sola, e la pubblicazione scriveva due volte sullo stesso documento `residui`).
   ⚠ Christian ha scelto «avvisa», NON «somma»: quindi si salta e si dice.
   ⚠ Il confronto usa `foChiave` (ver149), quindi «NICOLO'» e «NICOLÒ» contano come lo
   stesso nome: e' proprio per questo che possono diventare omonimi senza che si veda. */
function foRaggruppaPerChiave(valori, nomeDi){
  const perK = {};
  (valori || []).forEach(function(v){
    const nm = nomeDi(v); const k = foChiave(nm);
    if (!k) return; if (!perK[k]) perK[k] = []; perK[k].push(nm);
  });
  const out = {};
  Object.keys(perK).forEach(function(k){ if (perK[k].length > 1) out[k] = perK[k]; });
  return out;
}
/* gli account di Fogli ore che condividono lo stesso nome */
function foOmonimiUtenti(utenti){
  return foRaggruppaPerChiave(Object.keys(utenti || {}), function(uid){ return utenti[uid]; });
}
/* i dipendenti di QUESTA app che condividono lo stesso nome */
function dipOmonimi(st){
  try { return foRaggruppaPerChiave(dipSorted(st), function(dp){ return dp.nome; }); }
  catch (e){ return {}; }
}
/* lettura utenti di Fogli ore (uid -> "COGNOME NOME"), solo ruoli che compilano i fogli ore */
function foLeggiUtenti(db, cache){
  if (cache.__users) return Promise.resolve(cache.__users);
  return db.collection("users").get().then(function(us){
    const map = {};
    us.forEach(function(doc){
      try {
        const u = doc.data() || {};
        if (FO_RUOLI.indexOf(String(u.role === null || u.role === undefined ? "" : u.role).trim().toLowerCase()) === -1) return;
        const nome = foNomeUtente(u);
        if (nome) map[doc.id] = nome;
      } catch (e){ console.error("foLeggiUtenti", e); }
    });
    cache.__users = map;
    return map;
  });
}
/* lettura timesheets del mese: una query per anno (nessun indice composito) + filtro client su mese.
   Ritorna { "COGNOME NOME": aggregato }. */
function foLeggiMese(db, cache, y, m){
  const key = "m" + y + "-" + m;
  if (cache[key]) return Promise.resolve(cache[key]);
  return foLeggiUtenti(db, cache).then(function(utenti){
    return db.collection("timesheets").where("year", "==", y).get().then(function(ts){
      if (ts.empty) return db.collection("timesheets").where("month", "==", m).get();   /* dati storici con "year" non numerico */
      return ts;
    }).then(function(ts){
      const perUid = {};
      ts.forEach(function(doc){
        try {
          const t = doc.data() || {};
          if (String(t.year) !== String(y)) return;
          if (parseInt(t.month, 10) !== m) return;
          const u = String(t.workerUid === null || t.workerUid === undefined ? "" : t.workerUid).trim();
          if (!u || !utenti[u]) return;
          if (!perUid[u]) perUid[u] = [];
          perUid[u].push(t.days);
        } catch (e){ console.error("foLeggiMese", e); }
      });
      const perNome = {};
      Object.keys(perUid).forEach(function(u){ perNome[foChiave(utenti[u])] = foAggregaMese(perUid[u]); });   /* ver149 (punto 8): la chiave ignora accenti e apostrofo finale */
      /* ver150 (punto 1): se due account di Fogli ore hanno lo stesso nome, l'aggregato di
         uno ha appena sovrascritto quello dell'altro. Quel numero sarebbe una bugia: si
         TOGLIE, e la chiave finisce in `__ambigue` perche' la scheda lo possa dire. */
      const ambigue = foOmonimiUtenti(utenti);
      Object.keys(ambigue).forEach(function(k){ delete perNome[k]; });
      perNome.__ambigue = ambigue;
      cache[key] = perNome;
      return perNome;
    });
  });
}

  /* ---- ver78: PUBBLICA AI DIPENDENTI il residuo del tetto annuo ----------------
     Scrive nella collection "residui" del progetto condiviso: UN documento per
     operatore, doc-id = suo uid in Fogli ore, contenuto SOLO numeri (nessun nome,
     nessun dato personale). Lo legge soltanto il diretto interessato.
     ⚠️ E' l'unica scrittura che questa app fa fuori dal proprio documento, ed e'
     SEMPRE manuale: nessun salvataggio automatico. Le collection "users" e
     "timesheets" restano in sola lettura, come sempre. */
  const [pubEsito, setPubEsito] = useState("");
  /* ver149 (10/11/2026, due risposte di Christian all'elenco delle interconnessioni:
     punto 6 «Se tolgo il tetto, non deve vedere più niente» e punto 5 «Ricorda»).
     PUNTO 6: togliendo il massimale a una persona, il suo documento `residui` restava dov'era e
     l'operatore continuava a leggere «Ti restano 649,00 h» per sempre. Ora la pubblicazione
     CANCELLA il residuo di chi non ha PIÙ NESSUN massimale.
     ⚠️ Si guarda `tettiList(dp).length === 0`, cioe' «nessun massimale scritto in scheda», NON
     «nessun massimale per il mese che sto guardando»: altrimenti, aprendo un mese fuori dal
     periodo del tetto, si cancellerebbe il residuo di chi ce l'ha ancora.
     ⚠️ I documenti `residui` che non corrispondono a nessun dipendente di oggi NON si toccano:
     vengono solo elencati nella conferma, perché possono essere di qualcuno che non è più
     nell'elenco e cancellarli in silenzio sarebbe una sorpresa.
     PUNTO 5: dopo una pubblicazione riuscita si tiene da parte, in `localStorage` (chiave
     `LS_RESPUB`, FUORI dai dati: il formato del documento e del backup non cambia), quanto è
     stato pubblicato a ciascuno. Se i numeri di oggi sono diversi, la barra lo RICORDA. */
  const [pubTimbro, setPubTimbro] = useState(function(){ return respubLeggi(); });
  /* ver149 (punto 5): che cosa e' cambiato dall'ultima pubblicazione. Si confronta solo il
     numero che l'operatore VEDE (le ore che gli restano), non le ore usate: e' quello il dato
     pubblicato. Se non si e' mai pubblicato niente, non si ricorda niente. */
  const residuiDaRifare = useMemo(function(){
    try {
      const pub = (pubTimbro && pubTimbro.valori) || null;
      if (!pub) return null;
      const diversi = [];
      const ambD = dipOmonimi(state);   /* ver150 (punto 1): gli omonimi non si pubblicano, quindi non si ricordano */
      dipSorted(state).forEach(function(dp){
        const k = foChiave(dp.nome);
        if (ambD[k]) return;
        const prima = Object.prototype.hasOwnProperty.call(pub, k) ? Number(pub[k]) : null;
        const tetto = tettoForPeriod(dp, anno, mese);
        const haTetto = !isNaN(tetto) && tetto > 0;
        if (!haTetto){ if (prima !== null && !tettiList(dp).length) diversi.push(dp.nome + " (massimale tolto)"); return; }
        const ora = R2(tetto - consumoTetto(state, dp, anno, mese), 3);
        if (prima === null) diversi.push(dp.nome + " (nuovo)");
        else if (Math.abs(prima - ora) > 0.0005) diversi.push(dp.nome);
      });
      return diversi.length ? diversi : null;
    } catch (e){ return null; }
  }, [state, anno, mese, pubTimbro]);
  /* ver150 (punto 1): i nomi che qui dentro appartengono a due schede. Serve alla scheda
     del mese (per sospendere il confronto e dirlo) e alla pubblicazione dei residui. */
  const dipAmb = useMemo(function(){ return dipOmonimi(state); }, [state]);
  const pubblicaResidui = function(){
    if (!FB_READY || !dbRef.current){ window.alert("Serve il collegamento al database: questa funzione non lavora in modalità locale."); return; }
    const righe = [];
    const senzaTetto = [];                                  /* ver149 (punto 6) */
    dipSorted(state).forEach(function(dp){
      const tetto = tettoForPeriod(dp, anno, mese);
      if (isNaN(tetto) || tetto <= 0){
        if (!tettiList(dp).length) senzaTetto.push(dp.nome);   /* nessun massimale in scheda */
        return;
      }
      const usate = consumoTetto(state, dp, anno, mese);
      righe.push({ nome:dp.nome, periodo:(dp.tettoPeriodo==="civile"?"civile":"scolastico"),
                   annoRif: tettoStartYear(dp, anno, mese),
                   tetto:R2(tetto,3), usate:R2(usate,3), restano:R2(tetto-usate,3) });
    });
    if (!righe.length && !senzaTetto.length){ window.alert("Nessun dipendente ha un massimale annuo impostato per questo periodo: non c'è niente da pubblicare."); return; }
    setPubEsito("lettura degli operatori di Fogli ore in corso…");
    const db = dbRef.current;
    foLeggiUtenti(db, foCacheRef.current).then(function(utenti){
      const perNome = {}; Object.keys(utenti).forEach(function(uid){ perNome[foChiave(utenti[uid])] = uid; });   /* ver149 (punto 8) */
      /* ver150 (punto 1): un nome che in Fogli ore o qui dentro appartiene a due persone non
         si pubblica e non si cancella: scriveremmo due volte sullo stesso documento e il
         residuo di uno finirebbe addosso all'altro, in silenzio. */
      const ambFo = foOmonimiUtenti(utenti), ambDip = dipOmonimi(state);
      const ambiguo = function(nm){ const k = foChiave(nm); return !!(ambFo[k] || ambDip[k]); };
      const daScrivere = [], senzaAccount = [], omonimi = [];
      righe.forEach(function(r){
        if (ambiguo(r.nome)){
          const k = foChiave(r.nome);
          omonimi.push(r.nome + (ambFo[k] ? (" \u2014 " + ambFo[k].length + " account in Fogli ore") : "") +
                                (ambDip[k] ? (" \u2014 " + ambDip[k].length + " schede qui") : ""));
          return;
        }
        const uid = perNome[foChiave(r.nome)];   /* ver149 (punto 8) */
        if (uid) daScrivere.push(Object.assign({ uid:uid }, r)); else senzaAccount.push(r.nome);
      });
      /* ver149 (punto 6): chi non ha più nessun massimale, e ha un account, va ripulito */
      const uidSenzaTetto = {};
      senzaTetto.forEach(function(nm){ if (ambiguo(nm)) return; const u = perNome[foChiave(nm)]; if (u) uidSenzaTetto[u] = nm; });
      const uidConTetto = {};
      daScrivere.forEach(function(r){ uidConTetto[r.uid] = true; });
      /* leggo la collection `residui` per cancellare SOLO quello che c'e' davvero */
      return db.collection("residui").get().then(function(snap){
        const daTogliere = [], altri = [];
        snap.forEach(function(d){
          if (uidSenzaTetto[d.id]) daTogliere.push({ uid:d.id, nome:uidSenzaTetto[d.id] });
          else if (!uidConTetto[d.id]) altri.push(d.id);
        });
        return { daScrivere:daScrivere, senzaAccount:senzaAccount, omonimi:omonimi, daTogliere:daTogliere, altri:altri, lettoElenco:true };
      }).catch(function(e){
        console.error("residui (elenco)", e);
        return { daScrivere:daScrivere, senzaAccount:senzaAccount, omonimi:omonimi, daTogliere:[], altri:[], lettoElenco:false };
      });
    }).then(function(pl){
      const daScrivere = pl.daScrivere, senzaAccount = pl.senzaAccount, daTogliere = pl.daTogliere;
      const omonimi = pl.omonimi || [];
      /* ver150 (punto 1): l'avviso sugli omonimi compare sia nella conferma sia qui, perche'
         se sono l'UNICA cosa rimasta non ci sarebbe nessuna conferma in cui dirlo.
         ⚠ Dicitura nuova, scritta da Claude. */
      const avvOmon = omonimi.length ? ("\n\nOMONIMI (saltati: né pubblicati né tolti, perché l'app non può sapere quali ore sono di chi):\n" + omonimi.map(function(x){ return "• " + x; }).join("\n") + "\nPer pubblicarli distingui i nomi nelle due anagrafiche.") : "";
      if (!daScrivere.length && !daTogliere.length){
        setPubEsito("");
        window.alert((senzaAccount.length
          ? ("Nessuno dei dipendenti con un massimale ha un account in Fogli ore con lo stesso COGNOME NOME:\n\n" + senzaAccount.join("\n"))
          : "Non c'è niente da pubblicare e niente da togliere.") + avvOmon);
        return;
      }
      const elenco = daScrivere.map(function(r){ return "• " + r.nome + ": restano " + fmt3(r.restano) + " h su " + fmt3(r.tetto); }).join("\n");
      const avviso = senzaAccount.length ? ("\n\nSENZA ACCOUNT in Fogli ore (saltati):\n" + senzaAccount.join("\n")) : "";
      const avvTog = daTogliere.length ? ("\n\nA QUESTI VIENE TOLTO il residuo, perché non hanno più nessun massimale in scheda (dentro Fogli ore non vedranno più niente):\n" + daTogliere.map(function(x){ return "• " + x.nome; }).join("\n")) : "";
      const avvAltri = pl.altri.length ? ("\n\nCi sono anche " + pl.altri.length + " residui pubblicati che non corrispondono a nessun dipendente di oggi: NON vengono toccati.") : "";
      const avvElenco = pl.lettoElenco ? "" : "\n\n⚠️ Non sono riuscito a leggere l'elenco dei residui già pubblicati: questa volta non ne viene tolto nessuno.";
      if (!window.confirm("Vuoi pubblicare il residuo a questi " + daScrivere.length + " dipendenti?\nLo vedranno dentro Fogli ore, ciascuno solo il proprio.\n\n" + elenco + avviso + avvOmon + avvTog + avvAltri + avvElenco)){ setPubEsito(""); return; }
      setPubEsito("pubblicazione in corso…");
      const db = dbRef.current;
      const scritture = daScrivere.map(function(r){
        return db.collection("residui").doc(r.uid).set({
          tetto:r.tetto, usate:r.usate, restano:r.restano, periodo:r.periodo, anno:r.annoRif,
          aggiornato: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge:true }).then(function(){ return { ok:true, nome:r.nome }; })
          .catch(function(e){ console.error("residui", r.nome, e); return { ok:false, nome:r.nome, err:(e && e.message) || "errore" }; });
      });
      const cancellazioni = daTogliere.map(function(x){
        return db.collection("residui").doc(x.uid).delete().then(function(){ return { ok:true, nome:x.nome, tolto:true }; })
          .catch(function(e){ console.error("residui (togli)", x.nome, e); return { ok:false, nome:x.nome, tolto:true, err:(e && e.message) || "errore" }; });
      });
      Promise.all(scritture.concat(cancellazioni)).then(function(esiti){
        const ko = esiti.filter(function(x){ return !x.ok; });
        const nTog = esiti.filter(function(x){ return x.tolto && x.ok; }).length;
        setPubEsito("");
        /* ver149 (punto 5): si tiene da parte quanto e' stato pubblicato, per poterlo ricordare */
        if (!ko.length){
          const val = {};
          daScrivere.forEach(function(r){ val[foChiave(r.nome)] = r.restano; });
          setPubTimbro(respubScrivi(val));
        }
        const codaTog = nTog ? ("\nTolto il residuo a " + nTog + (nTog===1?" persona":" persone") + " senza massimale.") : "";
        if (!ko.length){ window.alert("Pubblicati " + (esiti.length - nTog) + " residui. Ogni dipendente vede il proprio dentro Fogli ore." + codaTog); return; }
        window.alert("Riusciti " + (esiti.length - ko.length) + " su " + esiti.length + "." + codaTog + "\n\nNON riusciti:\n" +
          ko.map(function(x){ return "• " + x.nome + " — " + x.err; }).join("\n") +
          "\n\nSe l'errore parla di permessi, le regole di sicurezza nuove non sono ancora pubblicate in console Firebase.");
      });
    }).catch(function(e){
      console.error("residui", e); setPubEsito("");
      window.alert("Non sono riuscito a leggere gli operatori di Fogli ore: " + ((e && e.message) || "errore"));
    });
  };

  /* ---- confronto NON VINCOLANTE con l'app "Fogli ore" (sola lettura, una lettura per mese/anno) ---- */
  const [foData, setFoData] = useState(null);
  const [foErr, setFoErr] = useState(false);
  const foCacheRef = useRef({});
  useEffect(function(){
    let vivo = true;
    setFoData(null);
    if (!FB_READY || authState !== "in" || !dbRef.current || !mese) return function(){ vivo = false; };
    try {
      foLeggiMese(dbRef.current, foCacheRef.current, anno, mese).then(function(res){
        if (!vivo) return;
        setFoData(res); setFoErr(false);
      }).catch(function(e){
        console.error("confronto Fogli ore non disponibile", e);
        if (vivo) setFoErr(true);
      });
    } catch (e){ console.error("confronto Fogli ore non disponibile", e); setFoErr(true); }
    return function(){ vivo = false; };
  }, [authState, anno, mese]);
  const foPerNome = foData || null;

  if (FB_READY && authState === "checking") return <div style={{ padding:"40px", textAlign:"center" }}>Caricamento…</div>;
  if (FB_READY && denied) return (
    <div className="login-box">
      <div className="logo">Spazio Ireos</div><div className="tag">Report Ore mensile</div>
      <div style={{ background:"#fee2e2", color:"#991b1b", borderRadius:"10px", padding:"14px", fontSize:"13px", fontWeight:"700", marginBottom:"16px" }}>
        Accesso non consentito per <b>{denied}</b>.<br/>Questa area è riservata all'amministrazione.
      </div>
      <button className="btn btn-blue" style={{ width:"100%", justifyContent:"center" }} onClick={function(){ setDenied(""); }}>Accedi con un altro account</button>
    </div>
  );
  if (FB_READY && authState === "out") return <Login />;
  if (!FB_READY && authState === "gate") return <Login onPinOk={function(){ setAuthState("in"); }} />;
  if (!state) return <div style={{ padding:"40px", textAlign:"center" }}>Caricamento dati…</div>;

  return (
    <div>
      <datalist id="codici-list">{CODICI.map(function(x){ return <option key={x.c} value={x.c}>{x.l}</option>; })}</datalist>

      <div className="app-header">
        <div><h1>Spazio Ireos — Report Ore mensile</h1><div className="sub">{FB_READY ? "cloud" : "locale"}</div></div>
        <div className="app-rev" title="Revisione dell'app">{APP_VER} · {APP_DATA}</div>
        <div className="yearbar">
          <button title="Anno precedente" onClick={function(){ if (state.anni.indexOf(anno-1)===-1) addAnno(-1); else setAnno(anno-1); }}>◀</button>
          <span className="yr">{anno}</span>
          <button title="Anno successivo" onClick={function(){ if (state.anni.indexOf(anno+1)===-1) addAnno(1); else setAnno(anno+1); }}>▶</button>
        </div>
        <div className="spacer"></div>
        <button className={"btn btn-save" + (dirty ? " dirty" : "")} onClick={doSave} disabled={!dirty}>💾 Salva</button>
        <button className="btn btn-ghost" onClick={doBackup}>⬇ Backup</button>
        <button className="btn btn-ghost" onClick={function(){ fileRef.current.click(); }}>⬆ Importa</button>
        {canRestoreImport ? <button className="btn btn-ghost" onClick={onRestoreImport} title="Annulla l ultimo import e torna allo stato precedente">↩︎ Annulla import</button> : null}
        <button className="btn btn-ghost" onClick={function(){ setExportModal("Excel"); }}>📊 Excel</button>
        <button className="btn btn-ghost" onClick={function(){ setExportModal("PDF"); }}>🖨️ Report PDF A4</button>
        {/* ver153: il report per l'ufficio paghe. Dicitura del pulsante SCELTA da Christian. */}
        <button className="btn btn-ghost" onClick={function(){ setExportModal("PDF A4 mensilizz."); }}>🖨️ Report PDF A4 mensilizz.</button>
        {!FB_READY ? <button className="btn btn-ghost" onClick={changePin}>🔑 PIN</button> : null}
        {FB_READY ? <button className="btn btn-ghost" onClick={function(){ if (dirty && !window.confirm("Ci sono modifiche non salvate. Uscire comunque?")) return; firebase.auth().signOut(); }}>Esci</button> : null}
        <input ref={fileRef} type="file" accept=".xlsx,.xls,.json" className="hidden-file" onChange={onImportFile} />
        <div className="monthstrip">{vista === "rep" ? "📊 Riepiloghi" : (vista === "ana" ? "📇 Anagrafica" : (vista === "costo" ? "💶 Costo orario" : (vista === "query" ? "🔎 Query personale" : ("📅 Tabellone " + MONTH_LABEL[mese-1] + " " + anno + (mLocked ? "  🔒 bloccato" : "")))))}</div>
      </div>

      {!FB_READY ? <div className="banner">Modalità LOCALE (localStorage, accesso con PIN).</div> : null}

      <div className="tabs">
        {MONTH_ABBR.map(function(a,i){
          const d = state.dati[monthKey(anno, i+1)] || {};
          const filled = Object.keys(d).some(function(k){ const rr=d[k]; return rr.giorni && Object.keys(rr.giorni).length>0; });
          return <div key={a} className={"tab" + (vista==="m"+(i+1)?" active":"") + (filled?" filled":"")} onClick={function(){ setVista("m"+(i+1)); }}>{a}</div>;
        })}
        <div className={"tab rep" + (vista==="rep"?" active":"")} onClick={function(){ setVista("rep"); }}>📊 Riepiloghi</div>
        <div className={"tab rep" + (vista==="ana"?" active":"")} onClick={function(){ setVista("ana"); }}>📇 Anagrafica</div>
        <div className={"tab rep" + (vista==="costo"?" active":"")} onClick={function(){ setVista("costo"); }}>💶 Costo orario</div>
        <div className={"tab rep" + (vista==="query"?" active":"")} onClick={function(){ setVista("query"); }}>🔎 Query personale</div>
      </div>

      <div className="zoombar">
        <span className="zlbl">Zoom vista</span>
        <button className="zstep" title="Riduci" onClick={function(){ setZoomP(zoom - 5); }}>−</button>
        <input type="range" min="40" max="110" step="1" value={zoom} onChange={function(e){ setZoomP(parseInt(e.target.value, 10)); }} />
        <button className="zstep" title="Ingrandisci" onClick={function(){ setZoomP(zoom + 5); }}>+</button>
        <span className="zval">{zoom}%</span>
        <button className="btn-fit" title="Adatta la larghezza del mese alla finestra" onClick={fitWidth}>⤢ Adatta larghezza</button>
        <button className="btn-100" onClick={function(){ setZoomP(100); }}>100%</button>
      </div>

      <div className="content" style={{ zoom: zoom / 100 }}>
        {vista === "rep" ? <Riepiloghi state={state} anno={anno} /> :
         vista === "ana" ? <Anagrafica key={"ana-"+(anaSel||"")} selInit={anaSel} onDipPatch={onDipPatch} onMensTutti={onMensTutti} state={state} onAnaField={onAnaField} onAnaSet={onAnaSet} onCessCleanup={onCessCleanup} onTemplateChanged={onTemplateChanged} onImportAna={onImportAna} onExportAna={onExportAna} onAddDip={addDipDiretto} onEditDip={apriScheda} onSave={doSave} dirty={dirty} /> :
         vista === "costo" ? <CostoOrario state={state} anno={anno} onCostoPatch={onCostoPatch} onCostoPatchMulti={onCostoPatchMulti} onCostoComune={onCostoComune} onCCNLAdd={onCCNLAdd} onCCNLDel={onCCNLDel} onSave={doSave} dirty={dirty} /> :
         vista === "query" ? <QueryPanel state={state} /> :
          <div>
            <div className="toolbar">
              <strong style={{ fontSize:"15px", color:"#1f4e82" }}>{MONTH_LABEL[mese-1]} {anno}</strong>
              {mLocked ? <span className="lock-badge">🔒 Mese bloccato</span> : null}
              <div className="spacer"></div>
              <button className={"btn " + (mLocked ? "btn-red" : "btn-gray")} title={mLocked ? "Sblocca il mese per poterlo modificare" : "Blocca il mese: nessuna cella potrà più essere modificata"}
                onClick={toggleLock}>{mLocked ? "🔓 Sblocca mese" : "🔒 Blocca mese"}</button>
              <button className="btn btn-blue" disabled={mLocked} onClick={addDipDiretto}>+ Dipendente</button>
              <button className="btn btn-yellow" onClick={pubblicaResidui} disabled={!!pubEsito}
                title="Manda a ogni dipendente, dentro Fogli ore, quante ore gli restano del suo massimale annuo. Ognuno vede solo il proprio.">📤 Pubblica i residui</button>
              {pubEsito ? <span style={{ fontSize:"12.5px", color:"#475569" }}>{pubEsito}</span> : null}
            </div>
            {/* ver149 (punto 5, risposta di Christian: «Ricorda»): il residuo che l'operatore vede
                dentro Fogli ore e' una fotografia. Se i numeri di oggi sono diversi da quelli
                pubblicati l'ultima volta, qui lo ricorda. ⚠️ Dicitura nuova, scritta da Claude. */}
            {residuiDaRifare ?
              <div style={{ background:"#fff8e1", border:"1px solid #eac87a", borderRadius:"8px", color:"#92400e",
                            fontSize:"13px", fontWeight:700, padding:"7px 10px", margin:"6px 0", lineHeight:1.45 }}
                   title="Il residuo lo vedono dentro Fogli ore solo dopo che premi «📤 Pubblica i residui»">
                ⚠️ <b>I residui pubblicati non sono più aggiornati</b>: {residuiDaRifare.length === 1 ? "è cambiato" : "sono cambiati"} {residuiDaRifare.slice(0,6).join(", ")}{residuiDaRifare.length > 6 ? (" e altri " + (residuiDaRifare.length - 6)) : ""}.
                Dentro Fogli ore vedono ancora i numeri di prima: premi <b>📤 Pubblica i residui</b>.
              </div> : null}
            {mLocked ? <div className="lock-info">Questo mese è bloccato: le celle non sono modificabili. Premi "Sblocca mese" per riaprirlo.</div> : null}
            {foErr ? <div style={{ background:"#f8fafc", border:"1px solid #e2e8f0", borderRadius:"8px", color:"#64748b", fontSize:"11px", padding:"4px 9px", margin:"6px 0", display:"inline-block" }}>confronto Fogli ore non disponibile (permessi)</div> : null}
            {state.dipendenti.length === 0 ?
              <div style={{ padding:"30px", textAlign:"center", color:"#64748b" }}>Nessun dipendente. Aggiungine uno o importa il file Excel.</div>
              :
              dipSorted(state).map(function(dp){
                const recDp = getRecFrom(state, anno, mese, dp.id);
                const ym = anno*100 + mese;
                const aInt = assunzInt(dp); const aMon = aInt ? Math.floor(aInt/100) : 0;
                const ceStr = cessEffStr(dp); const ceInt = ymdIt(ceStr); const ceMon = ceInt ? Math.floor(ceInt/100) : 0;
                const inPeriodo = (!aMon || ym >= aMon) && (!ceMon || ym <= ceMon);
                const haDati = recHasData(recDp);
                if (!inPeriodo && !haDati) return null;
                const fuoriPeriodo = !inPeriodo && haDati;
                const dipList = state.dipendenti.filter(function(x){ return x.id !== dp.id; }).map(function(x){ return x.nome; }).sort(function(a,b){ return a.localeCompare(b); });
                const saldoP = saldoPrec(state, anno, mese, dp.id);
                const bancaP = dp.mensilizzato ? bancaPrecA(state, dp, anno, mese) : 0;
                const tettoNum = tettoForPeriod(dp, anno, mese);
                const tettoC = (!isNaN(tettoNum) && tettoNum>0) ? consumoTetto(state, dp, anno, mese) : 0;
                const ferieApr = (mese===4) ? { year:anno-1, mat:ferieMaturato(state,dp,anno-1), god:ferieGodute(state,dp,anno-1), res:ferieResiduo(state,dp,anno-1), noData:!annoHasData(state,anno-1) } : null;
                /* ver150 (punto 1): due persone con lo stesso nome. Il confronto si SOSPENDE,
                   perche' mostrerebbe le ore di una sola persona come se fossero di questa. */
                const foOmon = (function(){ try { const k = foChiave(dp.nome);
                  const a = (foPerNome && foPerNome.__ambigue) ? foPerNome.__ambigue[k] : null;
                  const b = dipAmb[k] || null;
                  return (a || b) ? { fo:(a || null), dip:(b || null) } : null; } catch (e){ return null; } })();
                const foDiff = (function(){ try { if (foOmon) return null; if (!foPerNome) return null; const agg = foPerNome[foChiave(dp.nome)];   /* ver149 (punto 8) */ return agg ? foConfronta(recDp, anno, mese, agg) : null; } catch (e){ console.error("confronto Fogli ore", e); return null; } })();
                return <EmployeeCard key={dp.id} dp={dp} rec={recDp} fuoriPeriodo={fuoriPeriodo} anno={anno} mese={mese} fset={fset} mLocked={mLocked}
                  dipList={dipList} onCell={onCell} onEro={onEro} onNota={onNota} onFestConfirm={onFestConfirm} onQuickFill={onQuickFill}
                  onVoceSet={onVoceSet} onVoceAdd={onVoceAdd} onVoceDel={onVoceDel} ferieApr={ferieApr} fogliOre={foDiff} fogliOreOmon={foOmon}
                  onDich={onDich} onSvuotaMese={onSvuotaMese} saldoPrec={saldoP} bancaPrec={bancaP} tettoConsumo={tettoC} onAzzeraSaldo={onAzzeraSaldo} onAnnullaAzzera={onAnnullaAzzera}
                  onSostAdd={onSostAdd} onSostChange={onSostChange} onSostDel={onSostDel} onOpenPerm={onOpenPerm}
                  festOre={festGoduteMese(state, dp, anno, mese, null).ore} festGG={festGoduteMese(state, dp, anno, mese, null).gg}
                  banca={bancaMeseA(state, dp, anno, mese)}   /* ver151: un solo numero per il Risultato del mese */
                  onEditDip={apriScheda} onDelDip={askDelDip} onAvviso={showToast} />;
              })
            }
            <div className="legend">
              <h3>Legenda codici</h3>
              <div className="legend-grid">
                {CODICI.map(function(x){ return <div key={x.c} className="legend-item">
                  <span className="legend-code" style={{ background:x.bg, color:lumaText(x.bg) }}>{x.c}</span><span>{x.l}</span></div>; })}
                <div className="legend-item"><span className="legend-code" style={{ background:CRIMSON, color:"#fff" }}>festivo</span><span>Festività nazionale e domeniche (crimson #B22222)</span></div>
                <div className="legend-item"><span className="legend-code" style={{ background:"#7c3aed", color:"#fff" }}>● perm.</span><span>Pallino viola in cella = permesso orario (clic per impostarlo)</span></div>
              </div>
            </div>
          </div>
        }
      </div>

      {quickFill ? <QuickFillModal dp={quickFill} rec={getRecFrom(state, anno, mese, quickFill.id)} anno={anno} mese={mese} fset={fset} onApply={onQuickFillApply} onClose={function(){ setQuickFill(null); }} /> : null}
      {exportModal ? <ExportModal kind={exportModal} anni={state.anni} annoCorrente={anno} meseCorrente={mese}
        onGenera={function(pairs){ if (exportModal === "Excel") esportaExcel(state, pairs); else if (exportModal === "PDF A4 mensilizz.") esportaPDFMens(state, pairs); else esportaPDF(state, pairs); setExportModal(null); }}
        onClose={function(){ setExportModal(null); }} /> : null}
      {permModal ? (function(){
        const rc = getRecFrom(state, anno, mese, permModal.dipId);
        const cur = (rc.permessi && rc.permessi[permModal.day]) ? rc.permessi[permModal.day] : null;
        return <PermModal perm={cur} day={permModal.day} mese={mese} anno={anno} ero={eroOn(rc, permModal.day)}
          onSave={function(obj, erosiva){ onPermSaveEro(permModal.dipId, permModal.day, obj, erosiva); }}
          onDelete={function(){ onPermDelete(permModal.dipId, permModal.day); }}
          onClose={function(){ setPermModal(null); }} />;
      })() : null}
      {confirm ? <ConfirmModal title={confirm.title} body={confirm.body} confirmLabel={confirm.confirmLabel} onConfirm={confirm.onConfirm} onClose={function(){ if (confirm.onCancel) confirm.onCancel(); else setConfirm(null); }} /> : null}
      {toast ? <Toast msg={toast.msg} warn={toast.warn} onDone={function(){ setToast(null); }} /> : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
